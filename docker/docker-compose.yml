# Copyright (C) 2024-2025 Intel Corporation
# SPDX-License-Identifier: Apache-2.0
#
# Services (always-on core):
#   vllm            — CPU LLM inference server (port 2080)
#   litellm         — GenAI Gateway / OpenAI-compatible API (port 4000)
#   postgres        — PostgreSQL 16 + pgvector (shared: litellm, flowise, langfuse, rag) (port 5432)
#   redis           — Redis Stack (shared: LiteLLM routing, Flowise queue, RAG search) (port 6379)
#   flowise         — Visual agent builder (port 3000)
#
# Optional profiles:
#   --profile observability Langfuse LLM tracing (ClickHouse + MinIO)
#
# Quickstart:
#   bash scripts/deploy.sh    # generates .env from config.cfg automatically
#
# Manual start:
#   docker compose up -d
# =============================================================================

networks:
  agentic-net:
    driver: bridge
    name: docker_agentic-net

volumes:
  vllm-models:
  postgres-data:
  flowise-data:
  clickhouse-data:
  minio-data:
  redis-data:

services:

  # ===========================================================================
  # PostgreSQL — single shared instance (pgvector/pgvector:pg16)
  # Databases: litellm · flowisedb · langfuse · agentdb (vector)
  # Per-service users created by docker/postgres/init.sql (generated by deploy.sh)
  # init.sql runs once on first start; to rotate passwords after that use:
  #   docker exec agentic-postgres psql -U postgres -c "ALTER USER litellm WITH PASSWORD 'new';"
  # Exposed on port 5432 for pgAdmin / external RAG tooling
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-postgres
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Redis Stack — shared cache, queues, and vector search (RediSearch)
  # Used by: LiteLLM (routing), Flowise (job queue), Langfuse (events), RAG (RediSearch vector index)
  # Exposed on port 6379 for external access
  # ===========================================================================
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: agentic-redis
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      - "6379:6379"
    command: >
      redis-server
      --aclfile /etc/redis/acl.conf
      --save 60 1
      --loglevel warning
      --protected-mode no
    volumes:
      - redis-data:/data
      - ./redis/acl.conf:/etc/redis/acl.conf:ro
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user admin -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # LiteLLM — GenAI Gateway (OpenAI-compatible proxy)
  # ===========================================================================
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.83.14-stable.patch.2
    container_name: agentic-litellm
    restart: unless-stopped
    cap_drop:
      - ALL
    ports:
      - "4000:4000"
    command: >
      --config /app/config.yaml
      --port 4000
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD}@postgres:5432/${LITELLM_DB_NAME:-litellm}
      REDIS_URL: "redis://litellm:${LITELLM_REDIS_PASSWORD}@redis:6379"
      STORE_MODEL_IN_DB: "True"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_HOST: "http://langfuse-web:3000"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,vllm,postgres,redis,langfuse-web}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,vllm,postgres,redis,langfuse-web}"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5

  # ===========================================================================
  # Flowise — Visual Agent Builder (3.1.2)
  # ===========================================================================
  #
  flowise:
    image: flowiseai/flowise:3.1.2
    container_name: agentic-flowise
    profiles: [flowise]
    restart: unless-stopped
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      # Use development mode to relax strict production validations (e.g., HTTPS requirements)
      NODE_ENV: development
      PORT: "3000"
      # Database
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${FLOWISE_DB_NAME:-flowisedb}
      DATABASE_USER: ${FLOWISE_DB_USER:-flowise}
      DATABASE_PASSWORD: ${FLOWISE_DB_PASSWORD}
      DATABASE_SSL: "false"
      # Redis queue
      REDIS_URL: "redis://flowise:${FLOWISE_REDIS_PASSWORD}@redis:6379"
      # GenAI Gateway
      FLOWISE_LITELLM_BASE_URL: "http://litellm:4000/v1"
      FLOWISE_LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      FLOWISE_LITELLM_MODEL_NAME: ${LLM_MODEL_ID:-Qwen/Qwen2.5-Coder-14B-Instruct}
      FLOWISE_PGVECTOR_URL: "postgresql://${PGVECTOR_USER}:${PGVECTOR_PASSWORD}@postgres:5432/${PGVECTOR_DB}"
      # Storage paths
      APIKEY_PATH: /data
      SECRETKEY_PATH: /data
      LOG_PATH: /data/logs
      BLOB_STORAGE_PATH: /data/storage
      OVERRIDE_DATABASE: "false"
      DISABLE_FLOWISE_TELEMETRY: "true"
      # Proxy configuration
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1,litellm,postgres,redis}"
    volumes:
      - flowise-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ===========================================================================
  # Observability — Langfuse + ClickHouse + MinIO  (profile: observability)
  # ===========================================================================
  clickhouse:
    image: bitnamilegacy/clickhouse:25.2.1
    container_name: agentic-clickhouse
    restart: unless-stopped
    profiles: [observability]
    cap_drop:
      - ALL
    environment:
      CLICKHOUSE_ADMIN_USER: default
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse-data:/bitnami/clickhouse
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_ADMIN_PASSWORD\" --query 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  minio:
    image: bitnamilegacy/minio:2024.12.18
    container_name: agentic-minio
    restart: unless-stopped
    profiles: [observability]
    cap_drop:
      - ALL
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "9001:9001"      # MinIO console
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  langfuse-web:
    image: langfuse/langfuse:3.106.1
    container_name: agentic-langfuse-web
    restart: unless-stopped
    profiles: [observability]
    cap_drop:
      - ALL
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@postgres:5432/${LANGFUSE_DB_NAME:-langfuse}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: langfuse
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://default:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: langfuse
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: "http://${DOMAIN:-localhost}/langfuse"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      # Pre-seed admin project
      LANGFUSE_INIT_ORG_ID: "agentic-stack"
      LANGFUSE_INIT_ORG_NAME: "Agentic AI Stack"
      LANGFUSE_INIT_PROJECT_ID: "agentic-project"
      LANGFUSE_INIT_PROJECT_NAME: "AI Inference"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@admin.com}
      LANGFUSE_INIT_USER_NAME: "admin"
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agentic-net

  langfuse-worker:
    image: langfuse/langfuse-worker:3.106.1
    container_name: agentic-langfuse-worker
    restart: unless-stopped
    profiles: [observability]
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@postgres:5432/${LANGFUSE_DB_NAME:-langfuse}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: langfuse
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://default:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: langfuse
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - agentic-net

# Docker vLLM Model Configuration Library
# ========================================
#
# This file defines model-specific configurations for vLLM deployments in Docker.
# Each model can specify custom environment variables, command arguments, and resources.
#
# Configuration Structure:
# ------------------------
# models:
#   "org/model-name":                    # Full HuggingFace model ID (required)
#     served_name: "url-safe-identifier" # Used ONLY for Docker resource naming (container, hostname)
#                                         # The API uses the full HuggingFace model ID
#                                         # Auto-generated if omitted
#     environment:                        # Container environment variables
#       VLLM_CPU_KVCACHE_SPACE: "40"     # KV cache size in GB
#       VLLM_RPC_TIMEOUT: "100000"       # RPC timeout in milliseconds
#       # ... additional env vars
#     command_args:                       # vLLM CLI arguments (array)
#       - "--block-size"
#       - "128"
#       - "--dtype"
#       - "bfloat16"
#       # ... additional args
#     resources:                          # Resource limits (optional)
#       memory: "128g"
#       shm_size: "16g"                   # Shared memory size
#
# Usage:
# ------
# 1. Set models in docker/config.cfg:
#    models=Qwen/Qwen2.5-Coder-14B-Instruct,meta-llama/Llama-3.1-8B-Instruct
#
# 2. Generate docker-compose.vllm.yml:
#    bash docker/scripts/generate-docker-compose.sh
#
# 3. Deploy:
#    ./deploy-agentic-stack.sh --platform=docker
#
# Notes:
# ------
# - Use full HuggingFace IDs only (no aliases)
# - served_name is auto-generated for Docker resource naming (containers, volumes)
# - API calls use the full HuggingFace model ID (e.g., "Qwen/Qwen2.5-Coder-14B-Instruct")
# - Unknown models fallback to default configuration
# - Memory requirements: ~80GB per LLM model

models:
  "google/gemma-4-26B-A4B-it":
    served_name: "google-gemma-4-26b-a4b-it"
    environment:
      TRITON_CACHE_DIR: "/tmp/.triton"
      VLLM_CPU_KVCACHE_SPACE: "40"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      USER: "vllm"
    command_args:
      - "--block-size"
      - "128"
      - "--dtype"
      - "bfloat16"
      - "--distributed_executor_backend"
      - "mp"
      - "--enable_chunked_prefill"
      - "--enforce-eager"
      - "--max-model-len"
      - "32768"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "gemma4"
      - "--chat-template"
      - "/vllm-workspace/examples/tool_chat_template_gemma4.jinja"
    volumes:
      - "../core/helm-charts/vllm/files:/vllm-workspace/examples:ro"
    resources:
      memory: "128g"
      shm_size: "16g"

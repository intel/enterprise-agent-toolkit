# Default fallback configuration for unknown models
default:
  served_name: "auto-generated" # Will be auto-generated from model ID
  task: text_generation
  weight_format: int8
  environment: {}
  extra_args:
    - "--cache_size"
    - "12"
    - "--max_num_seqs"
    - "256"
  resources:
    memory: "80g"

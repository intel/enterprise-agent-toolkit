  # ---------------------------------------------------------------------------
  # Pre-converted IR models from the OpenVINO organization: no optimum-cli
  # export, so they start in minutes on a fraction of the memory a converted
  # model needs. The small ones are the quickest way to smoke-test the stack.
  # Note: the OpenVINO org publishes no Llama-3.2 IR repos — for those, point
  # models= at the meta-llama ID above and let OVMS convert it.

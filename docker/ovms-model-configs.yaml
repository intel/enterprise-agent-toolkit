    source_model: "meta-llama/Llama-3.1-8B-Instruct"
    task: text_generation
    weight_format: int4
    tool_parser: llama3
    extra_args:
      - "--cache_size"
      - "12"
      - "--max_num_seqs"
      - "256"
    speculative_decoding:

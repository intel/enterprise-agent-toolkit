# Docker OpenVINO Model Server (OVMS) Configuration Library
# =========================================================
#
# This file defines model-specific configurations for OVMS deployments in Docker.
# It is the OpenVINO counterpart of model-configs.yaml (vLLM) and is used when
# docker/config.cfg has:
#
#   serving_engine=openvino
#
# The models= line in docker/config.cfg is shared between both engines, so the
# same model IDs work either way — only the serving runtime changes.
#
# Configuration Structure:
# ------------------------
# models:
#   "org/model-name":                     # Full HuggingFace model ID (required)
#     served_name: "url-safe-identifier"  # Used ONLY for Docker resource naming (container, hostname)
#                                          # The API uses the full HuggingFace model ID
#                                          # Auto-generated if omitted
#     source_model: "OpenVINO/..."        # Optional: HuggingFace repo OVMS actually pulls.
#                                          # Defaults to the model ID above. Point this at a
#                                          # pre-converted IR repo to skip runtime conversion.
#     task: text_generation               # text_generation | embeddings | rerank | image_generation
#     weight_format: int4                 # optimum-cli export precision — only applies to models
#                                          # outside the OpenVINO org (int4, int8, fp16, fp32, ...)
#     tool_parser: llama3                 # Optional: llama3 | hermes3 | phi4 (OVMS 2025.4 set)
#     rest_workers: 32                    # Optional: REST thread pool size (default 32).
#                                          # Left unset, OVMS derives it from the host core
#                                          # count and exhausts the container's file
#                                          # descriptors on many-core servers.
#     litellm_mode: embedding             # Optional: registers a non-chat mode in LiteLLM
#     environment:                        # Container environment variables
#       OVMS_LOG_LEVEL: "INFO"
#     extra_args:                         # Additional OVMS CLI arguments (array)
#       - "--max_num_seqs"
#       - "256"
#     speculative_decoding:               # Optional: draft model for speculative decoding
#       draft_model: "org/small-model"
#     resources:                          # Resource limits (optional)
#       memory: "64g"
#
# Usage:
# ------
# 1. Select the engine and models in docker/config.cfg:
#    serving_engine=openvino
#    models=Qwen/Qwen2.5-Coder-14B-Instruct,BAAI/bge-base-en-v1.5
#
# 2. Generate docker-compose.ovms.yml:
#    bash docker/scripts/generate-docker-compose.sh
#
# 3. Deploy:
#    ./deploy-agentic-stack.sh --platform=docker
#
# Notes:
# ------
# - Models under the "OpenVINO/" org are already in IR format: OVMS downloads and
#   serves them directly, which is far faster and needs much less memory.
# - Any other model is converted and quantized on first start with optimum-cli.
#   That conversion needs roughly as much memory as the original fp16 checkpoint,
#   which is why the memory limits below stay high even for int4 output.
# - The first start of a converted model can take 30+ minutes (download + export).
#   Converted weights are cached in the per-model Docker volume, so later starts
#   only load the model.
# - OVMS 2025.4 tool calling covers llama3/hermes3/phi4 templates only. Models
#   without a matching parser still serve chat completions, just without
#   automatic tool_calls extraction.
# - OVMS 2025.4 has no speech-to-text task, so openai/whisper-small is vLLM-only.

models:
  "google/gemma-4-26B-A4B-it":
    served_name: "google-gemma-4-26b-a4b-it"
    task: text_generation
    weight_format: int4
    extra_args:
      - "--cache_size"
      - "20"
      - "--max_num_seqs"
      - "256"
    resources:
      memory: "128g"
  "meta-llama/Llama-3.1-8B-Instruct":
    served_name: "llama-3-1-8b-instruct"
    task: text_generation
    weight_format: int4
    tool_parser: llama3
    extra_args:
      - "--cache_size"
      - "12"
      - "--max_num_seqs"
      - "256"
    resources:
      memory: "64g"
  "meta-llama/Llama-3.1-8B-Instruct-Specdec":

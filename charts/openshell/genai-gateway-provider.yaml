# OpenShell provider profile for the EAT GenAI Gateway (LiteLLM, OpenAI-compatible).
# GENAI_HOST / GENAI_PORT are substituted by the openshell role.
id: eat-genai-gateway
display_name: EAT GenAI Gateway (LiteLLM)
description: Intel® Enterprise Agent Toolkit LiteLLM gateway (OpenAI-compatible)
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: LiteLLM virtual key (model-scoped, budgeted)
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: GENAI_HOST
    port: GENAI_PORT
    protocol: rest
    access: read-write
    enforcement: enforce
# Binary identity matches the executable's real path: `python3` is a link to a versioned
# interpreter, and a venv python resolves to its base one. On 0.1.x the supervisor runs in its own
# pod and cannot resolve a link inside the workload, so list real paths or globs: `python3*`
# matches whichever Python the image ships (Debian's 3.11 in openclaw-sandbox, 3.12 on Ubuntu
# 24.04). 0.1.x accepts `*` within a path segment but not `**`: a profile with `**` leaves every
# sandbox that attaches it in ConfigurationInvalid.
binaries:
  - /usr/bin/curl
  - /usr/bin/python3*
  - /usr/local/bin/python3*
  - /sandbox/.uv/python/*/bin/python3*
  # OpenCode (community image): its Node launcher execs this binary.
  - /usr/lib/node_modules/opencode-ai/bin/.opencode
  # OpenClaw (openshell agent runtime, the openclaw-sandbox image).
  - /usr/local/bin/node

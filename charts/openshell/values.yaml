# EAT overlay for the upstream OpenShell Helm chart (oci://ghcr.io/nvidia/openshell/helm-chart).
# Namespace, image tag, proxy, auth and node placement are set by the openshell role.

global:
  image:
    pullPolicy: IfNotPresent

server:
  # Upstream default sends anonymous usage telemetry; enterprise deployments opt out.
  telemetryEnabled: false
  drivers:
    kubernetes:
      # Workspaces are pre-provisioned namespaces (operatorNamespaceLabel is set by the role).
      workspaceMode: operator

# The gateway release only; each workspace namespace gets the openshell-workspace chart.
workspaceResources:
  enabled: false

gatewayConfig:
  openshell.drivers.kubernetes:
    # Sandboxes in the ambient mesh opt out of ztunnel's DNS capture, which the sandbox
    # runtime's DNS self-check rejects (the agent operator sets it on openshell agents).
    allowed_pod_annotations: ["ambient.istio.io/dns-capture"]

# Agent Sandbox CRDs/controller come from deploy_agent_sandbox; fail fast if absent.
agentSandbox:
  preflight:
    enabled: true

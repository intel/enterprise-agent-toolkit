# ---------------------------------------------------------------------------
# Default SandboxTemplate — deployed to the 'agent-sandbox-system' namespace
# so all Agent Sandbox components share one namespace and the controller's
# auto-generated NetworkPolicy (which allows ingress from app=sandbox-router
# pods in the same namespace) permits router → sandbox traffic:
#
#   from k8s_agent_sandbox import SandboxClient
#   client = SandboxClient()
#   sandbox = client.create_sandbox(warmpool="python-pool", namespace="agent-sandbox-system")
#
# The install creates the python-pool SandboxWarmPool for this template; calls through the
# router need its token (docs/agent-sandbox.md, "Router token").
# ---------------------------------------------------------------------------
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-sandbox-template
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/managed-by: agentic-ai-stack
spec:
  # service: true ensures a headless Service is created for each Sandbox pod.
  # Required in v0.4.6+ for in-cluster DNS routing and SDK Tunnel mode.
  service: true
  podTemplate:
    metadata:
      labels:
        # Outside the ambient mesh: mesh-redirected traffic bypasses the sandbox NetworkPolicy
        istio.io/dataplane-mode: none
    spec:
      containers:
      - name: runtime
        image: python-runtime-sandbox:AGENT_SANDBOX_VERSION
        imagePullPolicy: Never
        ports:
        - name: api
          containerPort: 8888
          protocol: TCP
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
---

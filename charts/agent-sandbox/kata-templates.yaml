# ---------------------------------------------------------------------------
# Kata-backed SandboxTemplate — each sandbox boots as its own microVM with a
# separate guest kernel instead of sharing the host kernel like a runc pod:
#
#   client.create_sandbox(template="kata-sandbox-template",
#                         namespace="agent-sandbox-system")
#
# Placeholders substituted at deploy time by the agent_sandbox role:
#   KATA_RUNTIME_CLASS      → kata-fc (preferred) or kata-qemu
#   KATA_NODE_LABEL_KEY     → kata_node_label_key
#   AGENT_SANDBOX_VERSION   → the python-runtime-sandbox image tag
#
# The image is the same published python-runtime-sandbox the default template
# uses, so the k8s-agent-sandbox SDK works against both templates unchanged.
# ---------------------------------------------------------------------------
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: kata-sandbox-template
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/managed-by: agentic-ai-stack
spec:
  # service: true creates a headless Service per Sandbox pod — required for
  # in-cluster DNS routing and SDK Tunnel mode.
  service: true
  podTemplate:
    metadata:
      labels:
        sandbox: kata
        # Kata microVMs cannot join the ambient mesh
        istio.io/dataplane-mode: none
    spec:
      runtimeClassName: KATA_RUNTIME_CLASS
      # Only nodes that passed the KVM preflight can run microVMs.
      nodeSelector:
        KATA_NODE_LABEL_KEY: "true"
      containers:
      - name: runtime
        image: python-runtime-sandbox:AGENT_SANDBOX_VERSION
        imagePullPolicy: Never
        ports:
        - name: api
          containerPort: 8888
          protocol: TCP
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
---

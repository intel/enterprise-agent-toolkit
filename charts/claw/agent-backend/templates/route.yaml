{{- with .Values.route.hostname }}
# https://<hostname>/api, and the console at / when enabled. One policy for both, so a browser's
# sign-in covers its API calls; this route's policy replaces the gateway-wide one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-backend-api
  namespace: {{ $.Release.Namespace }}
  labels: {app.kubernetes.io/name: agent-backend}
spec:
  parentRefs:
    - name: {{ $.Values.route.gateway.name }}
      namespace: {{ $.Values.route.gateway.namespace }}
      sectionName: {{ $.Values.route.gateway.sectionName }}
  hostnames: [{{ . | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - {name: agent-backend, port: 3000}
    {{- if $.Values.console.enabled }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: agent-console, port: 3000}
    {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-backend-api
  namespace: {{ $.Release.Namespace }}
  labels: {app.kubernetes.io/name: agent-backend}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: agent-backend-api}
  {{- if $.Values.console.enabled }}
  # Browsers sign in; a request that already carries a bearer token (a script) skips it.
  oidc:
    provider:
      issuer: {{ $.Values.auth.issuer | quote }}
      authorizationEndpoint: {{ printf "%s/protocol/openid-connect/auth" $.Values.auth.issuer | quote }}
      tokenEndpoint: {{ required "auth.tokenUrl is required with the console" $.Values.auth.tokenUrl | quote }}
    clientID: {{ $.Values.console.oidcClientId | quote }}
    clientSecret: {name: {{ $.Values.console.oidcSecret }}}
    redirectURL: {{ printf "https://%s/oauth2/callback" . | quote }}
    logoutPath: /oauth2/logout
    forwardAccessToken: true
    refreshToken: true
    passThroughAuthHeader: true
    # The console's API calls get a 401 to act on, not a sign-in page.
    denyRedirect:
      headers:
        - {name: x-requested-with, value: XMLHttpRequest}
  {{- end }}
  jwt:
    providers:
      - name: keycloak
        issuer: {{ $.Values.auth.issuer | quote }}
        audiences: [{{ $.Values.auth.audience | quote }}]
        remoteJWKS:
          uri: {{ $.Values.auth.jwksUrl | quote }}
          cacheDuration: 300s
{{- end }}

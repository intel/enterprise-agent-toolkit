{{- with .Values.route.hostname }}
# https://<hostname>/api; this route's own JWT policy replaces the gateway-wide one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-backend-api
  namespace: {{ $.Release.Namespace }}
  labels: {app.kubernetes.io/name: agent-backend}
spec:
  parentRefs:
    - name: {{ $.Values.route.gateway.name }}
      namespace: {{ $.Values.route.gateway.namespace }}
      sectionName: {{ $.Values.route.gateway.sectionName }}
  hostnames: [{{ . | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - {name: agent-backend, port: 3000}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-backend-api
  namespace: {{ $.Release.Namespace }}
  labels: {app.kubernetes.io/name: agent-backend}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: agent-backend-api}
  jwt:
    providers:
      - name: keycloak
        issuer: {{ $.Values.auth.issuer | quote }}
        audiences: [{{ $.Values.auth.audience | quote }}]
        remoteJWKS:
          uri: {{ $.Values.auth.jwksUrl | quote }}
          cacheDuration: 300s
{{- end }}

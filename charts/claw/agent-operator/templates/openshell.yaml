{{- with .Values.openshell }}
{{- if .enabled }}
# The OpenShell gateway's access in each openshell agent namespace (its workspace): the rules
# of the openshell-workspace chart's Role. The operator binds it per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator-openshell-workspace
  labels:
    app.kubernetes.io/name: agent-operator
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
# The gateway pods for the agents' routes, without appProtocol grpc: the platform gateway then
# speaks HTTP/1.1, which the dashboard's WebSocket needs. The CLI and supervisors keep `service`.
apiVersion: v1
kind: Service
metadata:
  name: {{ .routeService }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: agent-operator
spec:
  selector:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: {{ .releaseName }}
  ports:
    - {name: https, port: 8080, targetPort: 8080, protocol: TCP}
---
# An openshell agent's /gw/ route, in the operator namespace, targets that Service.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: agent-operator-routes
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: agent-operator
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: {{ $.Release.Namespace }}}
  to:
    - {group: "", kind: Service, name: {{ .routeService }}}
---
# The platform gateway connects to the OpenShell gateway over TLS and verifies it against the
# OpenShell CA. The sandbox is chosen by Host, so one server name serves every agent.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: agent-operator-openshell
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: agent-operator
spec:
  targetRefs:
    - {group: "", kind: Service, name: {{ .routeService }}}
  validation:
    caCertificateRefs:
      - {group: "", kind: ConfigMap, name: {{ .caConfigMap }}}
    hostname: {{ .serviceDomain }}
{{- end }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "mcp-server.fullname" . }}
  ports:
    - {name: mcp, port: {{ .Values.port }}, targetPort: mcp}

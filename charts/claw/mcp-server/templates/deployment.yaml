apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcp-server.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "mcp-server.labels" . | nindent 8 }}
    spec:
      {{- if .Values.rbac.rules }}
      serviceAccountName: {{ include "mcp-server.fullname" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ required "image.tag is required" .Values.image.tag | printf "%s:%s" .Values.image.repository }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/code/mcp/{{ required "script is required" .Values.script }}"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - {name: PORT, value: {{ .Values.port | quote }}}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: mcp, containerPort: {{ .Values.port }}}
          # SSE endpoints stream forever, so the probes check the socket.
          livenessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket: {port: mcp}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}

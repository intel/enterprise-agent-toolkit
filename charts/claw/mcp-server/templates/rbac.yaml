{{- with .Values.rbac.rules }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp-server.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-server.fullname" $ }}
  namespace: {{ required "rbac.namespace is required with rbac.rules" $.Values.rbac.namespace }}
  labels:
    {{- include "mcp-server.labels" $ | nindent 4 }}
rules:
  {{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp-server.fullname" $ }}
  namespace: {{ $.Values.rbac.namespace }}
  labels:
    {{- include "mcp-server.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp-server.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-server.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}

##############################################################################
# Agentic AI Plugin - Internal Variables
##############################################################################
# These are internal implementation variables for the Agentic AI plugin.
# Users should not need to modify these values, with one exception: the
# "First-Boot Owner Protection" section below is site-specific and may be tuned.
# Currently implements: Flowise (visual AI agent builder)
##############################################################################

# Namespace
agenticai_namespace: flowise

# Image Configuration
agenticai_image_repository: flowiseai/flowise
agenticai_image_tag: "3.1.2"
agenticai_replica_count: 1

# Database Configuration (PostgreSQL)
agenticai_database_type: postgres
agenticai_postgres_enabled: true
agenticai_postgres_version: 15
agenticai_postgres_port: 5432
agenticai_postgres_database: flowisedb
agenticai_postgres_username: flowise
agenticai_postgres_storage_size: 5Gi

# Redis Configuration
agenticai_redis_enabled: true
agenticai_redis_port: 6379
agenticai_redis_storage_size: 2Gi

# Worker Configuration
agenticai_worker_enabled: true
agenticai_worker_replica_count: 1
agenticai_worker_cpu_request: 500m
agenticai_worker_memory_request: 1Gi
agenticai_worker_cpu_limit: 1
agenticai_worker_memory_limit: 2Gi

# Application Resources
agenticai_cpu_request: 500m
agenticai_memory_request: 1Gi
agenticai_cpu_limit: 1
agenticai_memory_limit: 2Gi

# Ingress Configuration
agenticai_ingress_enabled: true
agenticai_ingress_class: nginx
agenticai_ingress_path: /
agenticai_tls_enabled: true

##############################################################################
# First-Boot Owner Protection
##############################################################################
# Flowise 3.1.2 creates its first organization owner through an UNAUTHENTICATED
# POST /api/v1/account/register.  Until an administrator has completed the
# "Setup Account" page, whichever caller reaches that endpoint first becomes the
# sole organization owner; everyone after them is rejected with "You can only
# have one organization".  The account therefore needs to be claimed by the
# administrator rather than by whoever reaches the endpoint first, so that one
# path is not served to the whole network by default.
#
# The site is published at https://flowise-<cluster_url> as always; what changes is
# WHO can reach the registration endpoint.  That single path is served by its own
# Ingress rule carrying a source restriction, so nginx answers 403 to every other
# source before the request ever reaches Flowise.  The administrator still creates
# the account by hand on the "Setup Account" page — nothing is provisioned in code.
#
# agenticai_setup_source_ranges — who may create the administrator account.
#
#   ""  (default)  No external network may.  Create the owner once over a
#                  port-forward, which reaches the pod directly and bypasses the
#                  Ingress entirely:
#                      kubectl port-forward -n flowise svc/flowise 3000:3000
#                      then open http://localhost:3000
#
#   CIDR list      Do the same thing in the browser at https://flowise-<cluster_url>
#                  instead, from the listed networks.  Comma-separated, e.g.
#                      agenticai_setup_source_ranges: "192.0.2.0/24,198.51.100.9/32"
#
# Either way the site itself is published at https://flowise-<cluster_url> from the
# first deployment, and everything else about it (login, canvas, chatflow APIs)
# stays reachable from anywhere the Ingress serves.  Only account creation is
# narrowed, and only until the owner exists.
#
# Note: this relies on nginx seeing the real client address.  The stack's
# ingress-nginx runs with hostPort enabled, so it does.  Behind an external L4
# load balancer that SNATs, set controller.config.use-forwarded-headers and list
# the client ranges accordingly.
#
# agenticai_lock_registration — OPTIONAL defence in depth.  Adds
# DENYLIST_URLS=/api/v1/account/register, which drops the endpoint from Flowise's
# public whitelist entirely: it then answers 401 to everyone, including over a
# port-forward.  Only turn this on AFTER the owner account exists, or there will be
# no way to create one.  It costs no functionality in open-source mode: the endpoint
# only ever succeeds for the first organization and returns 400 for every later
# caller, authenticated or not.
#
# ⚠  Leave agenticai_lock_registration=false if you ever configure
#    FLOWISE_EE_LICENSE_KEY.  Flowise Enterprise reuses that same endpoint to let
#    INVITED users complete their signup with an invite code, so locking it would
#    block multi-user onboarding.
##############################################################################
agenticai_setup_source_ranges: ""
agenticai_lock_registration: false

# Storage Configuration
agenticai_persistence_enabled: true
agenticai_persistence_storage_class: local-path
agenticai_persistence_access_mode: ReadWriteOnce
agenticai_persistence_size: 10Gi

# Helm Chart Configuration
agenticai_helm_repo_name: cowboysysop
agenticai_helm_repo_url: https://cowboysysop.github.io/charts/
agenticai_helm_chart_name: flowise
agenticai_helm_chart_version: "6.0.0"


# Autoscaling (disabled by default for simplicity)
agenticai_autoscaling_enabled: false
agenticai_autoscaling_min_replicas: 1
agenticai_autoscaling_max_replicas: 3
agenticai_autoscaling_target_cpu: 80
agenticai_autoscaling_target_memory: 80

##############################################################################
# Inference Endpoint (GenAI Gateway / LiteLLM)
# Points Flowise to the stack's LiteLLM gateway so agent flows can call
# the deployed inference models using OpenAI-compatible APIs.
#
# Exposed inside Flowise pods as environment variables:
#   FLOWISE_LITELLM_BASE_URL  -- base URL for chatOpenAICustom nodes
#   FLOWISE_LITELLM_API_KEY   -- populated from vault litellm_master_key
#   FLOWISE_LITELLM_MODEL_NAME -- default model registered in LiteLLM
##############################################################################
agenticai_inference_endpoint: "http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/v1"
agenticai_inference_model: "cpu-qwen2-5-coder-14b"

##############################################################################
# PGVector Database URL
# Stack-deployed PostgreSQL 16 + pgvector (namespace: pgvector).
# Exposed as FLOWISE_PGVECTOR_URL so Flowise RAG flows can reference it
# in PostgreSQL vector store nodes using {{FLOWISE_PGVECTOR_URL}}.
##############################################################################
agenticai_pgvector_connection_url: "postgresql://agentuser:agentpass@pgvector.pgvector.svc.cluster.local:5432/agentdb"

---
- name: Deploy Agentic AI Plugin
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"

  vars_files:
    - "{{ lookup('env', 'PWD') }}/../../plugins/agenticai/vars/agenticai-plugin-vars.yml"
    - "{{ lookup('env', 'PWD') }}/config/vault.yml"

  roles:
    - role: inference-tools

  tasks:
    ###########################################################################
    # Info
    ###########################################################################
    - name: Display Flowise Deployment Configuration
      debug:
        msg:
          - "=============================================="
          - "Deploying Flowise Agentic Plugin"
          - "Namespace: {{ agenticai_namespace }}"
          - "Domain: flowise-{{ cluster_url }}"
          - "Ingress Class: {{ agenticai_ingress_class }}"
          - "Worker Enabled: {{ agenticai_worker_enabled }}"
          - "=============================================="
      run_once: true

    ###########################################################################
    # First-boot owner protection — see agenticai-plugin-vars.yml for the
    # rationale.  Flowise bootstraps its first organization owner through an
    # unauthenticated POST /api/v1/account/register; that path is published on
    # its own Ingress rule restricted to agenticai_setup_source_ranges so only
    # the administrator's network can claim the deployment.
    ###########################################################################
    - name: Resolve First-Boot Protection Settings
      set_fact:
        # Empty agenticai_setup_source_ranges means "no network may create the
        # administrator account".  127.0.0.1/32 expresses that in the one thing
        # ingress-nginx accepts here — a CIDR list — because no external client can
        # present a loopback source address to the controller.  Account setup is
        # then done over `kubectl port-forward`, which talks to the pod through the
        # API server and so never passes this rule at all.
        agenticai_setup_ranges_effective: >-
          {{ (agenticai_setup_source_ranges | default('', true) | trim) or '127.0.0.1/32' }}
        agenticai_setup_open_to_network: "{{ (agenticai_setup_source_ranges | default('', true) | trim) | length > 0 }}"
        agenticai_denylist_urls: "{{ '/api/v1/account/register' if agenticai_lock_registration | bool else '' }}"
      run_once: true

    ###########################################################################
    # Namespace
    ###########################################################################
    - name: Ensure Flowise Namespace Exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ agenticai_namespace }}"
      run_once: true

    ###########################################################################
    # TLS Secret
    ###########################################################################
    - name: Create TLS Secret for Flowise
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: "flowise-{{ cluster_url }}"
            namespace: "{{ agenticai_namespace }}"
          data:
            tls.crt: "{{ lookup('file', cert_file) | b64encode }}"
            tls.key: "{{ lookup('file', key_file) | b64encode }}"
      when: agenticai_tls_enabled | bool
      run_once: true

    ###########################################################################
    # Helm Repo
    ###########################################################################
    - name: Add Flowise Helm Repository
      command: >
        helm repo add {{ agenticai_helm_repo_name }} {{ agenticai_helm_repo_url }}
      register: helm_repo_add
      changed_when: "'already exists' not in helm_repo_add.stderr"
      failed_when: helm_repo_add.rc != 0 and 'already exists' not in helm_repo_add.stderr
      run_once: true

    - name: Update Helm Repositories
      command: helm repo update
      run_once: true

    ###########################################################################
    # Validate Required Secrets
    ###########################################################################
    - name: Validate PostgreSQL Password is Set
      fail:
        msg: |
          ERROR: PostgreSQL password is not set!
          Please ensure 'agenticai_postgres_password' is defined in vault.yml.
          This is required for production security.
      when: agenticai_postgres_password is not defined or agenticai_postgres_password | length == 0
      run_once: true

    - name: Validate Redis Password is Set
      fail:
        msg: |
          ERROR: Redis password is not set!
          Please ensure 'agenticai_redis_password' is defined in vault.yml.
          This is required for production security.
      when: agenticai_redis_password is not defined or agenticai_redis_password | length == 0
      run_once: true

    ###########################################################################
    # Deploy Flowise (NO ingress via Helm)
    ###########################################################################
    - name: Install or Upgrade Flowise via Helm
      shell: |
        helm upgrade --install flowise {{ agenticai_helm_repo_name }}/{{ agenticai_helm_chart_name }} \
          --namespace {{ agenticai_namespace }} \
          --create-namespace \
          --set image.repository={{ agenticai_image_repository }} \
          --set image.tag={{ agenticai_image_tag }} \
          --set replicaCount={{ agenticai_replica_count }} \
          --set env.DATABASE_TYPE={{ agenticai_database_type }} \
          --set env.DATABASE_HOST=flowise-postgresql.{{ agenticai_namespace }}.svc.cluster.local \
          --set env.DATABASE_PORT={{ agenticai_postgres_port }} \
          --set env.DATABASE_NAME={{ agenticai_postgres_database }} \
          --set env.DATABASE_USER={{ agenticai_postgres_username }} \
          --set env.DATABASE_PASSWORD={{ agenticai_postgres_password }} \
          --set env.REDIS_URL=redis://:{{ agenticai_redis_password }}@flowise-redis-master.{{ agenticai_namespace }}.svc.cluster.local:{{ agenticai_redis_port }} \
          --set postgresql.enabled={{ agenticai_postgres_enabled }} \
          --set postgresql.auth.username={{ agenticai_postgres_username }} \
          --set postgresql.auth.password={{ agenticai_postgres_password }} \
          --set postgresql.auth.database={{ agenticai_postgres_database }} \
          --set postgresql.primary.persistence.size={{ agenticai_postgres_storage_size }} \
          --set redis.enabled={{ agenticai_redis_enabled }} \
          --set redis.auth.password={{ agenticai_redis_password }} \
          --set redis.master.persistence.size={{ agenticai_redis_storage_size }} \
          --set worker.enabled={{ agenticai_worker_enabled }} \
          --set worker.replicaCount={{ agenticai_worker_replica_count }} \
          --set worker.resources.requests.cpu={{ agenticai_worker_cpu_request }} \
          --set worker.resources.requests.memory={{ agenticai_worker_memory_request }} \
          --set worker.resources.limits.cpu={{ agenticai_worker_cpu_limit }} \
          --set worker.resources.limits.memory={{ agenticai_worker_memory_limit }} \
          --set resources.requests.cpu={{ agenticai_cpu_request }} \
          --set resources.requests.memory={{ agenticai_memory_request }} \
          --set resources.limits.cpu={{ agenticai_cpu_limit }} \
          --set resources.limits.memory={{ agenticai_memory_limit }} \
          --set persistence.enabled={{ agenticai_persistence_enabled }} \
          --set persistence.storageClass={{ agenticai_persistence_storage_class }} \
          --set persistence.size={{ agenticai_persistence_size }} \
          --set ingress.enabled=false \
          --set extraEnvVars[0].name=FLOWISE_LITELLM_BASE_URL \
          --set extraEnvVars[0].value={{ agenticai_inference_endpoint }} \
          --set extraEnvVars[1].name=FLOWISE_LITELLM_API_KEY \
          --set extraEnvVars[1].value={{ litellm_master_key }} \
          --set extraEnvVars[2].name=FLOWISE_LITELLM_MODEL_NAME \
          --set extraEnvVars[2].value={{ agenticai_inference_model }} \
          --set extraEnvVars[3].name=FLOWISE_PGVECTOR_URL \
          --set extraEnvVars[3].value={{ agenticai_pgvector_connection_url }} \
          --set extraEnvVars[4].name=DENYLIST_URLS \
          --set-string extraEnvVars[4].value='{{ agenticai_denylist_urls }}' \
          --set extraEnvVars[5].name=SECURE_COOKIES \
          --set-string extraEnvVars[5].value=true \
          --set extraEnvVars[6].name=APP_URL \
          --set-string extraEnvVars[6].value=https://flowise-{{ cluster_url }} \
          --wait \
          --timeout 10m
      run_once: true

    ###########################################################################
    # Account-Setup Ingress (source-restricted)
    #
    # POST /api/v1/account/register is how Flowise creates its first organization
    # owner, and it is unauthenticated by design.  It gets its own Ingress rule
    # carrying a source-range restriction: nginx answers 403 to every other
    # source, so those requests never reach Flowise.
    #
    # The path is a regex rather than pathType: Exact on purpose.  Express routes
    # with case-insensitive, non-strict matching by default, so an Exact rule on
    # "/api/v1/account/register" is trivially side-stepped with a trailing slash
    # ("/api/v1/account/register/") or different case ("/API/v1/account/register")
    # — both of which still reach the register handler.  ingress-nginx renders
    # regex paths as `location ~* "..."`, which is case-insensitive and takes
    # precedence over the root prefix rule; "/?$" keeps it from also swallowing
    # sibling paths such as /api/v1/account/register-anything.
    #
    # The administrator's browser flow is unchanged: same host, same UI, same
    # "Setup Account" page, as long as they browse from an allowed range.
    ###########################################################################
    - name: Create Source-Restricted Ingress for Flowise Account Setup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: flowise-account-setup
            namespace: "{{ agenticai_namespace }}"
            annotations:
              nginx.ingress.kubernetes.io/whitelist-source-range: "{{ agenticai_setup_ranges_effective }}"
              nginx.ingress.kubernetes.io/use-regex: "true"
          spec:
            ingressClassName: "{{ agenticai_ingress_class }}"
            tls:
              - secretName: "flowise-{{ cluster_url }}"
                hosts:
                  - "flowise-{{ cluster_url }}"
            rules:
              - host: "flowise-{{ cluster_url }}"
                http:
                  paths:
                    # Regex requires pathType ImplementationSpecific in ingress-nginx.
                    - path: /api/v1/account/register/?$
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: flowise
                          port:
                            number: 3000
      when:
        - kubernetes_platform != 'openshift'
        - agenticai_ingress_enabled | bool
      run_once: true

    ###########################################################################
    # Root Ingress (SUBDOMAIN MODE)
    ###########################################################################
    - name: Create Flowise Root Ingress (Subdomain)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: flowise-root
            namespace: "{{ agenticai_namespace }}"
          spec:
            ingressClassName: "{{ agenticai_ingress_class }}"
            tls:
              - secretName: "flowise-{{ cluster_url }}"
                hosts:
                  - "flowise-{{ cluster_url }}"
            rules:
              - host: "flowise-{{ cluster_url }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: flowise
                          port:
                            number: 3000
      when:
        - kubernetes_platform != 'openshift'
        - agenticai_ingress_enabled | bool
      run_once: true

    ###########################################################################
    # Wait for Pods
    ###########################################################################
    - name: Display Wait Message
      debug:
        msg:
          - "=============================================="
          - "Waiting for Flowise pods to be ready..."
          - "This may take several minutes as PostgreSQL"
          - "and Redis initialize for the first time."
          - "=============================================="
      run_once: true

    - name: Wait for Flowise Pods to be Ready
      shell: |
        kubectl get pods -n {{ agenticai_namespace }} \
          -l app.kubernetes.io/name=flowise \
          -o json | jq -r '
            .items[] |
            select(.status.phase != "Running"
              or (.status.containerStatuses[]? | select(.ready != true))) |
            .metadata.name' | wc -l
      register: pod_status
      until: pod_status.stdout == "0"
      retries: 60
      delay: 10
      run_once: true

    ###########################################################################
    # Summary
    ###########################################################################
    - name: Display Deployment Summary
      debug:
        msg:
          - "=================================================================="
          - "Flowise Agentic Plugin Deployed Successfully!"
          - "=================================================================="
          - "Namespace: {{ agenticai_namespace }}"
          - "Access URL: https://flowise-{{ cluster_url }}"
          - "Database: PostgreSQL"
          - "Cache: Redis"
          - "Worker Mode: {{ agenticai_worker_enabled }}"
          - "Secure cookies: enabled"
          - "=================================================================="
          - "FIRST-TIME SETUP — create the administrator account now."
          - "Flowise creates its first owner through an unauthenticated request,"
          - "so the first submission wins. Account creation is restricted to:"
          - "  {{ agenticai_setup_ranges_effective }}"
          - ""
          - >-
            {{ "Open https://flowise-" ~ cluster_url ~ " from one of those networks and
            complete the 'Setup Account' page. Requests from anywhere else get 403."
            if agenticai_setup_open_to_network | bool else
            "No network can reach it, so use a port-forward (it bypasses the Ingress):
            kubectl port-forward -n " ~ agenticai_namespace ~ " svc/flowise 3000:3000
            then open http://localhost:3000 and complete the 'Setup Account' page." }}
          - ""
          - "Then sign in normally at https://flowise-{{ cluster_url }}."
          - "{{ 'Registration endpoint: CLOSED — DENYLIST_URLS is set, so setup is no longer possible at all.' if agenticai_lock_registration | bool else 'To open browser-based setup instead, set agenticai_setup_source_ranges in plugins/agenticai/vars/agenticai-plugin-vars.yml.' }}"
          - "=================================================================="
      run_once: true

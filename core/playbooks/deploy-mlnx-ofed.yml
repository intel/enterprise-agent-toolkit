# STUB — full implementation deferred to GPU-6 (RDMA/RoCEv2 story).
#
# Purpose: Install Mellanox OFED on HGX nodes before kubespray join so the
# NVIDIA GPU driver container finds a live RDMA stack at boot.
# Called by add-node.sh with --limit <node_name> when gpu_form=hgx.
---
- name: Install Mellanox OFED (stub)
  hosts: "{{ target_nodes | default('all') }}"
  gather_facts: false
  tasks:
    - name: STUB — MLNX OFED install not yet implemented
      ansible.builtin.debug:
        msg: >
          STUB: Mellanox OFED installation for {{ inventory_hostname }} is not yet
          implemented. Full implementation is scoped to GPU-6 (RDMA/RoCEv2).
          Continuing without OFED — GPU operator will still deploy but RoCE
          fabric will not be available until GPU-6 is complete.

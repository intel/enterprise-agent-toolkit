# Intel® AI for Enterprise Agent Toolkit — Full Cluster Decommission Playbook
# Option 2: stops all pods/containers via crictl (like kubespray reset role),
#           then kubeadm reset, then full directory/iptables/interface wipe
---
- name: Phase 1 — Remove all workloads and Helm releases
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  become: false
  vars:
    namespace: rook-ceph
  tasks:
    # Auto-detect: covers decommissions that never invoke uninstall-ceph-storage.yml
    # (default uninstall_ceph=off) or that run this playbook directly. Must run before
    # "Delete all non-system namespaces" below, which would otherwise delete rook-ceph
    # blindly (--wait=false, no finalizer handling) ahead of any Ceph-aware cleanup.
    - name: Check if rook-ceph namespace exists
      ansible.builtin.command: kubectl get namespace {{ namespace }}
      register: namespace_check
      failed_when: false
      changed_when: false
      run_once: true

    - name: Run Ceph K8s-level cleanup (CRs, CRDs, namespace) if Rook-Ceph is present
      ansible.builtin.include_role:
        name: utils
        tasks_from: uninstall-ceph-cleanup
      vars:
        # Non-strict here: a full decommission must proceed even if Rook left
        # stuck CRDs/finalizers behind, unlike the interactive uninstall path.
        ceph_cleanup_strict: false
      when: namespace_check.rc == 0
      run_once: true

    - name: Uninstall all Helm releases across all namespaces
      shell: |
        for ns in $(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          for release in $(helm list -n "$ns" -q 2>/dev/null); do
            echo "Uninstalling $release (namespace: $ns)"
            helm uninstall "$release" -n "$ns" 2>/dev/null || true
          done
        done
      ignore_errors: true
      run_once: true

    - name: Delete all non-system namespaces
      shell: |
        system_ns="default kube-system kube-public kube-node-lease local-path-storage"
        for ns in $(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          if ! echo "$system_ns" | grep -qw "$ns"; then
            kubectl delete namespace "$ns" --timeout=60s --wait=false 2>/dev/null || true
          fi
        done
        sleep 15
        # spec.finalizers can only be cleared via the /finalize subresource, not a normal patch
        for ns in $(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          if ! echo "$system_ns" | grep -qw "$ns"; then
            kubectl get namespace "$ns" -o json 2>/dev/null \
              | jq '.spec.finalizers = []' \
              | kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f - >/dev/null 2>&1 || true
          fi
        done
      ignore_errors: true
      run_once: true

    - name: Delete all workloads in default namespace
      shell: |
        kubectl delete all --all -n default --timeout=60s 2>/dev/null || true
        kubectl delete pvc --all -n default --timeout=60s --wait=false 2>/dev/null || true
        sleep 15
        # the CSI driver (e.g. rook-ceph) is already uninstalled by now, so any still-attached
        # VolumeAttachment/pvc-protection finalizer will never clear on its own
        for va in $(kubectl get volumeattachment -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          kubectl delete volumeattachment "$va" --timeout=10s 2>/dev/null || true
        done
        for pvc in $(kubectl get pvc -n default -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          kubectl patch pvc "$pvc" -n default -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
        done
      ignore_errors: true
      run_once: true

    - name: Find PVC directories on host
      find:
        paths: "{{ pvc_base_path | default('/opt/local-path-provisioner') }}"
        patterns: "pvc*"
        file_type: any
      register: pvc_dirs
      become: true
      ignore_errors: true

    - name: Remove PVC directories
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pvc_dirs.files | default([]) }}"
      become: true
      ignore_errors: true

- name: Phase 2 — Stop all pods and containers, then kubeadm reset
  hosts: "{{ inference_delegate | default('k8s_cluster') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Stop all running pods via crictl (mimics kubespray reset role)
      shell: |
        if command -v crictl &>/dev/null; then
          crictl pods -q 2>/dev/null | xargs -r crictl stopp 2>/dev/null || true
          crictl pods -q 2>/dev/null | xargs -r crictl rmp --force 2>/dev/null || true
        fi
      ignore_errors: true

    - name: Stop all remaining containers via crictl
      shell: |
        if command -v crictl &>/dev/null; then
          crictl ps -q 2>/dev/null | xargs -r crictl stop 2>/dev/null || true
          crictl ps -aq 2>/dev/null | xargs -r crictl rm --force 2>/dev/null || true
        fi
      ignore_errors: true

    - name: Remove orphaned Kata shims, microVMs and snapshot devices
      shell: |
        if pgrep -f '^/opt/kata/|[c]ontainerd-shim-kata' >/dev/null; then
          pkill -TERM -f '^/opt/kata/|[c]ontainerd-shim-kata' || true
          sleep 15
          pkill -KILL -f '^/opt/kata/|[c]ontainerd-shim-kata' || true
        fi
        rm -rf /run/vc/* /run/kata-containers/* 2>/dev/null || true
        if command -v dmsetup >/dev/null 2>&1; then
          for d in $(dmsetup ls 2>/dev/null | awk '$1 ~ /thinpool-snap/ {print $1}'); do
            dmsetup remove "$d" 2>/dev/null || echo "WARN: could not remove $d (still in use)"
          done
        fi
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Stop kubelet to release port 10250 and all mounts
      systemd:
        name: kubelet
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Kill any process still holding port 10250
      shell: fuser -k 10250/tcp 2>/dev/null || true
      ignore_errors: true

    - name: Unmount kubelet-managed mounts
      shell: |
        for mount in $(mount | grep '/var/lib/kubelet' | awk '{print $3}' | sort -r); do
          # plain -f is not enough for a stale CephFS mount pointing at dead mons; fall back to lazy
          umount -f "$mount" 2>/dev/null || umount -l -f "$mount" 2>/dev/null || true
        done
      ignore_errors: true

    - name: Run kubeadm reset
      command: kubeadm reset --force
      ignore_errors: true

- name: Phase 3 — Wipe all K8s state, CNI, iptables and network interfaces
  hosts: "{{ inference_delegate | default('k8s_cluster') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Flush iptables rules
      shell: |
        iptables -F && iptables -X
        iptables -t nat -F && iptables -t nat -X
        iptables -t mangle -F && iptables -t mangle -X
        ip6tables -F 2>/dev/null || true
        ip6tables -X 2>/dev/null || true
      ignore_errors: true

    # Explicit per-node check so Phase 3 never runs a single Ceph-related command
    # (kernel unmounts, dir removal, CSI dir cleanup) when Ceph/Rook was never
    # present on this node. kubectl/namespace_check from Phase 1 can't be reused
    # here — this runs on all k8s_cluster nodes, post-kubeadm-reset, potentially
    # without a working API server.
    - name: Detect local Rook/Ceph state on this node
      ansible.builtin.shell: |
        set -e
        present=no
        [ -d /var/lib/rook ] && present=yes
        [ -d /var/lib/ceph ] && present=yes
        mount | grep -qE 'ceph|rbd' && present=yes
        echo "$present"
      register: ceph_local_state
      changed_when: false
      failed_when: false

    - name: Run Ceph local-node cleanup (mounts, data dirs, CSI dirs, stale PVCs) if Ceph state is present
      ansible.builtin.include_role:
        name: utils
        tasks_from: uninstall-ceph-local-cleanup
      when: ceph_local_state.stdout | default('') | trim == "yes"

    # Runs whenever 'devices' is declared for this node (rack-profile.yaml storage.nodes),
    # independent of the uninstall_ceph flag, so a redeployed Ceph cluster never inherits
    # stale bluestore/LVM signatures from a prior install. Each device is only actually
    # wiped if a Ceph/bluestore signature is detected on it (see uninstall-ceph-wipe-devices.yml),
    # so this is safe even when Ceph/Rook was never installed on this node.
    - name: Wipe Ceph OSD devices declared in inventory
      ansible.builtin.include_role:
        name: utils
        tasks_from: uninstall-ceph-wipe-devices

    - name: Remove all Kubernetes and CNI state directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/etcd
        - /var/lib/kubelet
        - /var/lib/kube-proxy
        - /var/run/kubernetes
        - /etc/cni/net.d
        - /opt/cni/bin
        - /var/lib/cni
        - /var/lib/calico
        - /etc/calico
        - /root/.kube
        - /home/ubuntu/.kube
      ignore_errors: true

    - name: Remove kubelet service override directory
      file:
        path: /etc/systemd/system/kubelet.service.d
        state: absent
      ignore_errors: true

    - name: Remove leftover virtual network interfaces
      shell: |
        for iface in $(ip link show | grep -oP '(?<=\d: )(cni\S+|flannel\S+|calico\S+|tunl\S+|vxlan\S+|kube-ipvs\S+)' 2>/dev/null); do
          ip link delete "$iface" 2>/dev/null || true
        done
      ignore_errors: true

    - name: Remove Kubernetes binaries (kubectl, kubeadm, kubelet)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/kubectl
        - /usr/local/bin/kubeadm
        - /usr/local/bin/kubelet
        - /usr/local/bin/kube-proxy
        - /usr/local/bin/kubernetes-scripts
        - /etc/systemd/system/kubelet.service
      ignore_errors: true

    - name: Reload systemd after removing kubelet service unit
      systemd:
        daemon_reload: true
      ignore_errors: true

    - name: Restart containerd to clear all container state
      systemd:
        name: containerd
        state: restarted
      ignore_errors: true

    - name: Decommission complete
      debug:
        msg: >
          Kubernetes cluster has been fully decommissioned.
          Run agentic-stack.sh option 1 with deploy_kubernetes_fresh=on to redeploy.

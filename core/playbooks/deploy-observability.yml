---
- name: Deploy Observability
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"
  vars_files:
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_common.yml"
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_observability.yml"
    - "{{ lookup('env', 'PWD') }}/config/vault.yml"
  roles:
    - role: inference-tools
  tasks:
    - name: Create kubernetes namespace for Observability
      community.kubernetes.k8s:
        name: observability
        api_version: v1
        kind: Namespace
        state: present
      run_once: true
      tags: always
    - name: Add Observability repository
      community.kubernetes.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts
      tags: deploy_observability
    - name: Transfer Dependency files
      ansible.builtin.copy:
        src: "{{ helm_charts_base }}/observability/"
        dest: "{{ remote_helm_charts_base }}/"
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: no
      tags: always
    - name: Verify Observability repository
      ansible.builtin.command: helm repo list
      register: helm_repo_list_observability
      failed_when: false
      changed_when: false
      tags: always
    - name: Synchronize Observability repositories
      ansible.builtin.shell: helm repo update
      when: helm_repo_list_observability.stdout != ""
      tags: always
    - name: Create Config for Xeon Grafana Dashboard
      tags: deploy_observability
      run_once: true
      ansible.builtin.shell: |
        kubectl create configmap xeon-dashboard-configmap \
          --from-file=grafana-xeon-dashboard.json={{ remote_helm_charts_base }}/xeon-exporter/grafana-xeon-dashboard.json \
          -n observability --dry-run=client -o yaml | kubectl apply -f -

        kubectl label configmap xeon-dashboard-configmap grafana_dashboard=1 -n observability --overwrite
      args:
        executable: /bin/bash

    - name: Install Observability Stack
      tags: deploy_observability
      community.kubernetes.helm:
        name: observability
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: observability
        create_namespace: true
        chart_version: "{{observability_stack_chart_version|default('72.5.1')}}"
        values:
          kubeEtcd:
            enabled: false
          prometheus:
            prometheusSpec:
              retention: 15d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
              replicas: 2
              replicaAutoScaling:
                enabled: true
                targetCPUUtilizationPercentage: 80
                maxReplicas: 5
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchExpressions:
                            - key: app.kubernetes.io/name
                              operator: In
                              values:
                                - prometheus
                        topologyKey: kubernetes.io/hostname
          alertmanager:
            alertmanagerSpec:
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi
          grafana:
            adminPassword: "{{ grafana_admin_password }}"
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                folder: /tmp/dashboards
            persistence:
              enabled: true
              accessModes:
                - ReadWriteOnce
              size: 10Gi
            # The chart's init-chown-data container runs as root with only
            # CAP_CHOWN, so it cannot traverse the 0700 csv/pdf/png dirs Grafana
            # creates on first start and crash-loops on every restart. The PVC
            # is already owned by 472:472 (Grafana's UID), so the step is unneeded.
            initChownData:
              enabled: false
            grafana.ini:
              users:
                default_theme: light
              server:
                root_url: "%(protocol)s://%(domain)s:%(http_port)s/observability"
                serve_from_sub_path: true
                domain: "{{ secret_name }}"
      register: prometheus_install
      until: prometheus_install is successful
      retries: 5
      delay: 10
      run_once: true

    # ── GPU observability (NVIDIA DCGM) ──────────────────────────────────────
    # Only wired up when the rack profile has NVIDIA GPU nodes. rack_scale_gpu_vendor
    # is emitted to inventory/metadata/rack-scale-flags.env by rack-profile-parser.sh
    # and passed in as an extra-var by observability-controller.sh. Empty (no GPU
    # nodes) => every task below is skipped => no regression on CPU-only clusters.
    #
    # These tasks run AFTER the kube-prometheus-stack install above so the
    # ServiceMonitor / PrometheusRule CRDs already exist. The GPU Operator enables
    # the DCGM exporter (dcgmExporter.enabled=true) but we own the ServiceMonitor
    # here so it carries the release=observability label that this Prometheus's
    # serviceMonitorSelector requires — the operator's own monitor uses a different
    # label and would be ignored.
    #
    # The ServiceMonitor MUST live in the observability namespace, NOT in
    # gpu-operator. The GPU Operator's ClusterPolicy controller reconciles the
    # gpu-operator namespace and removes a ServiceMonitor named
    # nvidia-dcgm-exporter that it does not own, which it did within ~13 minutes
    # of deploy — Prometheus silently lost the DCGM target and every GPU panel
    # went blank with no alert. Prometheus is configured with an empty
    # serviceMonitorNamespaceSelector (all namespaces), and the namespaceSelector
    # below already points discovery at the exporter Service in gpu-operator, so
    # the ServiceMonitor itself does not need to live there.
    - name: Create ServiceMonitor for NVIDIA DCGM exporter
      tags: deploy_observability
      run_once: true
      when: (rack_scale_gpu_vendor | default('')) == 'nvidia'
      community.kubernetes.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: nvidia-dcgm-exporter
            namespace: observability
            labels:
              release: observability
          spec:
            namespaceSelector:
              matchNames:
                - gpu-operator
            selector:
              matchLabels:
                app: nvidia-dcgm-exporter
            endpoints:
              - port: gpu-metrics
                interval: 30s

    - name: Create Config for NVIDIA DCGM Grafana Dashboard
      tags: deploy_observability
      run_once: true
      when: (rack_scale_gpu_vendor | default('')) == 'nvidia'
      ansible.builtin.shell: |
        kubectl create configmap nvidia-dcgm-dashboard-configmap \
          --from-file=nvidia-dcgm.json={{ remote_helm_charts_base }}/dashboards/nvidia-dcgm.json \
          -n observability --dry-run=client -o yaml | kubectl apply -f -

        kubectl label configmap nvidia-dcgm-dashboard-configmap grafana_dashboard=1 -n observability --overwrite
      args:
        executable: /bin/bash

    - name: Apply GPU PrometheusRule alerts
      tags: deploy_observability
      run_once: true
      when: (rack_scale_gpu_vendor | default('')) == 'nvidia'
      community.kubernetes.k8s:
        state: present
        namespace: observability
        src: "{{ remote_helm_charts_base }}/gpu-alerts.yaml"

    - name: Create TLS cert for observability
      tags: deploy_observability
      community.kubernetes.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ secret_name }}"
            namespace: observability # Change this to the desired namespace if not default
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', cert_file) | b64encode }}"
            tls.key: "{{ lookup('file', key_file) | b64encode }}"
      register: kubectl_output

    - name: Create Grafana observability ingress with ALB (EKS)
      tags: deploy_observability
      when: kubernetes_platform == "eks"
      community.kubernetes.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            annotations:
              alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
              alb.ingress.kubernetes.io/certificate-arn: "{{ aws_certificate_arn | default('') }}"
              alb.ingress.kubernetes.io/group.name: ei-eks
              alb.ingress.kubernetes.io/group.order: '2'
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/healthcheck-path: /api/health
              alb.ingress.kubernetes.io/success-codes: "200"
            name: observability-grafana-ingress
            namespace: observability
          spec:
            ingressClassName: alb
            rules:
              - host: "{{ secret_name }}"
                http:
                  paths:
                    - backend:
                        service:
                          name: observability-grafana
                          port:
                            number: 80
                      path: /observability
                      pathType: Prefix
            tls:
              - hosts:
                  - "{{ secret_name }}"
                secretName: "{{ secret_name }}"

    - name: Create Grafana observability ingress with nginx (non-EKS)
      tags: deploy_observability
      when: kubernetes_platform is not defined or kubernetes_platform != "eks"
      community.kubernetes.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: HTTP # Assuming Grafana is served over HTTP
            name: observability-grafana-ingress
            namespace: observability # Change this to the namespace where Grafana is deployed
          spec:
            ingressClassName: nginx
            rules:
              - host: "{{ secret_name }}" # Replace with your desired hostname for Grafana
                http:
                  paths:
                    - backend:
                        service:
                          name: observability-grafana
                          port:
                            number: 80
                      path: /observability(/|$)(.*)
                      pathType: ImplementationSpecific
            tls:
              - hosts:
                  - "{{ secret_name }}"
                secretName: "{{ secret_name }}"

    - name: Add Bitnami Helm repository
      tags: deploy_logging
      community.kubernetes.helm_repository:
        name: bitnami
        repo_url: https://charts.bitnami.com/bitnami
      when: deploy_logging == "yes"

    - name: Check if Helm repositories exist Observability
      ansible.builtin.command: helm repo list
      register: helm_repo_list_observability
      failed_when: false
      changed_when: false
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Update Helm repositories
      ansible.builtin.shell: helm repo update
      when:
        - deploy_logging == "yes"
        - helm_repo_list_observability.stdout != ""
      tags: deploy_logging

    - name: Install Elasticsearch System
      community.kubernetes.helm:
        name: logging-elasticsearch
        chart_ref: bitnami/elasticsearch
        release_namespace: observability
        chart_version: "21.4.8"
        values:
          name: elasticsearch
          master.replicas: 3
          coordinating.service.type: LoadBalancer
      run_once: true
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Create Fluentbit Group
      group:
        name: fluentbit
        state: present
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Create Fluentbit User
      user:
        name: fluentbit
        groups: fluentbit
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Set Ownership of log Directories
      file:
        path: "{{ item }}"
        owner: root
        group: fluentbit
        mode: 0750
      loop:
        - /var/log/pods
        - /var/log/containers
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Transfer Dependency Files
      ansible.builtin.copy:
        src: "{{ helm_charts_base }}/"
        dest: "{{ remote_helm_charts_base }}/"
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: no
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Create Fluent Bit ClusterRoleBinding
      community.kubernetes.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: fluent-bit-binding-observability
          subjects:
            - kind: ServiceAccount
              name: fluent-bit
              namespace: observability
          roleRef:
            kind: ClusterRole
            name: fluent-bit
            apiGroup: rbac.authorization.k8s.io
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Install Fluent Bit
      community.kubernetes.helm:
        name: logging-fluentbit
        chart_ref: oci://registry-1.docker.io/bitnamicharts/fluent-bit
        release_namespace: observability
        values_files: "{{ remote_helm_charts_base }}/fluentbit/fluebit-values.yml"
        chart_version: "2.5.5"
      run_once: true
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Update Fluent Bit ConfigMap
      community.kubernetes.k8s:
        state: present
        src: "{{ remote_helm_charts_base }}/fluentbit/fluentbit-config.yml"
        kind: ConfigMap
        namespace: observability
      run_once: true
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Apply Changes to Fluentbit Deployment
      ansible.builtin.command:
        cmd: kubectl rollout restart deployment/logging-fluentbit-fluent-bit --namespace=observability
      run_once: true
      when: deploy_logging == "yes"
      tags: deploy_logging

    - name: Add Grafana Helm repo (Loki)
      run_once: true
      tags: deploy_observability
      community.kubernetes.helm_repository:
        name: grafana
        repo_url: https://grafana.github.io/helm-charts

    - name: Add OpenTelemetry Helm repo
      run_once: true
      tags: deploy_observability
      community.kubernetes.helm_repository:
        name: open-telemetry
        repo_url: https://open-telemetry.github.io/opentelemetry-helm-charts

    - name: Transfer Dependency Files
      ansible.builtin.copy:
        src: "{{ helm_charts_base }}/"
        dest: "{{ remote_helm_charts_base }}/"
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: no
      tags: always

    - name: Build chart dependencies for logs-stack chart
      run_once: true
      tags: deploy_observability
      ansible.builtin.command:
        cmd: helm dependency build logs-stack
      args:
        chdir: "{{ remote_helm_charts_base }}/observability"
      become: false

    - name: Install/Upgrade logs-stack chart with AWS settings
      when: aws_access_key is defined and aws_access_key | length > 0
      run_once: true
      tags: deploy_observability
      ansible.builtin.command:
        cmd: >
          helm upgrade --install logs-stack ./logs-stack
          --namespace observability
          -f {{ remote_helm_charts_base }}/observability/logs-stack/aws-s3-values.yaml
          --set loki.loki.storage_config.aws.region={{ aws_region }}
          --set loki.loki.storage_config.aws.bucketnames={{ aws_bucket }}
          --set loki.loki.storage_config.aws.access_key_id={{ aws_access_key }}
          --set loki.loki.storage_config.aws.secret_access_key={{ aws_secret_key }}
          --set loki.loki.storage.bucketNames.chunks={{ aws_bucket }}
          --set loki.loki.storage.bucketNames.admin={{ aws_bucket }}
          --set loki.loki.storage.bucketNames.ruler={{ aws_bucket }}
      args:
        chdir: "{{ remote_helm_charts_base }}/observability"
      register: logs_install
      until: logs_install is successful
      retries: 5
      delay: 10

    - name: Install/Upgrade logs-stack chart with Minio settings
      when: aws_access_key is not defined or aws_access_key | length == 0
      run_once: true
      tags: deploy_observability
      ansible.builtin.command:
        cmd: >
          helm upgrade --install logs-stack ./logs-stack
          --namespace observability
      args:
        chdir: "{{ remote_helm_charts_base }}/observability"
      register: logs_install
      until: logs_install is successful
      retries: 5
      delay: 10

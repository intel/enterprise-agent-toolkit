---
- name: Deploy NVIDIA GPU Operator
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"
  vars_files:
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_common.yml"
  vars:
    gpu_operator_namespace: gpu-operator
    gpu_operator_version: "{{ nvidia_gpu_operator_version | default('v25.3.0') }}"
    gpu_operator_release_name: gpu-operator
    gpu_operator_helm_repo: "https://helm.ngc.nvidia.com/nvidia"
    gpu_operator_helm_repo_name: nvidia
    gpu_operator_chart: "nvidia/gpu-operator"
  tasks:
    - name: Add NVIDIA Helm repository
      ansible.builtin.command: >-
        helm repo add {{ gpu_operator_helm_repo_name }} {{ gpu_operator_helm_repo }}
      register: helm_repo_add
      changed_when: "'already exists' not in helm_repo_add.stdout"
      run_once: true

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      run_once: true

    - name: Create gpu-operator namespace
      kubernetes.core.k8s:
        name: "{{ gpu_operator_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
      run_once: true

    # NOTE: dcgmExporter.enabled=true (below) deploys the DCGM exporter and its
    # Service, but we intentionally do NOT enable the operator's own ServiceMonitor
    # here. The DCGM ServiceMonitor is created by playbooks/deploy-observability.yml
    # so it carries the release=observability label that the kube-prometheus-stack
    # Prometheus's serviceMonitorSelector requires (the operator's own monitor uses a
    # different label and would be silently ignored). This playbook also runs BEFORE
    # observability, so the ServiceMonitor CRD does not yet exist at this point.

    - name: Transfer DCGM custom metrics CSV to remote host
      ansible.builtin.copy:
        src: "{{ helm_charts_base }}/observability/dcgm-metrics.csv"
        dest: "/tmp/dcgm-metrics.csv"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: no
      run_once: true

    - name: Create DCGM custom metrics ConfigMap
      ansible.builtin.shell: |
        kubectl create configmap dcgm-metrics-config \
          --from-file=dcgm-metrics.csv=/tmp/dcgm-metrics.csv \
          -n {{ gpu_operator_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      run_once: true

    # gpu-operator-values.yaml is the single source of truth for this release
    # (dcgmExporter.config.name in particular — see the comment header in that
    # file for why this must NOT be `--set` on the command line). Transferred
    # to the remote host and applied with `-f` so every upgrade path
    # re-asserts the full value set instead of depending on the previous
    # helm revision's stored values.
    - name: Transfer GPU Operator Helm values to remote host
      ansible.builtin.copy:
        src: "{{ helm_charts_base }}/observability/gpu-operator-values.yaml"
        dest: "/tmp/gpu-operator-values.yaml"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: no
      run_once: true

    - name: Deploy NVIDIA GPU Operator via Helm (idempotent)
      ansible.builtin.command: >-
        helm upgrade --install {{ gpu_operator_release_name }}
        {{ gpu_operator_chart }}
        --namespace {{ gpu_operator_namespace }}
        --version {{ gpu_operator_version }}
        -f /tmp/gpu-operator-values.yaml
        --wait
        --timeout 10m
        {{ helm_proxy_args | default('') }}
      register: gpu_operator_deploy
      failed_when: gpu_operator_deploy.rc != 0
      run_once: true

    # Self-healing check: even with values pinned in gpu-operator-values.yaml,
    # an out-of-band `helm upgrade` (run by hand, or from another tool/pipeline
    # that doesn't go through this playbook) can still drop
    # spec.dcgmExporter.config.name from the ClusterPolicy — this is exactly
    # what happened on the B300 Star cluster on 2026-08-27. Detect that state
    # and restore it via a targeted patch rather than assuming every run is a
    # fresh install.
    - name: Check ClusterPolicy for DCGM custom metrics config reference
      ansible.builtin.command: >-
        kubectl get clusterpolicy cluster-policy
        -o jsonpath='{.spec.dcgmExporter.config.name}'
      register: clusterpolicy_dcgm_config
      changed_when: false
      failed_when: false
      run_once: true

    - name: Restore DCGM custom metrics config reference on ClusterPolicy
      ansible.builtin.command: >-
        kubectl patch clusterpolicy cluster-policy --type merge
        -p '{"spec":{"dcgmExporter":{"config":{"name":"dcgm-metrics-config"}}}}'
      when: clusterpolicy_dcgm_config.stdout | default('') != 'dcgm-metrics-config'
      register: clusterpolicy_dcgm_patch
      failed_when: clusterpolicy_dcgm_patch.rc != 0
      run_once: true

    - name: Wait for GPU Operator pods to be ready
      ansible.builtin.command: >-
        kubectl rollout status daemonset/gpu-operator-node-feature-discovery-worker
        -n {{ gpu_operator_namespace }}
        --timeout=300s
      register: nfd_rollout
      failed_when: nfd_rollout.rc != 0
      ignore_errors: true
      run_once: true

    - name: Wait for DCGM exporter daemonset rollout
      ansible.builtin.command: >-
        kubectl rollout status daemonset/nvidia-dcgm-exporter
        -n {{ gpu_operator_namespace }}
        --timeout=300s
      register: dcgm_exporter_rollout
      failed_when: dcgm_exporter_rollout.rc != 0
      ignore_errors: true
      run_once: true

    # Post-deploy assertion, per DCAIDSE8-2233's sibling incident: a wiring
    # regression here does not crash anything or fail helm — the exporter
    # keeps running and keeps exporting 25 metrics, just not these 7. A silent
    # observability regression should break the deploy, not the dashboard.
    - name: Discover a running DCGM exporter pod
      ansible.builtin.command: >-
        kubectl get pods -n {{ gpu_operator_namespace }}
        -l app=nvidia-dcgm-exporter
        -o jsonpath='{.items[0].metadata.name}'
      register: dcgm_exporter_pod
      changed_when: false
      run_once: true

    # Rollout status only confirms the pod is Ready, not that DCGM has finished its
    # first collection cycle — counters take another 10-30s to populate after that.
    # Retry the fetch itself instead of a blind pause so we don't over-wait.
    - name: Fetch DCGM exporter /metrics output (retry until counters populate)
      ansible.builtin.command: >-
        kubectl get --raw
        /api/v1/namespaces/{{ gpu_operator_namespace }}/pods/{{ dcgm_exporter_pod.stdout }}:9400/proxy/metrics
      register: dcgm_exporter_metrics
      changed_when: false
      until: "'DCGM_FI_DEV_ECC_SBE_VOL_TOTAL' in dcgm_exporter_metrics.stdout"
      retries: 6
      delay: 5
      run_once: true

    - name: Assert ECC / clock-throttle counters are present
      ansible.builtin.assert:
        that:
          - "'DCGM_FI_DEV_ECC_SBE_VOL_TOTAL' in dcgm_exporter_metrics.stdout"
          - "'DCGM_FI_DEV_ECC_DBE_VOL_TOTAL' in dcgm_exporter_metrics.stdout"
          - "'DCGM_FI_DEV_ECC_SBE_AGG_TOTAL' in dcgm_exporter_metrics.stdout"
          - "'DCGM_FI_DEV_ECC_DBE_AGG_TOTAL' in dcgm_exporter_metrics.stdout"
          - "'DCGM_FI_DEV_CLOCK_THROTTLE_REASONS' in dcgm_exporter_metrics.stdout"
        fail_msg: >-
          DCGM exporter is missing one or more of the ECC / clock-throttle
          counter fields. The exporter fell back to the in-image default
          counter CSV (NVIDIA ships these fields commented out there), which
          means ClusterPolicy spec.dcgmExporter.config.name is not pointing
          at the dcgm-metrics-config ConfigMap. Check gpu-operator-values.yaml
          was applied and the self-heal patch step above ran cleanly.
      run_once: true

    # DCGM_FI_PROF_SM_* need GPU profiling support, unavailable pre-Volta (sm_70).
    # Gate on compute capability instead of asserting unconditionally.
    - name: Query GPU compute capability
      ansible.builtin.command: >-
        kubectl exec -n {{ gpu_operator_namespace }} {{ dcgm_exporter_pod.stdout }} --
        nvidia-smi --query-gpu=compute_cap --format=csv,noheader
      register: gpu_compute_cap
      changed_when: false
      failed_when: false
      run_once: true

    - name: Determine whether SM profiling counters are expected on this GPU
      ansible.builtin.set_fact:
        dcgm_profiling_supported: "{{ (gpu_compute_cap.stdout | default('0') | trim | float(0.0)) >= 7.0 }}"
      run_once: true

    - name: Check SM-activity profiling counters (Volta/sm_70+ only, non-fatal)
      ansible.builtin.assert:
        that:
          - "'DCGM_FI_PROF_SM_ACTIVE' in dcgm_exporter_metrics.stdout"
          - "'DCGM_FI_PROF_SM_OCCUPANCY' in dcgm_exporter_metrics.stdout"
        fail_msg: >-
          DCGM_FI_PROF_SM_ACTIVE/DCGM_FI_PROF_SM_OCCUPANCY are not being
          exported even though this GPU reports profiling support
          (compute_cap {{ gpu_compute_cap.stdout | default('unknown') }}).
          Check gpu-operator-values.yaml and the self-heal patch step above.
      when: dcgm_profiling_supported
      failed_when: false
      run_once: true

    - name: Verify GPU Operator deployment
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ gpu_operator_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=gpu-operator"
      register: gpu_operator_pods
      run_once: true

    - name: Display GPU Operator pod status
      debug:
        msg: >-
          GPU Operator pods: {{ gpu_operator_pods.resources
            | map(attribute='metadata.name') | list }}
      run_once: true
---
- name: Deploy vLLM Semantic Router
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"
  vars_files:
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_common.yml"
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_delegate.yml"
    - "{{ lookup('env', 'PWD') }}/config/vault.yml"

  roles:
    - role: inference-tools
  tasks:
    - name: Ensure vllm-sr namespace exists
      ansible.builtin.command: kubectl create namespace vllm-sr
      register: ns_result
      failed_when: false
      changed_when: ns_result.rc == 0
      run_once: true

    - name: Label namespace for Helm adoption
      ansible.builtin.command: >-
        kubectl label namespace vllm-sr
        app.kubernetes.io/managed-by=Helm
        --overwrite
      run_once: true
      failed_when: false

    - name: Annotate namespace for Helm adoption
      ansible.builtin.command: >-
        kubectl annotate namespace vllm-sr
        meta.helm.sh/release-name=vllm-sr
        meta.helm.sh/release-namespace=vllm-sr
        --overwrite
      run_once: true
      failed_when: false

    - name: Create TLS secret for vLLM-SR
      community.kubernetes.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ secret_name }}"
            namespace: vllm-sr
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('file', cert_file) | b64encode }}"
            tls.key: "{{ lookup('file', key_file) | b64encode }}"
      run_once: true

    - name: Ensure Remote Directory Exists
      ansible.builtin.file:
        path: "{{ remote_helm_charts_base }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      run_once: true

    - name: Sync vLLM-SR Helm chart to deployment node
      ansible.posix.synchronize:
        src: "{{ helm_charts_base_vllm_sr | default(lookup('env', 'PWD') + '/../helm-charts/vllm-sr') }}/"
        dest: "{{ remote_helm_charts_base }}/vllm-sr/"
        recursive: yes
        delete: no
        mode: push
      run_once: true

    - name: Discover deployed model services (direct backend URLs)
      ansible.builtin.shell: |
        kubectl get services -n default -o json 2>/dev/null | \
          python3 -c "
        import json, re, sys
        data = json.load(sys.stdin)
        RUNTIMES = ('vllm', 'ovms', 'tgi')
        # Untrusted input: annotation VALUES are unconstrained by Kubernetes, and
        # these strings end up in a Helm values file and then in YAML. fullmatch,
        # not match: '$' also matches before a trailing newline, so match() would
        # let 'Qwen/Qwen3-8B\n' through and the newline would break the rendered
        # configmap for every backend.
        MODEL_RE = re.compile(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,190}')
        PATH_RE = re.compile(r'/[A-Za-z0-9._/-]{0,120}')
        backends = []
        seen = {}
        for svc in data.get('items', []):
            meta = svc.get('metadata') or {}
            name = meta.get('name')
            if not name:
                continue
            labels = (meta.get('labels') or {})
            annos = (meta.get('annotations') or {})
            # A service is a routing backend if it opts in by label with a known
            # runtime. The legacy name heuristic is kept so existing deployments,
            # which carry no such label, keep working unchanged.
            runtime = (labels.get('agentic.intel.com/serving-runtime') or '').strip()
            opted_in = runtime in RUNTIMES
            legacy = 'vllm' in name and name.endswith('-service')
            if not (opted_in or legacy):
                continue
            ports = ((svc.get('spec') or {}).get('ports')) or []
            # Prefer the OpenAI-compatible HTTP port by NAME: ports[0] is wrong for
            # runtimes that expose gRPC first, as the ovms chart does (grpc:9000
            # before rest:8080). Fall back to ports[0] so a legacy Service that
            # gains a second port is not silently dropped.
            named = {p.get('name'): p.get('port') for p in ports if p.get('port')}
            port = (named.get('rest') or named.get('http') or named.get('api'))
            raw_port = annos.get('agentic.intel.com/serving-port')
            if raw_port is not None:
                if not str(raw_port).strip().isdigit() or not 0 < int(raw_port) < 65536:
                    sys.stderr.write('skip %s: rejected serving-port %r\n'
                                     % (name, raw_port))
                    continue
                port = int(raw_port)
            if port is None and ports:
                port = ports[0].get('port')
            if port is None:
                sys.stderr.write('skip %s: no usable port\n' % name)
                continue
            release = name[:-8] if name.endswith('-service') else name
            model_map = {
                'vllm-qwen-2-5-coder-14b-cpu': 'Qwen/Qwen2.5-Coder-14B-Instruct',
                'vllm-qwen3-coder-30b-cpu': 'Qwen/Qwen3-Coder-30B-A3B-Instruct',
                'vllm-qwen3-30b-a3b-cpu': 'Qwen/Qwen3-30B-A3B-Instruct-2507',
                'vllm-qwen3-6-35b-a3b-cpu': 'Qwen/Qwen3.6-35B-A3B',
                'vllm-llama-8b-cpu': 'meta-llama/Llama-3.1-8B-Instruct',
                'vllm-llama-3-2-3b-cpu': 'meta-llama/Llama-3.2-3B-Instruct',
                'vllm-deepseek-r1-qwen32b-cpu': 'deepseek-ai/DeepSeek-R1-Distill-Qwen-32B',
                'vllm-gemma4-26b-a4b-cpu': 'google/gemma-4-26B-A4B-it',
            }
            # The model-id annotation applies to the OPT-IN path only. On the legacy
            # path the curated model_map stays authoritative, so an annotation
            # cannot silently redefine an existing backend's model id.
            model_id = (annos.get('agentic.intel.com/model-id') if opted_in
                        else None) or model_map.get(release)
            if model_id is None:
                if opted_in:
                    # Falling back to the release name would emit a
                    # provider_model_id that no backend actually serves, and the
                    # failure would only surface at request time.
                    sys.stderr.write('skip %s: opted in but no model-id annotation '
                                     'and no model_map entry\n' % name)
                    continue
                model_id = release
            if not MODEL_RE.fullmatch(model_id):
                sys.stderr.write('skip %s: rejected model id %r\n' % (name, model_id))
                continue
            # vLLM-SR appends its chat path to the endpoint. OVMS 2025.4 serves
            # /v3/chat/completions, not /v1/..., so the path must be per-backend.
            chat_path = annos.get('agentic.intel.com/chat-path') or '/v1/chat/completions'
            if not PATH_RE.fullmatch(chat_path):
                sys.stderr.write('skip %s: rejected chat-path %r\n' % (name, chat_path))
                continue
            short_name = model_id.split('/')[-1].lower().replace('.', '-').replace('_', '-')
            if short_name in seen:
                # Duplicate names are fatal to the router:
                # 'routing.modelCards[x]: duplicate model name'.
                sys.stderr.write('skip %s: backend name %r already taken by %s\n'
                                 % (name, short_name, seen[short_name]))
                continue
            seen[short_name] = name
            backends.append({
                'name': short_name,
                'model': model_id,
                'baseUrl': 'http://%s.default:%s/v1' % (name, port),
                'apiFormat': 'openai',
                'chatPath': chat_path,
            })
        print(json.dumps(backends))
        " || echo "[]"
      register: discovered_backends
      run_once: true

    - name: Set backend facts
      ansible.builtin.set_fact:
        vllm_sr_backends: "{{ discovered_backends.stdout | from_json }}"
      run_once: true

    - name: Display discovered backends
      debug:
        msg: "Discovered {{ vllm_sr_backends | length }} vLLM backend(s) for routing"
      run_once: true

    # Backends are passed as a values FILE, not as `--set`. A discovered value can
    # contain a comma, which `--set` treats as a field separator, so a Service
    # annotation could otherwise inject arbitrary chart values - including
    # image.repository. Rendering YAML removes that class of problem entirely.
    - name: Write discovered backends to a Helm values file
      ansible.builtin.copy:
        dest: "{{ remote_helm_charts_base }}/vllm-sr-backends.yaml"
        mode: "0640"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        content: |
          backends:
          {% for backend in vllm_sr_backends %}
            - name: {{ backend.name | to_json }}
              model: {{ backend.model | to_json }}
              baseUrl: {{ backend.baseUrl | to_json }}
              apiFormat: {{ backend.apiFormat | to_json }}
              chatPath: {{ backend.chatPath | default('/v1/chat/completions') | to_json }}
              pricing:
                promptPer1m: 0.001
                completionPer1m: 0.002
          {% endfor %}
      run_once: true

    - name: Reference the backends values file
      ansible.builtin.set_fact:
        backends_helm_args: "-f {{ remote_helm_charts_base }}/vllm-sr-backends.yaml"
      run_once: true

    - name: Get Langfuse keys for OTel integration
      ansible.builtin.set_fact:
        langfuse_public_key_val: "{{ langfuse_public_key | default('') }}"
        langfuse_secret_key_val: "{{ langfuse_secret_key | default('') }}"
      run_once: true

    # providers.defaults.default_model references a backend NAME (the short name
    # in providers.models[].name), not a provider model id. This previously
    # passed .model, which would not have resolved once the value was wired.
    - name: Install vLLM Semantic Router
      ansible.builtin.command: >-
        helm upgrade --install vllm-sr {{ remote_helm_charts_base }}/vllm-sr
        --namespace vllm-sr
        --create-namespace
        --set routing.defaultModel="{{ (vllm_sr_backends | first).name if vllm_sr_backends else '' }}"
        {{ backends_helm_args }}
        --set observability.enabled=true
        --set observability.langfuse.endpoint="http://genai-gateway-trace-web.genai-gateway.svc.cluster.local:3000"
        --set observability.langfuse.publicKey="{{ langfuse_public_key_val }}"
        --set observability.langfuse.secretKey="{{ langfuse_secret_key_val }}"
        {% if kubernetes_platform == 'openshift' %}
        --set route.enabled=true
        --set route.host={{ secret_name }}
        --set route.tls.termination=edge
        --set route.tls.insecureEdgeTerminationPolicy=Redirect
        --set ingress.enabled=false
        {% else %}
        --set ingress.enabled=true
        --set ingress.host={{ secret_name }}
        --set ingress.dashboardHost=vllm-sr-{{ secret_name }}
        --set ingress.secretname={{ secret_name }}
        --set route.enabled=false
        {% endif %}
        {% if env_proxy is defined and env_proxy.http_proxy | default('') != '' %}
        --set proxy.http_proxy="{{ env_proxy.http_proxy }}"
        {% if env_proxy.https_proxy | default('') != '' %}
        --set proxy.https_proxy="{{ env_proxy.https_proxy }}"
        {% endif %}
        {% set _k8s_bypass = ".default,.vllm-sr,.genai-gateway,.redis,.ingress-nginx" %}
        {% if env_proxy.no_proxy | default('') != '' %}
        --set proxy.no_proxy="{{ (env_proxy.no_proxy + ',' + _k8s_bypass) | replace(',', '\\,') }}"
        {% else %}
        --set proxy.no_proxy="{{ _k8s_bypass | replace(',', '\\,') }}"
        {% endif %}
        {% endif %}
      run_once: true

    - name: Wait for vLLM-SR pods to be ready
      shell: |
        kubectl get pods -n vllm-sr -l app.kubernetes.io/name=vllm-sr -o json | jq -r '
          .items[] |
          select(.status.phase != "Running" or (.status.containerStatuses[] | select(.ready != true))) |
          .metadata.name' | wc -l
      register: pod_status
      until: pod_status.stdout == "0" and pod_status.rc == 0
      retries: 60
      delay: 10
      failed_when: pod_status.rc != 0 and pod_status.stdout != "0"
      run_once: true

    - name: Register vLLM-SR as routing model in LiteLLM
      import_tasks: register-model-genai-gateway.yml
      vars:
        reg_model_name: "vllm-sr/auto"
        reg_litellm_model: "openai/auto"
        reg_custom_llm_provider: "openai"
        reg_api_base: "http://vllm-sr-envoy.vllm-sr.svc.cluster.local:8801/v1"
        reg_input_cost_per_token: 0.001
        reg_output_cost_per_token: 0.002
        reg_model_mode: "chat"
      run_once: true

    - name: Display vLLM-SR deployment status
      debug:
        msg:
          - "vLLM Semantic Router deployed successfully."
          - ""
          - "Usage:"
          - "  curl -k https://{{ secret_name }}/v1/chat/completions \\"
          - "    -H 'Authorization: Bearer <LITELLM_KEY>' \\"
          - "    -d '{\"model\": \"vllm-sr/auto\", \"messages\": [...]}'"
          - ""
          - "Dashboard: https://vllm-sr-{{ secret_name }}/router"
      run_once: true

    - name: Clean up remote helm charts directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ remote_helm_charts_base }}/vllm-sr"
        - "{{ remote_helm_charts_base }}/vllm-sr-backends.yaml"
      run_once: true

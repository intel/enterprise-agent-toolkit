#
# deploy-ecmp-sysctl.yml — Fabric kernel tuning, derived from rack-profile.yaml.
#
# Two independent concerns, deliberately kept in separate plays because they
# apply to different nodes for different reasons:
#
#   1. ECMP flow hashing  → hosts: ecmp_nodes
#      Nodes with >=2 fabric NICs whose leaves both have a usable next-hop, in
#      BGP mode. Once Calico peers with both leaves the kernel receives equal-cost
#      routes via both NICs and hashes flows across them.
#      The parser derives this group; membership is a property of the FABRIC, not
#      of the CPU family. (This play previously targeted 'gnr_ap', which coupled a
#      network setting to a processor label and silently skipped any dual-homed
#      node that was not GNR-AP.)
#
#   2. Router forwarding  → hosts: fabric_routers
#      The hub in a star topology, which forwards between point-to-point legs.
#      Needs ip_forward, and loose RPF because replies legitimately arrive on a
#      different leg than the request left by.
#
# Both groups are absent unless the topology calls for them, so this playbook is
# a no-op on single-homed Clos sites and on clusters with no star hub.
#
# fib_multipath_hash_policy=1 : L4 per-flow hashing (vs default L3-only)
# rp_filter=2                 : loose reverse-path — required where reply packets
#                               may return via a different NIC
---
- name: Configure ECMP flow hashing on multi-homed fabric nodes
  hosts: "{{ ecmp_target | default('ecmp_nodes') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Enable L4 ECMP flow hashing
      ansible.posix.sysctl:
        name: net.ipv4.fib_multipath_hash_policy
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-ecmp.conf
        reload: true

    - name: Set loose reverse-path filter for asymmetric ECMP
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: "2"
        state: present
        sysctl_file: /etc/sysctl.d/99-ecmp.conf
        reload: true

    - name: Confirm sysctl values applied
      command: sysctl net.ipv4.fib_multipath_hash_policy net.ipv4.conf.all.rp_filter
      register: sysctl_result
      changed_when: false

    - name: Show applied sysctl values
      debug:
        msg: "{{ sysctl_result.stdout_lines }}"

- name: Configure IP forwarding on star-topology fabric routers
  hosts: "{{ fabric_router_target | default('fabric_routers') }}"
  become: true
  # os_family is needed to pick iptables-persistent vs iptables-services.
  gather_facts: true
  vars:
    # k8s-net-fabric.yml is generated by rack-profile-parser.sh and is NOT part
    # of the kubespray inventory this playbook is run against, so rack_fabric_cidrs
    # has to be loaded explicitly rather than inherited from group_vars.
    rack_fabric_vars_file: "{{ playbook_dir | dirname }}/inventory/metadata/k8s-net-fabric.yml"
  tasks:
    # include_vars reads the file from the CONTROL NODE, so no delegation is
    # needed and it must run per-host (not run_once) for the vars to be in scope
    # on every hub.
    - name: Load generated fabric metadata (for rack_fabric_cidrs)
      ansible.builtin.include_vars:
        file: "{{ rack_fabric_vars_file }}"
      failed_when: false

    # Absent metadata means the profile was never parsed, or predates
    # rack_fabric_cidrs. Skip the firewall work rather than guessing at prefixes
    # — a wrong ACCEPT rule is worse than none. The sysctls above still apply.
    - name: Warn if fabric CIDRs are unavailable
      ansible.builtin.debug:
        msg: >
          WARNING: rack_fabric_cidrs not found in {{ rack_fabric_vars_file }}.
          Skipping the FORWARD chain rules — if spoke-to-spoke traffic fails,
          check 'iptables -S FORWARD' on this hub for a DROP policy and re-run
          rack-profile-parser.sh to regenerate the metadata.
      when: rack_fabric_cidrs | default([]) | length == 0

    # Without this the hub drops transit traffic between spokes and the fabric
    # silently provides only hub-to-spoke reachability, never spoke-to-spoke.
    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-fabric-router.conf
        reload: true

    - name: Set loose reverse-path filter for multi-leg routing
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: "2"
        state: present
        sysctl_file: /etc/sysctl.d/99-fabric-router.conf
        reload: true

    - name: Confirm forwarding is enabled
      command: sysctl net.ipv4.ip_forward net.ipv4.conf.all.rp_filter
      register: router_sysctl_result
      changed_when: false

    - name: Show applied router sysctl values
      debug:
        msg: "{{ router_sysctl_result.stdout_lines }}"

    # ── iptables FORWARD: permit fabric transit ───────────────────────────────
    # ip_forward=1 lets the kernel route between legs, but the FORWARD chain can
    # still drop the packets. A FORWARD policy of DROP is the default on many
    # hardened images and is also what the Docker daemon sets, and it silently
    # blackholes ALL spoke-to-spoke traffic while hub-to-spoke keeps working —
    # so ping from the hub succeeds and the fabric still looks healthy. This
    # exact condition broke an etcd quorum on this stack: the three control-plane
    # members could each reach the hub but not each other.
    #
    # Scoped to rack_fabric_cidrs (generated from rack-profile.yaml) rather than
    # setting the chain policy to ACCEPT — we open only fabric transit and leave
    # the operator's policy for everything else untouched.
    - name: Ensure iptables is available on the fabric router
      ansible.builtin.package:
        name: iptables
        state: present

    - name: Configure and persist fabric FORWARD rules
      when: rack_fabric_cidrs | default([]) | length > 0
      block:
        # A rule per (source, destination) pair over the fabric prefixes. In a
        # star every spoke-to-spoke flow transits the hub, so all ordered pairs
        # are needed, including same-prefix ones (two hosts on one /30).
        # The module is idempotent on the comment+match tuple, so re-runs do not
        # accumulate duplicates.
        - name: Allow fabric transit through the FORWARD chain
          ansible.builtin.iptables:
            chain: FORWARD
            source: "{{ item.0 }}"
            destination: "{{ item.1 }}"
            jump: ACCEPT
            action: insert
            comment: "agentic-ai-stack: star fabric transit ({{ item.0 }} -> {{ item.1 }})"
            state: present
          loop: "{{ rack_fabric_cidrs | product(rack_fabric_cidrs) | list }}"

        # Rules added above live only in the running kernel; a reboot reverts to
        # the DROP policy and the fabric partitions again on the next boot.
        # One-touch provisioning means the fix has to survive that, so persist it.
        - name: Persist FORWARD rules across reboot (Debian/Ubuntu)
          when: ansible_facts['os_family'] == 'Debian'
          block:
            # DEBIAN_FRONTEND is set because iptables-persistent prompts to save
            # existing rules during install, which would hang a headless run.
            - name: Install iptables-persistent
              ansible.builtin.apt:
                name: iptables-persistent
                state: present
              environment:
                DEBIAN_FRONTEND: noninteractive

            - name: Ensure netfilter rules directory exists
              ansible.builtin.file:
                path: /etc/iptables
                state: directory
                owner: root
                group: root
                mode: '0755'

            - name: Save current iptables rules
              ansible.builtin.shell: >
                set -o pipefail;
                iptables-save > /etc/iptables/rules.v4
              args:
                executable: /bin/bash
              changed_when: true

            - name: Enable netfilter-persistent so rules reload on boot
              ansible.builtin.systemd:
                name: netfilter-persistent
                enabled: true
                state: started

        - name: Persist FORWARD rules across reboot (RHEL)
          when: ansible_facts['os_family'] == 'RedHat'
          block:
            - name: Install iptables-services
              ansible.builtin.package:
                name: iptables-services
                state: present

            - name: Save current iptables rules
              ansible.builtin.shell: >
                set -o pipefail;
                iptables-save > /etc/sysconfig/iptables
              args:
                executable: /bin/bash
              changed_when: true

            - name: Enable iptables service so rules reload on boot
              ansible.builtin.systemd:
                name: iptables
                enabled: true
                state: started

        # Persistence is best-effort per-OS; if neither branch matched, say so
        # rather than letting the operator assume the rules will survive a reboot.
        - name: Warn if FORWARD rules were not persisted
          ansible.builtin.debug:
            msg: >
              WARNING: FORWARD rules are active but NOT persisted — os_family
              '{{ ansible_facts['os_family'] }}' has no persistence branch here.
              They will be lost on reboot and spoke-to-spoke traffic will fail
              until this playbook is re-run.
          when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

    - name: Show FORWARD chain after configuration
      ansible.builtin.command: iptables -S FORWARD
      register: _forward_after
      changed_when: false

    - name: Report FORWARD chain state
      ansible.builtin.debug:
        msg: "{{ _forward_after.stdout_lines }}"

#
# precheck-docker.yml
#
# Fails fast if Docker is present on any node before Kubernetes is installed.
#
# WHY THIS IS A HARD STOP AND NOT A FIXUP
# ---------------------------------------
# A node running Kubernetes does not need Docker: kubelet talks to containerd
# directly via CRI, and kubespray installs and configures its own containerd.
# When Docker is also present it actively breaks the cluster in ways that are
# slow and expensive to diagnose:
#
#   1. iptables FORWARD policy — the Docker daemon sets the FORWARD chain policy
#      to DROP. That silently blackholes pod-to-pod and (on a star fabric)
#      spoke-to-spoke traffic. We have already lost a deployment to exactly
#      this: etcd could not form a quorum across the fabric because the hub's
#      FORWARD policy was DROP, and the symptom surfaced as an opaque etcd
#      timeout many minutes into the run.
#   2. Competing containerd — a Docker-managed containerd (or its socket) can
#      shadow the kubespray-managed one, so kubelet and the CNI disagree about
#      which runtime owns a container.
#   3. docker0 / bridge networking overlaps the pod CIDR on some subnet layouts.
#
# This playbook deliberately does NOT purge Docker or reset iptables. Removing
# a package and rewriting firewall rules on a node the operator did not expect
# us to touch is far more disruptive than stopping and asking. Cleanup is the
# operator's call, so we report precisely what we found and how to clear it.

---
- name: Fail fast if Docker is present on any node
  hosts: all
  become: true
  gather_facts: false
  # One dirty node aborts the whole run. Without this the failure is reduced to
  # a line in the PLAY RECAP while the deployment continues toward a cluster
  # that will break later, somewhere unrelated.
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"

  tasks:
    # `command -v docker` alone is not enough: a leftover binary with no running
    # daemon is harmless, while a running daemon with no CLI still owns the
    # FORWARD policy. Check the binary, the service state, and the socket.
    - name: Look for the docker binary
      ansible.builtin.command: command -v docker
      register: _docker_bin
      changed_when: false
      failed_when: false

    - name: Look for a running or enabled docker service
      ansible.builtin.command: >
        systemctl is-active docker.service docker.socket
      register: _docker_active
      changed_when: false
      failed_when: false

    - name: Look for docker packages
      ansible.builtin.shell: >
        set -o pipefail;
        (dpkg-query -W -f='${Package}\n' 'docker*' 2>/dev/null
         || rpm -qa 'docker*' 2>/dev/null
         || true) | grep -E '^docker' || true
      args:
        executable: /bin/bash
      register: _docker_pkgs
      changed_when: false
      failed_when: false

    # Report the FORWARD policy too — if Docker already set it to DROP, the
    # operator needs to reset it as part of cleanup, not just remove Docker.
    # Removing Docker does NOT restore a DROP policy back to ACCEPT.
    - name: Read current iptables FORWARD policy
      ansible.builtin.shell: >
        set -o pipefail;
        iptables -S FORWARD 2>/dev/null | head -1 || echo "unknown"
      args:
        executable: /bin/bash
      register: _forward_policy
      changed_when: false
      failed_when: false

    - name: Determine whether Docker is present
      ansible.builtin.set_fact:
        _docker_present: >-
          {{ (_docker_bin.rc == 0)
             or ('active' in (_docker_active.stdout_lines | default([])))
             or ((_docker_pkgs.stdout | default('') | trim) | length > 0) }}

    - name: Fail with cleanup instructions if Docker is present
      ansible.builtin.fail:
        msg: |
          Docker is present on {{ inventory_hostname }} and must be removed manually
          before this deployment can continue.

          Found:
            binary          : {{ _docker_bin.stdout | default('not found') | trim }}
            service state   : {{ _docker_active.stdout_lines | default(['not found']) | join(', ') }}
            packages        : {{ _docker_pkgs.stdout | default('') | trim | replace('\n', ', ') or 'none' }}
            FORWARD policy  : {{ _forward_policy.stdout | default('unknown') | trim }}

          A Kubernetes node does not need Docker — kubelet uses containerd directly
          via CRI, and this deployment installs and configures its own containerd.
          Leaving Docker installed causes failures that are hard to trace back:
          the Docker daemon sets the iptables FORWARD policy to DROP, which
          silently blackholes pod-to-pod and fabric traffic (this has already
          broken an etcd quorum on this stack), and a Docker-managed containerd
          can shadow the kubespray-managed one.

          We do not remove it automatically: purging packages and rewriting
          firewall rules on your nodes is your decision, not ours.

          To clear it on {{ inventory_hostname }}:

            sudo systemctl disable --now docker.service docker.socket
            sudo apt-get purge -y docker-ce docker-ce-cli containerd.io \
                 docker-buildx-plugin docker-compose-plugin docker.io
            sudo rm -rf /var/lib/docker /etc/docker /var/run/docker.sock

          Then RESET THE FORWARD POLICY — purging Docker does not undo it:

            sudo iptables -P FORWARD ACCEPT

          Re-run the deployment once every node is clear.
      when: _docker_present | bool

    - name: Confirm node is free of Docker
      ansible.builtin.debug:
        msg: "✓ {{ inventory_hostname }}: no Docker present (FORWARD policy: {{ _forward_policy.stdout | default('unknown') | trim }})"
      when: not (_docker_present | bool)

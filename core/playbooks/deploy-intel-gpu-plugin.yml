---
- name: Deploy Intel GPU Plugin for Intel XPU (Arc/Flex/Max) GPU
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"
  vars:
    # Branch/tag of intel/intel-device-plugins-for-kubernetes to deploy from.
    # Override via intel_gpu_plugin_ref in agentic-metadata.cfg to pin a release.
    intel_gpu_plugin_ref: "{{ intel_gpu_plugin_ref | default('main') }}"
    intel_gpu_plugin_manifest: >-
      https://raw.githubusercontent.com/intel/intel-device-plugins-for-kubernetes/{{ intel_gpu_plugin_ref }}/deployments/gpu_plugin/base/intel-gpu-plugin.yaml
  tasks:
    - name: Deploy Intel GPU Plugin DaemonSet (base overlay, no NFD required)
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ intel_gpu_plugin_manifest }}"
      register: gpu_plugin_deploy
      retries: 3
      delay: 10
      until: gpu_plugin_deploy.rc == 0
      changed_when: "'configured' in gpu_plugin_deploy.stdout or 'created' in gpu_plugin_deploy.stdout"
      run_once: true

    # Namespace/name of the DaemonSet are discovered dynamically rather than
    # hardcoded, since the "base" overlay's placement can vary by ref/version.
    - name: Wait for Intel GPU Plugin DaemonSet rollout (best effort)
      ansible.builtin.shell: |
        set -e
        read -r ns name <<< "$(kubectl get daemonsets -A \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | grep -i intel-gpu-plugin | head -1)"
        if [ -n "$ns" ] && [ -n "$name" ]; then
          kubectl rollout status "daemonset/$name" -n "$ns" --timeout=180s
        else
          echo "intel-gpu-plugin DaemonSet not found yet; skipping rollout wait"
        fi
      args:
        executable: /bin/bash
      register: gpu_plugin_rollout
      changed_when: false
      ignore_errors: true
      run_once: true

    - name: Print Intel GPU Plugin deployment status
      debug:
        msg:
          - "================================================================"
          - "Intel GPU Plugin Deployment Status"
          - "================================================================"
          - "Manifest ref: {{ intel_gpu_plugin_ref }}"
          - "{{ gpu_plugin_rollout.stdout_lines | default(['rollout status unavailable']) }}"
          - "Verify with: kubectl describe node <node> | grep gpu.intel.com"
          - "================================================================"
      run_once: true

# ---------------------------------------------------------------------------
# Deploy the content-safety guardrail:
#   1. Deploy the guard vLLM (small, low-latency) as one release of the vllm
#      chart using its guardrail-values.yaml -- the same pattern as the
#      embedding/reranker variants of that chart.
#   2. Render the screening logic for the selected guard model and register it
#      with the GenAI Gateway as a LiteLLM `custom_code` guardrail, which calls
#      the guard vLLM directly.
#
# The guard model is configurable: guardrail_model selects both the vLLM model
# and the code template that parses its verdicts (guard_code_templates below).
# The guard endpoint is derived from this release, so a different namespace,
# release or port needs no edit to the template -- see docs/guardrails.md.
#
# Invoked by deploy-agentic-stack.sh only when deploy_guardrails == on.
# Expected extra-vars from the caller:
#   guardrail_model       guard model id (e.g. Qwen/Qwen3Guard-Gen-0.6B)
#   guardrails_repo_dir   absolute path to the repo root (holds the code template)
# ---------------------------------------------------------------------------
---
- name: Deploy content-safety guardrail
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"
  vars_files:
    - "{{ lookup('env', 'PWD') }}/config/vault.yml"
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_common.yml"
  vars:
    guard_ns: guardrails
    guard_vllm_release: vllm-guard
    # Service rendered by the vllm chart ({{ fullname }}-service), port 80 ->
    # targetPort 2080.
    guard_vllm_service: vllm-guard-service
    guard_service_port: 80
    guardrail_model: "{{ guardrail_model | default('Qwen/Qwen3Guard-Gen-0.6B') }}"
    # Single source of truth for the guardrail's identity: the LiteLLM
    # guardrail_name and the name shown in the gateway UI derive from this.
    # Model-agnostic by design -- it must NOT track guardrail_model, or swapping
    # the guard model would rename the guardrail and leave the old registration
    # behind, screening every request through a guardrail nobody updates.
    guard_id: "content-safety"
    # Guard endpoint baked into the rendered code. Derived from this release, so
    # it follows a namespace/release/port change automatically; override with
    # -e guardrail_service_url=... to screen against an OpenAI-compatible guard
    # outside this release (another namespace, or off-cluster).
    guard_service_url: >-
      {{ guardrail_service_url | default('http://' ~ guard_vllm_service ~ '.' ~ guard_ns
         ~ '.svc.cluster.local:' ~ guard_service_port ~ '/v1/chat/completions', true) }}
    # Verdicts are a couple of lines, and this hook blocks the request being
    # screened, so every extra token is latency. http_post clamps timeout to 60s.
    guard_max_tokens: 32
    guard_timeout: 60
    # Qwen3Guard's third label. Off by default: "Controversial" is advisory, and
    # blocking it rejects a lot of legitimate traffic.
    guard_block_on_controversial: false
    # Guard model id -> code template under core/lib/guardrails/. One template
    # per verdict *format*, so another size of the same family is one line here;
    # a model that reports verdicts differently gets its own template.
    guard_code_templates:
      "Qwen/Qwen3Guard-Gen-0.6B": "qwen3guard_gen.py.j2"
    # Same gate the served LLMs use in deploy-inference-models.yml; both vars come
    # in as extra-vars, so default them for a standalone run of this playbook.
    guard_balloons_enabled: >-
      {{ (cpu_playbook | default('false')) == 'true'
         and (balloon_policy_cpu | default('None')) == 'enabled' }}
    # Proxy --set-string args for the guard vLLM chart, built from env_proxy
    # (no_proxy already includes the apiserver node IP; escape commas for helm).
    guard_helm_proxy_args: >-
      {% if env_proxy.http_proxy | default('') %}
      --set-string global.http_proxy={{ env_proxy.http_proxy }}
      --set-string global.https_proxy={{ env_proxy.https_proxy | default(env_proxy.http_proxy) }}
      --set-string global.no_proxy={{ env_proxy.no_proxy | default('') | replace(',', '\\,') }}
      {% endif %}
  tasks:
    # Fails the deploy before anything is installed, rather than deploying a
    # guard model whose verdicts nothing can parse.
    - name: Fail early on a guard model with no code template
      ansible.builtin.assert:
        that: guardrail_model in guard_code_templates
        fail_msg: >-
          No guardrail code template for '{{ guardrail_model }}'.
          Supported guard models: {{ guard_code_templates.keys() | join(', ') }}.
          Add a template under core/lib/guardrails/ and register it in
          guard_code_templates (see docs/guardrails.md).
      run_once: true

    - name: Ensure the guardrails namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ guard_ns }}"
        state: present
      run_once: true

    # Size the guard's NRI balloon with the SAME logic the served LLMs use: run
    # the shared topology role (exports optimal_balloon_config.workload_cpus) and
    # read per-model sizing from guardrail-values.yaml, the way
    # deploy-inference-models.yml reads xeon-values.yaml.
    - name: Size the guard vLLM for its NRI balloon
      when: guard_balloons_enabled | bool
      run_once: true
      block:
        - name: Perform CPU topology detection and optimization
          ansible.builtin.include_role:
            name: utils
            tasks_from: get_optimized_cpu_topology
          vars:
            target_model: "guardrail"

        - name: Load guardrail-values.yaml for the guard's CPU/TP sizing
          ansible.builtin.slurp:
            src: "{{ remote_helm_charts_base }}/vllm/guardrail-values.yaml"
          register: _guard_values_raw

        - name: Parse the guard's sizing from guardrail-values.yaml
          ansible.builtin.set_fact:
            guard_model_configs: "{{ (_guard_values_raw.content | b64decode | from_yaml).modelConfigs | default({}) }}"
            guard_default_model_config: "{{ (_guard_values_raw.content | b64decode | from_yaml).defaultModelConfigs | default({'optimal_cpu_cores': 8, 'tensor_parallel_size': 1, 'pipeline_parallel_size': 1}) }}"

        - name: Calculate optimal memory for the guard vLLM
          ansible.builtin.include_role:
            name: utils
            tasks_from: get_optimal_memory
          vars:
            memory_tp_size: >-
              {{ guard_model_configs.get(guardrail_model, guard_default_model_config).tensor_parallel_size | default(1) }}

    - name: Deploy the guard vLLM (low-latency) — model {{ guardrail_model }}
      ansible.builtin.command: >-
        helm upgrade --install {{ guard_vllm_release }} "{{ remote_helm_charts_base }}/vllm"
        --namespace {{ guard_ns }} --create-namespace
        --values "{{ remote_helm_charts_base }}/vllm/guardrail-values.yaml"
        --set-string LLM_MODEL_ID="{{ guardrail_model }}"
        --set-string global.HUGGINGFACEHUB_API_TOKEN="{{ hugging_face_token }}"
        {{ guard_helm_proxy_args }}
        {% if guard_balloons_enabled | bool %}
        {% set _gc = guard_model_configs.get(guardrail_model, guard_default_model_config) %}
        --set cpu_balloon_annotation="vllm-balloon-tp{{ _gc.tensor_parallel_size | default(1) }}"
        --set cpu="{{ _gc.optimal_cpu_cores | default((optimal_balloon_config.workload_cpus | int) * (_gc.tensor_parallel_size | default(1) | int)) | int }}"
        --set memory="{{ optimal_memory_gb | default(16) }}Gi"
        --set tensor_parallel_size={{ _gc.tensor_parallel_size | default(1) }}
        --set pipeline_parallel_size={{ _gc.pipeline_parallel_size | default(1) }}
        {% endif %}
      register: guard_vllm_install
      failed_when: guard_vllm_install.rc != 0
      run_once: true


    # Rendered here, not in the gateway: guardrail_model feeds both LLM_MODEL_ID
    # above and GUARD_MODEL in the code, and the endpoint comes from the release
    # just installed, so the parser, the served guard model and the URL cannot
    # drift apart.
    - name: Render the guardrail screening code for {{ guardrail_model }}
      ansible.builtin.set_fact:
        guard_custom_code: >-
          {{ lookup('template', guardrails_repo_dir ~ '/core/lib/guardrails/'
             ~ guard_code_templates[guardrail_model]) }}
      run_once: true

    - name: Register the guardrail with the GenAI Gateway
      ansible.builtin.import_tasks: register-guardrail-genai-gateway.yml
      vars:
        reg_guardrail_name: "{{ guard_id | replace('-', '_') }}"
        reg_custom_code: "{{ guard_custom_code }}"
        reg_description: >-
          Safety classification via self-hosted {{ guardrail_model }} at
          {{ guard_service_url }} (custom_code, pre_call). Fails closed when the
          guard model is unreachable or its verdict cannot be parsed.

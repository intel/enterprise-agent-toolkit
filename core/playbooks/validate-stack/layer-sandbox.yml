# layer-sandbox.yml — Validates Agent Sandbox CRD lifecycle (gated on deploy_agent_sandbox)

---
- name: Discover agent-sandbox namespace
  ansible.builtin.shell: |
    kubectl get ns agent-sandbox-system >/dev/null 2>&1 && echo "agent-sandbox-system" || \
    (kubectl get ns agent-sandbox >/dev/null 2>&1 && echo "agent-sandbox" || echo "")
  register: _sandbox_ns
  changed_when: false
  ignore_errors: true

- name: Check Agent Sandbox CRD controller pod Running
  ansible.builtin.shell: |
    NS="{{ _sandbox_ns.stdout | trim }}"
    [ -z "$NS" ] && { echo "NotFound"; exit 1; }
    # Try common label patterns, then name-based match
    kubectl get pods -n "$NS" -l app=agent-sandbox-controller -o jsonpath='{.items[0].status.phase}' 2>/dev/null || \
    kubectl get pods -n "$NS" -l app=sandbox-controller -o jsonpath='{.items[0].status.phase}' 2>/dev/null || \
    kubectl get pods -n "$NS" -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null | grep controller | head -1 | cut -d= -f2 || \
    echo "NotFound"
  register: _sandbox_controller
  changed_when: false
  ignore_errors: true

- name: Record sandbox controller status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'sandbox',
        'check': 'Sandbox CRD controller Running',
        'status': 'OK' if ('Running' in (_sandbox_controller.stdout | default(''))) else 'FAIL',
        'evidence': 'controller: ' + (_sandbox_controller.stdout | default('not found') | trim),
        'hint': 'Check: kubectl get pods -n ' + (_sandbox_ns.stdout | default('agent-sandbox-system') | trim) + ' — controller may be CrashLoopBackOff'
      }] }}

- name: Check sandbox-router pod Running
  ansible.builtin.shell: |
    NS="{{ _sandbox_ns.stdout | trim }}"
    [ -z "$NS" ] && { echo "NotFound"; exit 1; }
    kubectl get pods -n "$NS" -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null | grep router | head -1 | cut -d= -f2 || \
    echo "NotFound"
  register: _sandbox_router
  changed_when: false
  ignore_errors: true

- name: Record sandbox-router status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'sandbox',
        'check': 'Sandbox-router pod Running',
        'status': 'OK' if (_sandbox_router.stdout | default('') | trim == 'Running') else 'FAIL',
        'evidence': 'router: ' + (_sandbox_router.stdout | default('not found') | trim),
        'hint': 'Check: kubectl get pods -n ' + (_sandbox_ns.stdout | default('agent-sandbox-system') | trim) + ' -l app=sandbox-router'
      }] }}

- name: Check SandboxTemplate exists
  ansible.builtin.shell: |
    NS="{{ _sandbox_ns.stdout | trim | default('agent-sandbox-system') }}"
    kubectl get sandboxtemplate python-sandbox-template -n "$NS" -o jsonpath='{.metadata.name}' 2>/dev/null || \
    kubectl get sandboxtemplates.extensions.agents.x-k8s.io python-sandbox-template -n "$NS" -o jsonpath='{.metadata.name}' 2>/dev/null || echo ""
  register: _sandbox_template
  changed_when: false
  ignore_errors: true

- name: Record SandboxTemplate status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'sandbox',
        'check': 'SandboxTemplate python-sandbox-template',
        'status': 'OK' if ('python-sandbox-template' in (_sandbox_template.stdout | default(''))) else 'FAIL',
        'evidence': 'template: ' + (_sandbox_template.stdout | default('not found') | trim),
        'hint': 'SandboxTemplate missing — check: kubectl get sandboxtemplates.extensions.agents.x-k8s.io -n ' + (_sandbox_ns.stdout | default('agent-sandbox-system') | trim)
      }] }}

- name: Check SandboxWarmPool readiness
  ansible.builtin.shell: |
    NS="{{ _sandbox_ns.stdout | trim | default('agent-sandbox-system') }}"
    # Get WarmPool status — ready sandboxes prove the full lifecycle works
    WP=$(kubectl get sandboxwarmpool -n "$NS" -o jsonpath='{range .items[*]}{.metadata.name}:{.spec.replicas}:{.status.readySandboxes}{"\n"}{end}' 2>/dev/null || \
         kubectl get sandboxwarmpools.extensions.agents.x-k8s.io -n "$NS" -o jsonpath='{range .items[*]}{.metadata.name}:{.spec.replicas}:{.status.readySandboxes}{"\n"}{end}' 2>/dev/null || echo "")
    if [ -z "$WP" ]; then
      echo "NO_WARMPOOL"
    else
      echo "$WP" | while IFS=: read -r NAME DESIRED READY; do
        READY=${READY:-0}
        echo "pool=${NAME} desired=${DESIRED} ready=${READY}"
      done
    fi
  register: _sandbox_warmpool
  changed_when: false
  ignore_errors: true

- name: Record WarmPool readiness
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'sandbox',
        'check': 'SandboxWarmPool readiness',
        'status': 'OK' if ('ready=' in (_sandbox_warmpool.stdout | default('')) and 'ready=0' not in (_sandbox_warmpool.stdout | default('NO_WARMPOOL'))) else ('PENDING' if 'ready=0' in (_sandbox_warmpool.stdout | default('')) else 'FAIL'),
        'evidence': _sandbox_warmpool.stdout | default('no warm pool found') | trim | truncate(150),
        'hint': 'WarmPool has no ready sandboxes — check pod status: kubectl get pods -n ' + (_sandbox_ns.stdout | default('agent-sandbox-system') | trim) + ' and controller logs'
      }] }}

- name: Check WarmPool pod health
  ansible.builtin.shell: |
    NS="{{ _sandbox_ns.stdout | trim | default('agent-sandbox-system') }}"
    TOTAL=$(kubectl get pods -n "$NS" --no-headers 2>/dev/null | wc -l)
    RUNNING=$(kubectl get pods -n "$NS" --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
    NOT_RUNNING=$(kubectl get pods -n "$NS" --no-headers 2>/dev/null | grep -v Running | grep -v Completed | head -3 || echo "")
    echo "total=$TOTAL running=$RUNNING"
    [ -n "$NOT_RUNNING" ] && echo "issues: $NOT_RUNNING"
  register: _sandbox_pods
  changed_when: false
  ignore_errors: true

- name: Record WarmPool pod health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'sandbox',
        'check': 'Sandbox namespace pod health',
        'status': 'OK' if ('issues' not in (_sandbox_pods.stdout | default(''))) else 'FAIL',
        'evidence': (_sandbox_pods.stdout_lines | default([]) | first | default('unknown')) | truncate(100),
        'hint': 'Unhealthy pods in sandbox namespace — check: kubectl get pods -n ' + (_sandbox_ns.stdout | default('agent-sandbox-system') | trim) + ' and describe failing pods'
      }] }}

# layer-kubernetes.yml — Validates Kubernetes cluster health

---
- name: Check all nodes are Ready
  ansible.builtin.command:
    cmd: kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
  register: _k8s_nodes
  changed_when: false
  ignore_errors: true

- name: Record node readiness
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kubernetes',
        'check': 'All nodes Ready',
        'status': 'OK' if (_k8s_nodes.rc == 0 and 'False' not in _k8s_nodes.stdout and 'Unknown' not in _k8s_nodes.stdout) else 'FAIL',
        'evidence': _k8s_nodes.stdout_lines | default([]) | join(', ') | truncate(200),
        'hint': 'Run: kubectl get nodes — check NotReady nodes for kubelet issues, network, or disk pressure'
      }] }}

- name: Check for unhealthy infra pods (k8s platform namespaces only)
  ansible.builtin.shell: |
    INFRA_NS="kube-system kube-node-lease kube-public local-path-storage rook-ceph calico-system"
    UNHEALTHY=""
    for NS in $INFRA_NS; do
      kubectl get ns "$NS" >/dev/null 2>&1 || continue
      RESULT=$(kubectl get pods -n "$NS" --field-selector='status.phase!=Running,status.phase!=Succeeded' \
        -o jsonpath='{range .items[*]}'"$NS"'/{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null | grep -v '^$')
      [ -n "$RESULT" ] && UNHEALTHY="${UNHEALTHY}${RESULT}\n"
    done
    printf '%b' "$UNHEALTHY" | grep -v '^$' || true
  register: _k8s_unhealthy_pods
  changed_when: false
  ignore_errors: true

- name: Record pod health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kubernetes',
        'check': 'No unhealthy infra pods',
        'status': 'OK' if (_k8s_unhealthy_pods.stdout | trim | length == 0) else 'FAIL',
        'evidence': _k8s_unhealthy_pods.stdout | default('all infra pods healthy') | trim | truncate(200) | default('all infra pods healthy'),
        'hint': 'Run: kubectl get pods -n kube-system --field-selector=status.phase!=Running,status.phase!=Succeeded'
      }] }}

- name: Check Calico pods healthy
  ansible.builtin.shell: |
    # Calico may be in calico-system (standalone) or kube-system (Kubespray) — check both
    PODS=$(kubectl get pods -n calico-system -l k8s-app=calico-node -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null)
    [ -z "$PODS" ] && PODS=$(kubectl get pods -n kube-system -l k8s-app=calico-node -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null)
    echo "$PODS"
  register: _k8s_calico
  changed_when: false
  ignore_errors: true

- name: Record Calico health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kubernetes',
        'check': 'Calico pods healthy',
        'status': 'OK' if (_k8s_calico.rc == 0 and 'Running' in _k8s_calico.stdout and 'Failed' not in _k8s_calico.stdout) else 'FAIL',
        'evidence': (_k8s_calico.stdout_lines | default([]) | length | string) + ' calico pods',
        'hint': 'Check: kubectl get pods -n calico-system — look for CrashLoopBackOff or missing pods'
      }] }}

- name: Check CoreDNS responding
  ansible.builtin.command:
    cmd: kubectl run validate-dns-test --image=busybox:1.36 --restart=Never --rm -i --timeout=30s -- nslookup kubernetes.default.svc.cluster.local
  register: _k8s_dns
  changed_when: false
  ignore_errors: true

- name: Record CoreDNS health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kubernetes',
        'check': 'CoreDNS responding',
        'status': 'OK' if (_k8s_dns.rc == 0) else 'FAIL',
        'evidence': 'DNS resolution successful' if _k8s_dns.rc == 0 else (_k8s_dns.stderr | default('timeout') | truncate(100)),
        'hint': 'Check: kubectl get pods -n kube-system -l k8s-app=kube-dns — restart CoreDNS if needed'
      }] }}

- name: Check node resource pressure
  ansible.builtin.shell: |
    kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}: MemoryPressure={.status.conditions[?(@.type=="MemoryPressure")].status}, DiskPressure={.status.conditions[?(@.type=="DiskPressure")].status}{"\n"}{end}'
  register: _k8s_pressure
  changed_when: false
  ignore_errors: true

- name: Record resource pressure
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kubernetes',
        'check': 'No resource pressure',
        'status': 'OK' if ('True' not in _k8s_pressure.stdout) else 'FAIL',
        'evidence': _k8s_pressure.stdout | truncate(200),
        'hint': 'Nodes reporting pressure — check: kubectl describe node <name> for eviction signals'
      }] }}

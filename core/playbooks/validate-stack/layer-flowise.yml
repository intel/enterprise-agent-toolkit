# layer-flowise.yml — Validates Flowise / Agentic AI Plugin (gated on deploy_agenticai_plugin)

---
- name: Check Flowise namespace and pods Running
  ansible.builtin.shell: |
    kubectl get pods -n flowise -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null || echo "NAMESPACE_MISSING"
  register: _flowise_pods
  changed_when: false
  ignore_errors: true

- name: Record Flowise pod status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'flowise',
        'check': 'Flowise pods Running',
        'status': 'OK' if (_flowise_pods.rc == 0 and 'Running' in (_flowise_pods.stdout | default('')) and 'NAMESPACE_MISSING' not in (_flowise_pods.stdout | default(''))) else 'FAIL',
        'evidence': (_flowise_pods.stdout_lines | default([]) | select('match', '.*Running.*') | list | length | string) + ' Flowise pods running',
        'hint': 'Check: kubectl get pods -n flowise — verify Flowise deployment exists'
      }] }}

- name: Check Flowise UI endpoint through ingress
  ansible.builtin.uri:
    url: "https://{{ cluster_url }}/flowise"
    method: GET
    validate_certs: false
    timeout: 15
    status_code: [200, 301, 302]
  register: _flowise_ui
  ignore_errors: true
  when: cluster_url | length > 0

- name: Check Flowise UI via service (fallback)
  ansible.builtin.shell: |
    kubectl exec -n flowise deploy/flowise -- curl -sf http://localhost:3000 2>/dev/null | head -c 100 || echo "UNREACHABLE"
  register: _flowise_ui_svc
  changed_when: false
  ignore_errors: true
  when: cluster_url | length == 0 or (_flowise_ui.status | default(0)) not in [200, 301, 302]

- name: Record Flowise UI
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'flowise',
        'check': 'Flowise UI endpoint',
        'status': 'OK' if ((_flowise_ui.status | default(0)) in [200, 301, 302] or 'UNREACHABLE' not in (_flowise_ui_svc.stdout | default('UNREACHABLE'))) else 'FAIL',
        'evidence': 'UI accessible' if ((_flowise_ui.status | default(0)) in [200, 301, 302]) else (_flowise_ui_svc.stdout | default('unreachable') | truncate(80)),
        'hint': 'Flowise UI not responding — check: kubectl logs -n flowise deploy/flowise; verify ingress rule for /flowise path'
      }] }}

- name: Check Flowise backing services connectivity
  ansible.builtin.shell: |
    # Verify Flowise can reach Redis and pgvector
    kubectl exec -n flowise deploy/flowise -- sh -c '
      echo -n "redis:"; nc -z -w 3 redis-stack-server.redis.svc.cluster.local 6379 && echo "OK" || echo "FAIL"
      echo -n "pgvector:"; nc -z -w 3 pgvector.pgvector.svc.cluster.local 5432 && echo "OK" || echo "FAIL"
    ' 2>/dev/null || echo "redis:FAIL pgvector:FAIL"
  register: _flowise_backends
  changed_when: false
  ignore_errors: true

- name: Record Flowise backing services
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'flowise',
        'check': 'Flowise backing services (Redis, pgvector)',
        'status': 'OK' if ('FAIL' not in (_flowise_backends.stdout | default('FAIL'))) else 'FAIL',
        'evidence': _flowise_backends.stdout | default('check failed') | truncate(100),
        'hint': 'Flowise cannot reach backing services — check network policies and service DNS'
      }] }}

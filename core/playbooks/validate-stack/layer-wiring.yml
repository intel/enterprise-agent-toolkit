# layer-wiring.yml — Validates inter-component wiring (data flow between services)

---
- name: Check ingress routing (external path to LiteLLM)
  ansible.builtin.uri:
    url: "https://{{ cluster_url }}/health"
    method: GET
    validate_certs: false
    timeout: 15
    return_content: true
  register: _wiring_ingress
  ignore_errors: true
  when: cluster_url | length > 0

- name: Record ingress routing
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'wiring',
        'check': 'Ingress routing to LiteLLM',
        'status': 'OK' if (_wiring_ingress.status | default(0) in [200, 401, 403]) else 'FAIL',
        'evidence': 'https://' + cluster_url + '/health -> HTTP ' + (_wiring_ingress.status | default(0) | string),
        'hint': 'Check: kubectl get ingress -A — verify NGINX ingress rules, TLS cert, and backend service'
      }] }}
  when: cluster_url | length > 0

- name: Check TLS certificate validity
  ansible.builtin.shell: |
    echo | openssl s_client -connect {{ cluster_url }}:443 -servername {{ cluster_url }} 2>/dev/null | \
    openssl x509 -noout -dates -subject -checkend 86400 2>&1
  register: _wiring_tls
  changed_when: false
  ignore_errors: true
  when: cluster_url | length > 0

- name: Record TLS validity
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'wiring',
        'check': 'TLS certificate valid',
        'status': 'OK' if (_wiring_tls.rc == 0 and 'will not expire' in (_wiring_tls.stdout | default(''))) else 'FAIL',
        'evidence': _wiring_tls.stdout_lines | default([]) | select('match', '.*not[AB]fter.*') | first | default('cert check failed') | truncate(100),
        'hint': 'Certificate expired or expiring within 24h — renew TLS cert and update ingress secret'
      }] }}
  when: cluster_url | length > 0

- name: Check LiteLLM -> vLLM upstream wiring
  ansible.builtin.shell: |
    KEY="{{ litellm_master_key | default('') }}"
    if [ -z "$KEY" ]; then
      KEY=$(kubectl get secret -n genai-gateway litellm-api-key -o jsonpath='{.data.api-key}' 2>/dev/null | base64 -d 2>/dev/null || echo "")
    fi
    if [ -n "$KEY" ]; then
      RESULT=$(curl -sf -H "Authorization: Bearer $KEY" http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/v1/models 2>/dev/null || echo "")
    else
      RESULT=$(curl -sf http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/v1/models 2>/dev/null || echo "")
    fi
    if [ -n "$RESULT" ] && echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])),'models:', ','.join([m.get('id','?') for m in d.get('data',[])]))" 2>/dev/null; then
      true
    else
      echo "0 models configured"
    fi
  register: _wiring_litellm_vllm
  changed_when: false
  no_log: true
  ignore_errors: true

- name: Record LiteLLM -> vLLM wiring
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'wiring',
        'check': 'LiteLLM -> vLLM upstream config',
        'status': 'OK' if ('0 models' not in (_wiring_litellm_vllm.stdout | default('0 models'))) else 'PENDING',
        'evidence': _wiring_litellm_vllm.stdout | default('no models') | truncate(100),
        'hint': 'LiteLLM has no model backends configured — check LiteLLM config/proxy_config.yaml or admin UI'
      }] }}

- name: Check Helm release health
  ansible.builtin.shell: |
    BAD=$(helm list -A -o json 2>/dev/null | python3 -c "import sys,json; releases=json.load(sys.stdin); bad=[r['name']+':'+r['status'] for r in releases if r.get('status') not in ('deployed','superseded')]; print(','.join(bad) if bad else '')" 2>/dev/null)
    if [ -z "$BAD" ]; then
      TOTAL=$(helm list -A -q 2>/dev/null | wc -l)
      echo "ALL_HEALTHY:${TOTAL} releases"
    else
      echo "UNHEALTHY:${BAD}"
    fi
  register: _wiring_helm
  changed_when: false
  ignore_errors: true

- name: Record Helm release health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'wiring',
        'check': 'Helm releases healthy',
        'status': 'OK' if ('ALL_HEALTHY' in (_wiring_helm.stdout | default(''))) else 'FAIL',
        'evidence': _wiring_helm.stdout | default('check failed') | truncate(150),
        'hint': 'Run: helm list -A — look for failed/pending-upgrade releases and fix with helm rollback or helm upgrade'
      }] }}

- name: Check DCGM metrics in Prometheus (if GPU + observability)
  ansible.builtin.shell: |
    kubectl exec -n monitoring deploy/prometheus-server -- \
      curl -sf 'http://localhost:9090/api/v1/query?query=DCGM_FI_DEV_GPU_UTIL' 2>/dev/null | \
    python3 -c "import sys,json; r=json.load(sys.stdin); print(len(r.get('data',{}).get('result',[])), 'GPU metrics')" 2>/dev/null || echo "0 GPU metrics"
  register: _wiring_dcgm
  changed_when: false
  ignore_errors: true
  when: rack_scale_gpu_vendor | length > 0 and deploy_observability in ['on', 'yes']

- name: Record DCGM -> Prometheus wiring
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'wiring',
        'check': 'DCGM metrics in Prometheus',
        'status': 'OK' if ('0 GPU' not in (_wiring_dcgm.stdout | default('0 GPU'))) else 'FAIL',
        'evidence': _wiring_dcgm.stdout | default('no metrics') | truncate(80),
        'hint': 'Check DCGM exporter pods and ServiceMonitor: kubectl get pods -n gpu-operator -l app=nvidia-dcgm-exporter'
      }] }}
  when: rack_scale_gpu_vendor | length > 0 and deploy_observability in ['on', 'yes']

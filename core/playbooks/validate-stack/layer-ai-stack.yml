# layer-ai-stack.yml — Validates AI Stack service health

---
- name: Check LiteLLM gateway health
  ansible.builtin.uri:
    url: "http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/health"
    method: GET
    return_content: true
    timeout: 15
  register: _ai_litellm
  ignore_errors: true
  delegate_to: localhost

- name: Record LiteLLM health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'LiteLLM gateway /health',
        'status': 'OK' if (_ai_litellm.status | default(0) in [200, 401, 403]) else 'FAIL',
        'evidence': 'HTTP ' + (_ai_litellm.status | default(0) | string),
        'hint': 'Check: kubectl get pods -n genai-gateway — LiteLLM may be starting or misconfigured'
      }] }}

- name: Get Redis password from secret
  ansible.builtin.shell: |
    kubectl get secret -n redis redis-stack-server-credentials -o jsonpath='{.data.REDIS_PASSWORD}' 2>/dev/null | base64 -d 2>/dev/null || \
    kubectl exec -n redis pod/redis-stack-server-0 -- printenv REDIS_PASSWORD 2>/dev/null || echo ""
  register: _redis_pass
  changed_when: false
  no_log: true
  ignore_errors: true

- name: Check Redis connectivity
  ansible.builtin.shell: |
    PASS="{{ _redis_pass.stdout | trim }}"
    AUTH=""
    [ -n "$PASS" ] && AUTH="-a $PASS --no-auth-warning"
    kubectl exec -n redis statefulset/redis-stack-server -- redis-cli $AUTH PING 2>/dev/null || \
    kubectl exec -n redis pod/redis-stack-server-0 -- redis-cli $AUTH PING 2>/dev/null
  register: _ai_redis
  changed_when: false
  ignore_errors: true

- name: Record Redis health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'Redis PING/PONG',
        'status': 'OK' if (_ai_redis.rc == 0 and 'PONG' in _ai_redis.stdout) else 'FAIL',
        'evidence': _ai_redis.stdout | default('no response') | truncate(50),
        'hint': 'Check: kubectl get pods -n redis — verify redis-stack-server is Running'
      }] }}

- name: Check Redis data path (write/read/delete)
  ansible.builtin.shell: |
    PASS="{{ _redis_pass.stdout | trim }}"
    AUTH=""
    [ -n "$PASS" ] && AUTH="-a $PASS --no-auth-warning"
    TARGET="statefulset/redis-stack-server"
    kubectl get -n redis "$TARGET" >/dev/null 2>&1 || TARGET="pod/redis-stack-server-0"
    kubectl exec -n redis "$TARGET" -- redis-cli $AUTH SET validate_stack_test "ok" EX 30 && \
    kubectl exec -n redis "$TARGET" -- redis-cli $AUTH GET validate_stack_test && \
    kubectl exec -n redis "$TARGET" -- redis-cli $AUTH DEL validate_stack_test
  register: _ai_redis_data
  changed_when: false
  ignore_errors: true

- name: Record Redis data path
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'Redis data path (write/read/delete)',
        'status': 'OK' if (_ai_redis_data.rc == 0 and 'ok' in (_ai_redis_data.stdout | lower)) else 'FAIL',
        'evidence': 'write/read/delete cycle successful' if (_ai_redis_data.rc == 0 and 'ok' in (_ai_redis_data.stdout | lower)) else (_ai_redis_data.stderr | default(_ai_redis_data.stdout | default('failed')) | truncate(100)),
        'hint': 'Redis data path broken — check memory/persistence: kubectl logs -n redis statefulset/redis-stack-server'
      }] }}

- name: Discover pgvector credentials
  ansible.builtin.shell: |
    TARGET="statefulset/pgvector"
    kubectl get -n pgvector "$TARGET" >/dev/null 2>&1 || TARGET="pod/pgvector-0"
    PG_USER=$(kubectl exec -n pgvector "$TARGET" -- printenv POSTGRES_USER 2>/dev/null || echo "postgres")
    PG_DB=$(kubectl exec -n pgvector "$TARGET" -- printenv POSTGRES_DB 2>/dev/null || echo "postgres")
    PG_PASS=$(kubectl exec -n pgvector "$TARGET" -- printenv POSTGRES_PASSWORD 2>/dev/null || echo "")
    echo "user=$PG_USER db=$PG_DB target=$TARGET"
  register: _pgvector_creds
  changed_when: false
  ignore_errors: true

- name: Parse pgvector credentials
  ansible.builtin.set_fact:
    _pg_user: "{{ (_pgvector_creds.stdout | default('') | regex_search('user=(\\S+)', '\\1') | default(['postgres'], true))[0] }}"
    _pg_db: "{{ (_pgvector_creds.stdout | default('') | regex_search('db=(\\S+)', '\\1') | default(['postgres'], true))[0] }}"
    _pg_target: "{{ (_pgvector_creds.stdout | default('') | regex_search('target=(\\S+)', '\\1') | default(['pod/pgvector-0'], true))[0] }}"

- name: Check PostgreSQL/pgvector connectivity
  ansible.builtin.shell: |
    OUTPUT=$(kubectl exec -n pgvector {{ _pg_target }} -- bash -c 'PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U {{ _pg_user }} -d {{ _pg_db }} -c "SELECT 1" -t' 2>&1)
    RC=$?
    CLEAN=$(echo "$OUTPUT" | tr -d '[:space:]')
    echo "rc=$RC output=$CLEAN user={{ _pg_user }} db={{ _pg_db }}"
    [ "$RC" -eq 0 ] && echo "$CLEAN" | grep -q "1"
  register: _ai_pgvector
  changed_when: false
  ignore_errors: true

- name: Record pgvector health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'PostgreSQL/pgvector SELECT 1',
        'status': 'OK' if (_ai_pgvector.rc == 0) else 'FAIL',
        'evidence': _ai_pgvector.stdout | default('connection failed') | truncate(100),
        'hint': 'Check: kubectl get pods -n pgvector — verify pgvector deployment is Running'
      }] }}

- name: Check pgvector extension available
  ansible.builtin.shell: |
    OUTPUT=$(kubectl exec -n pgvector {{ _pg_target }} -- bash -c 'PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U {{ _pg_user }} -d {{ _pg_db }} -c "CREATE EXTENSION IF NOT EXISTS vector"' 2>&1)
    RC=$?
    echo "rc=$RC output=$OUTPUT"
    exit $RC
  register: _ai_pgvector_ext
  changed_when: false
  ignore_errors: true

- name: Record pgvector extension
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'pgvector extension available',
        'status': 'OK' if (_ai_pgvector_ext.rc == 0) else 'FAIL',
        'evidence': 'vector extension ready' if (_ai_pgvector_ext.rc == 0) else (_ai_pgvector_ext.stdout | default('extension create failed') | truncate(100)),
        'hint': 'pgvector extension missing — check PostgreSQL image includes pgvector'
      }] }}

- name: Check Langfuse UI endpoint
  ansible.builtin.uri:
    url: "http://genai-gateway-trace-web.genai-gateway.svc.cluster.local:3000"
    method: GET
    return_content: false
    timeout: 15
    status_code: [200, 302]
  register: _ai_langfuse
  ignore_errors: true
  delegate_to: localhost

- name: Record Langfuse health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'Langfuse UI endpoint',
        'status': 'OK' if (_ai_langfuse.status | default(0) in [200, 302]) else 'FAIL',
        'evidence': 'HTTP ' + (_ai_langfuse.status | default(0) | string),
        'hint': 'Check: kubectl get pods -n genai-gateway -l app=langfuse'
      }] }}

- name: Discover Grafana deployment
  ansible.builtin.shell: |
    # Find the grafana deployment — name varies (grafana, observability-grafana, etc.)
    NS=""
    DEPLOY=""
    for N in observability monitoring; do
      FOUND=$(kubectl get deploy -n "$N" -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      if [ -n "$FOUND" ]; then
        NS="$N"
        DEPLOY="$FOUND"
        break
      fi
    done
    echo "ns=$NS deploy=$DEPLOY"
  register: _grafana_discovery
  changed_when: false
  ignore_errors: true
  when: deploy_observability in ['on', 'yes']

- name: Parse Grafana discovery
  ansible.builtin.set_fact:
    _grafana_ns: "{{ (_grafana_discovery.stdout | default('') | regex_search('ns=(\\S+)', '\\1') | default(['observability'], true))[0] }}"
    _grafana_deploy: "{{ (_grafana_discovery.stdout | default('') | regex_search('deploy=(\\S+)', '\\1') | default([''], true))[0] }}"
  when: deploy_observability in ['on', 'yes']

- name: Check Grafana health
  ansible.builtin.shell: |
    NS="{{ _grafana_ns }}"
    DEPLOY="{{ _grafana_deploy }}"
    if [ -n "$DEPLOY" ]; then
      kubectl exec -n "$NS" "deploy/$DEPLOY" -- curl -sf http://localhost:3000/api/health 2>/dev/null || \
      curl -sf "http://${DEPLOY}.${NS}.svc.cluster.local:3000/api/health" 2>/dev/null || echo "UNREACHABLE"
    else
      echo "UNREACHABLE (no grafana deployment found)"
    fi
  register: _ai_grafana
  changed_when: false
  ignore_errors: true
  when: deploy_observability in ['on', 'yes']

- name: Record Grafana health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'Grafana /api/health',
        'status': 'OK' if (_ai_grafana.rc | default(1) == 0 and 'UNREACHABLE' not in (_ai_grafana.stdout | default(''))) else 'FAIL',
        'evidence': _ai_grafana.stdout | default('unreachable') | truncate(80),
        'hint': 'Check: kubectl get pods -n ' + (_grafana_ns | default('observability')) + ' -l app.kubernetes.io/name=grafana'
      }] }}
  when: deploy_observability in ['on', 'yes']

- name: Check at least one vLLM pod Running
  ansible.builtin.shell: |
    kubectl get pods --all-namespaces -l app.kubernetes.io/name=vllm -o jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}' 2>/dev/null | grep -c Running || echo "0"
  register: _ai_vllm
  changed_when: false
  ignore_errors: true

- name: Record vLLM pod status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'ai-stack',
        'check': 'vLLM pod(s) Running' + (' — model: ' + configured_models if configured_models | default('') | length > 0 else ''),
        'status': 'OK' if (_ai_vllm.stdout | default('0') | trim | int > 0) else 'PENDING',
        'evidence': (_ai_vllm.stdout | default('0') | trim) + ' vLLM pod(s) running' + (' [configured: ' + configured_models + ']' if configured_models | default('') | length > 0 else ''),
        'hint': 'vLLM pods may still be loading models — check: kubectl get pods -A -l app.kubernetes.io/name=vllm'
      }] }}

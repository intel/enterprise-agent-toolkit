# layer-proxy.yml — Validates proxy configuration consistency and function

---
- name: Detect if proxy is configured
  ansible.builtin.shell: |
    [ -n "${http_proxy:-}" ] || [ -n "${https_proxy:-}" ] && echo "yes" || echo "no"
  register: _proxy_check
  changed_when: false

- name: Run proxy checks
  ansible.builtin.shell: |
    HN=$(hostname -s)
    PROXY="${http_proxy:-${https_proxy:-}}"

    # Proxy reachability
    proxy_status="OK"; proxy_evidence="no proxy configured"
    if [ -n "$PROXY" ]; then
      PROXY_HOST=$(echo "$PROXY" | sed -e 's|^https\?://||' -e 's|/$||')
      if timeout 10 bash -c "echo -e 'CONNECT google.com:443 HTTP/1.1\r\nHost: google.com\r\n\r\n' | nc -w 5 ${PROXY_HOST%:*} ${PROXY_HOST#*:}" >/dev/null 2>&1; then
        proxy_status="OK"; proxy_evidence="proxy reachable at $PROXY_HOST"
      else
        proxy_status="FAIL"; proxy_evidence="proxy unreachable at $PROXY_HOST"
      fi
    fi

    # Containerd proxy consistency
    ctd_status="OK"; ctd_evidence="no proxy configured"
    if [ -n "$PROXY" ]; then
      CTD_PROXY=""
      for f in /etc/systemd/system/containerd.service.d/http-proxy.conf /etc/systemd/system/containerd.service.d/proxy.conf; do
        [ -f "$f" ] && CTD_PROXY=$(grep -i 'https_proxy\|http_proxy' "$f" 2>/dev/null | head -1) && break
      done
      ENV_PROXY=$(grep -i 'https_proxy\|http_proxy' /etc/environment 2>/dev/null | head -1)
      if [ -z "$CTD_PROXY" ] && [ -z "$ENV_PROXY" ]; then
        ctd_evidence="no proxy in containerd or env"
      elif echo "$CTD_PROXY" | grep -qi "$(echo "$ENV_PROXY" | cut -d= -f2 2>/dev/null)"; then
        ctd_evidence="containerd matches /etc/environment"
      else
        ctd_status="FAIL"; ctd_evidence="mismatch: containerd vs /etc/environment"
      fi
    fi

    # Image pull test
    pull_status="OK"; pull_evidence="busybox:1.36 pulled successfully"
    if ! ctr image pull --plain-http=false docker.io/library/busybox:1.36 >/dev/null 2>&1; then
      pull_status="FAIL"; pull_evidence="image pull failed"
    fi

    python3 -c "
    import json
    results = [
        {'layer':'proxy','check':'Proxy reachable from $HN','status':'$proxy_status',
         'evidence':'$proxy_evidence','hint':'Verify proxy URL and reachability'},
        {'layer':'proxy','check':'Containerd proxy config on $HN','status':'$ctd_status',
         'evidence':'$ctd_evidence','hint':'Sync containerd proxy with /etc/environment'},
        {'layer':'proxy','check':'Container image pull from $HN','status':'$pull_status',
         'evidence':'$pull_evidence','hint':'Check containerd proxy and registry mirrors'},
    ]
    print(json.dumps(results))
    "
  args:
    executable: /bin/bash
  register: _proxy_results
  changed_when: false
  ignore_errors: true
  when: _proxy_check.stdout | default('no') | trim == 'yes'

- name: Append proxy results to host results file
  ansible.builtin.shell: "echo '{{ _proxy_results.stdout | default(\"[]\") }}' >> /tmp/validate-stack-host-results.jsonl"
  changed_when: false
  when: _proxy_check.stdout | default('no') | trim == 'yes'

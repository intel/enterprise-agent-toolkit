# layer-storage.yml — Validates Ceph storage health (gated on deploy_ceph=on)

---
- name: Check ceph health
  ansible.builtin.shell: |
    kubectl exec -n rook-ceph deploy/rook-ceph-tools -- ceph health 2>/dev/null || \
    kubectl exec -n rook-ceph $(kubectl get pods -n rook-ceph -l app=rook-ceph-tools -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) -- ceph health 2>/dev/null || \
    echo "HEALTH_ERR cannot reach ceph tools"
  register: _storage_health
  changed_when: false
  ignore_errors: true

- name: Record ceph health
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'storage',
        'check': 'Ceph cluster health',
        'status': 'OK' if ('HEALTH_OK' in (_storage_health.stdout | default(''))) else ('PENDING' if 'HEALTH_WARN' in (_storage_health.stdout | default('')) else 'FAIL'),
        'evidence': _storage_health.stdout | default('unreachable') | truncate(100),
        'hint': 'Check: kubectl exec -n rook-ceph deploy/rook-ceph-tools -- ceph status'
      }] }}

- name: Check all OSDs up and in
  ansible.builtin.shell: |
    kubectl exec -n rook-ceph deploy/rook-ceph-tools -- ceph osd stat 2>/dev/null || echo "0 osds: 0 up, 0 in"
  register: _storage_osd
  changed_when: false
  ignore_errors: true

- name: Record OSD status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'storage',
        'check': 'All OSDs up and in',
        'status': 'OK' if (_storage_osd.rc == 0 and 'up' in (_storage_osd.stdout | default(''))) else 'FAIL',
        'evidence': _storage_osd.stdout | default('no OSD info') | truncate(100),
        'hint': 'Check: ceph osd tree — look for down/out OSDs; check disk health on affected nodes'
      }] }}

- name: Check storage classes exist
  ansible.builtin.shell: |
    kubectl get sc -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null
  register: _storage_sc
  changed_when: false
  ignore_errors: true

- name: Record storage classes
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'storage',
        'check': 'Ceph storage classes exist',
        'status': 'OK' if ('ceph-block' in (_storage_sc.stdout | default('')) or 'rook-ceph-block' in (_storage_sc.stdout | default(''))) else 'FAIL',
        'evidence': _storage_sc.stdout_lines | default([]) | select('match', '.*ceph.*') | list | join(', ') | default('none found'),
        'hint': 'Storage classes missing — check Rook-Ceph operator: kubectl get pods -n rook-ceph'
      }] }}

- name: Create test PVC for storage validation
  ansible.builtin.shell: |
    # Clean up any previous test artifacts
    kubectl delete pvc validate-stack-test-pvc -n default --ignore-not-found=true 2>/dev/null
    kubectl delete pod validate-stack-test-pod -n default --ignore-not-found=true --wait=false 2>/dev/null
    sleep 2

    # Determine storage class name
    SC=$(kubectl get sc -o jsonpath='{.items[?(@.metadata.name=="ceph-block")].metadata.name}' 2>/dev/null)
    [ -z "$SC" ] && SC=$(kubectl get sc -o jsonpath='{.items[?(@.metadata.name=="rook-ceph-block")].metadata.name}' 2>/dev/null)
    [ -z "$SC" ] && SC=$(kubectl get sc -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

    # Create PVC
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: validate-stack-test-pvc
      namespace: default
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: "$SC"
      resources:
        requests:
          storage: 10Mi
    EOF

    # Wait for PVC to bind
    kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/validate-stack-test-pvc -n default --timeout=60s 2>&1
  register: _storage_pvc_create
  changed_when: false
  ignore_errors: true

- name: Run PVC write/read/verify test
  ansible.builtin.shell: |
    cat <<'EOF' | kubectl apply -f -
    apiVersion: v1
    kind: Pod
    metadata:
      name: validate-stack-test-pod
      namespace: default
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          dd if=/dev/urandom of=/data/testfile bs=1024 count=1024
          WRITTEN_MD5=$(md5sum /data/testfile | awk '{print $1}')
          sync
          READ_MD5=$(md5sum /data/testfile | awk '{print $1}')
          if [ "$WRITTEN_MD5" = "$READ_MD5" ]; then
            echo "PASS:md5=$WRITTEN_MD5"
          else
            echo "FAIL:written=$WRITTEN_MD5,read=$READ_MD5"
          fi
        volumeMounts:
        - name: test-vol
          mountPath: /data
      volumes:
      - name: test-vol
        persistentVolumeClaim:
          claimName: validate-stack-test-pvc
    EOF
    kubectl wait --for=condition=Ready pod/validate-stack-test-pod -n default --timeout=60s 2>/dev/null || true
    sleep 5
    kubectl logs pod/validate-stack-test-pod -n default 2>/dev/null || echo "FAIL:no-logs"
  register: _storage_rw_test
  changed_when: false
  ignore_errors: true

- name: Record storage read/write test
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'storage',
        'check': 'PVC write/read/verify (md5 match)',
        'status': 'OK' if ('PASS:md5=' in (_storage_rw_test.stdout | default(''))) else 'FAIL',
        'evidence': _storage_rw_test.stdout | default('test failed') | truncate(100),
        'hint': 'Storage data path broken — check Ceph health, OSD status, and PVC provisioner'
      }] }}

- name: Clean up storage test artifacts
  ansible.builtin.shell: |
    kubectl delete pod validate-stack-test-pod -n default --ignore-not-found=true --wait=false 2>/dev/null
    kubectl delete pvc validate-stack-test-pvc -n default --ignore-not-found=true 2>/dev/null
  changed_when: false
  ignore_errors: true

# layer-gpu.yml — Validates GPU readiness (gated on rack_scale_gpu_vendor)

---
- name: Check GPU operator pods Running
  ansible.builtin.shell: |
    kubectl get pods -n gpu-operator -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null
  register: _gpu_operator_pods
  changed_when: false
  ignore_errors: true

- name: Record GPU operator status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'gpu',
        'check': 'GPU operator pods Running',
        'status': 'OK' if (_gpu_operator_pods.rc == 0 and 'Running' in (_gpu_operator_pods.stdout | default('')) and 'Failed' not in (_gpu_operator_pods.stdout | default(''))) else 'FAIL',
        'evidence': (_gpu_operator_pods.stdout_lines | default([]) | length | string) + ' pods in gpu-operator namespace',
        'hint': 'Check: kubectl get pods -n gpu-operator — look for CrashLoopBackOff or missing pods'
      }] }}

- name: Check GPU node labels
  ansible.builtin.shell: |
    kubectl get nodes -l "accelerator={{ rack_scale_gpu_model | default('') }}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | wc -l
  register: _gpu_node_labels
  changed_when: false
  ignore_errors: true

- name: Record GPU node labels
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'gpu',
        'check': 'GPU node labels present',
        'status': 'OK' if ((_gpu_node_labels.stdout | default('0') | trim | int) > 0) else 'FAIL',
        'evidence': (_gpu_node_labels.stdout | default('0') | trim) + ' nodes labeled accelerator=' + (rack_scale_gpu_model | default('?')),
        'hint': 'GPU labels missing — check: kubectl get nodes --show-labels | grep accelerator; re-run label-nodes.yml'
      }] }}

- name: Check DCGM exporter pods running
  ansible.builtin.shell: |
    kubectl get pods -n gpu-operator -l app=nvidia-dcgm-exporter -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}' 2>/dev/null
  register: _gpu_dcgm
  changed_when: false
  ignore_errors: true

- name: Record DCGM exporter status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'gpu',
        'check': 'DCGM exporter pods running',
        'status': 'OK' if (_gpu_dcgm.rc == 0 and 'Running' in (_gpu_dcgm.stdout | default(''))) else 'FAIL',
        'evidence': (_gpu_dcgm.stdout_lines | default([]) | select('match', '.*Running.*') | list | length | string) + ' DCGM exporter pods',
        'hint': 'Check: kubectl get pods -n gpu-operator -l app=nvidia-dcgm-exporter'
      }] }}

- name: Check device plugin advertising GPUs
  ansible.builtin.shell: |
    kubectl get nodes -l "accelerator={{ rack_scale_gpu_model | default('') }}" \
      -o jsonpath='{range .items[*]}{.metadata.name}: {.status.allocatable.nvidia\.com/gpu}{"\n"}{end}' 2>/dev/null
  register: _gpu_device_plugin
  changed_when: false
  ignore_errors: true

- name: Record device plugin GPU count
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'gpu',
        'check': 'Device plugin advertising GPUs',
        'status': 'OK' if (_gpu_device_plugin.rc == 0 and _gpu_device_plugin.stdout | trim | length > 0 and ': 0' not in _gpu_device_plugin.stdout and ': ' in _gpu_device_plugin.stdout) else 'FAIL',
        'evidence': _gpu_device_plugin.stdout | default('no GPUs advertised') | truncate(150),
        'hint': 'Device plugin not advertising GPUs — check GPU operator driver/toolkit pods: kubectl logs -n gpu-operator <driver-pod>'
      }] }}

- name: Run nvidia-smi test job
  ansible.builtin.shell: |
    # Clean up previous test
    kubectl delete pod validate-stack-gpu-test --ignore-not-found=true --wait=false 2>/dev/null
    sleep 2

    kubectl run validate-stack-gpu-test \
      --image=nvidia/cuda:12.4.0-base-ubuntu22.04 \
      --restart=Never \
      --overrides='{
        "spec": {
          "containers": [{
            "name": "validate-stack-gpu-test",
            "image": "nvidia/cuda:12.4.0-base-ubuntu22.04",
            "command": ["nvidia-smi"],
            "resources": {"limits": {"nvidia.com/gpu": "1"}}
          }],
          "restartPolicy": "Never"
        }
      }' 2>/dev/null

    # Wait for completion
    kubectl wait --for=condition=Ready pod/validate-stack-gpu-test --timeout=120s 2>/dev/null || true
    sleep 5
    kubectl logs pod/validate-stack-gpu-test 2>/dev/null
  register: _gpu_smi_test
  changed_when: false
  ignore_errors: true

- name: Record nvidia-smi test
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'gpu',
        'check': 'nvidia-smi 1-GPU job',
        'status': 'OK' if ('Driver Version' in (_gpu_smi_test.stdout | default('')) or 'NVIDIA-SMI' in (_gpu_smi_test.stdout | default(''))) else 'FAIL',
        'evidence': _gpu_smi_test.stdout_lines | default([]) | select('match', '.*Driver Version.*|.*NVIDIA-SMI.*') | first | default('nvidia-smi failed') | truncate(150),
        'hint': 'GPU scheduling broken — check: kubectl describe pod validate-stack-gpu-test for scheduling errors'
      }] }}

- name: Clean up GPU test pod
  ansible.builtin.command:
    cmd: kubectl delete pod validate-stack-gpu-test --ignore-not-found=true --wait=false
  changed_when: false
  ignore_errors: true

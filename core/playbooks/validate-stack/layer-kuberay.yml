# layer-kuberay.yml — Validates KubeRay operator and cluster (gated on deploy_kuberay)

---
- name: Check KubeRay operator pod Running
  ansible.builtin.shell: |
    kubectl get pods -n ray-system -l app.kubernetes.io/name=kuberay-operator -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound"
  register: _kuberay_operator
  changed_when: false
  ignore_errors: true

- name: Record KubeRay operator status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kuberay',
        'check': 'KubeRay operator Running',
        'status': 'OK' if (_kuberay_operator.stdout | default('') | trim == 'Running') else 'FAIL',
        'evidence': 'operator phase: ' + (_kuberay_operator.stdout | default('unknown') | trim),
        'hint': 'Check: kubectl get pods -n ray-system — KubeRay operator may be failing to start'
      }] }}

- name: Check Ray head pod Running
  ansible.builtin.shell: |
    kubectl get pods -n ray-system -l ray.io/node-type=head -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "NotFound"
  register: _kuberay_head
  changed_when: false
  ignore_errors: true

- name: Record Ray head status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kuberay',
        'check': 'Ray head pod Running',
        'status': 'OK' if (_kuberay_head.stdout | default('') | trim == 'Running') else 'FAIL',
        'evidence': 'head phase: ' + (_kuberay_head.stdout | default('unknown') | trim),
        'hint': 'Check: kubectl get pods -n ray-system -l ray.io/node-type=head'
      }] }}

- name: Check Ray worker pods connected
  ansible.builtin.shell: |
    EXPECTED=$(kubectl get raycluster -n ray-system -o jsonpath='{.items[0].spec.workerGroupSpecs[0].replicas}' 2>/dev/null || echo "0")
    ACTUAL=$(kubectl get pods -n ray-system -l ray.io/node-type=worker --field-selector=status.phase=Running -o name 2>/dev/null | wc -l)
    echo "expected=$EXPECTED actual=$ACTUAL"
  register: _kuberay_workers
  changed_when: false
  ignore_errors: true

- name: Record Ray worker status
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kuberay',
        'check': 'Ray workers connected',
        'status': 'OK' if (_kuberay_workers.stdout is defined and _kuberay_workers.stdout | regex_search('expected=(\d+)', '\1') | first | default('0') == _kuberay_workers.stdout | regex_search('actual=(\d+)', '\1') | first | default('-1')) else 'FAIL',
        'evidence': _kuberay_workers.stdout | default('unknown'),
        'hint': 'Ray worker count mismatch — check: kubectl get pods -n ray-system -l ray.io/node-type=worker'
      }] }}

- name: Check Ray dashboard responds
  ansible.builtin.uri:
    url: "http://ray-cluster-head-svc.ray-system.svc.cluster.local:8265"
    method: GET
    timeout: 10
    status_code: [200, 302]
  register: _kuberay_dashboard
  ignore_errors: true
  delegate_to: localhost

- name: Record Ray dashboard
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kuberay',
        'check': 'Ray dashboard endpoint',
        'status': 'OK' if (_kuberay_dashboard.status | default(0) in [200, 302]) else 'FAIL',
        'evidence': 'HTTP ' + (_kuberay_dashboard.status | default(0) | string),
        'hint': 'Ray dashboard not responding — check Ray head pod logs: kubectl logs -n ray-system -l ray.io/node-type=head'
      }] }}

- name: Submit trivial Ray task
  ansible.builtin.shell: |
    kubectl exec -n ray-system $(kubectl get pods -n ray-system -l ray.io/node-type=head -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) -- \
      python3 -c "import ray; ray.init(); print(ray.get(ray.remote(lambda: 'VALIDATE_OK').remote()))" 2>&1 | tail -1
  register: _kuberay_task
  changed_when: false
  ignore_errors: true

- name: Record Ray task execution
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results + [{
        'layer': 'kuberay',
        'check': 'Ray remote task execution',
        'status': 'OK' if ('VALIDATE_OK' in (_kuberay_task.stdout | default(''))) else 'FAIL',
        'evidence': _kuberay_task.stdout | default('task failed') | truncate(80),
        'hint': 'Ray task execution failed — check Ray head connectivity and worker availability'
      }] }}

---
- name: Label Kubernetes Nodes
  hosts: "{{ inference_delegate | default('kube_control_plane') }}"
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env | default(env_proxy | default({})) }}"
  vars_files:
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_common.yml"
    - "{{ lookup('env', 'PWD') }}/config/vars/inference_delegate.yml"
  roles:
    - role: inference-tools
    - role: kubernetes-precheck
  tasks:
    - name: Get control plane node hostnames
      set_fact:
        control_plane_nodes: "{{ groups['kube_control_plane'] | default([]) }}"
      run_once: true

    - name: Get worker node hostnames
      set_fact:
        worker_nodes: "{{ groups['kube_node'] | default([]) }}"
      run_once: true

    - name: Display control plane nodes
      debug:
        msg: "Control plane nodes: {{ control_plane_nodes }}"
      run_once: true

    - name: Display worker nodes
      debug:
        msg: "Worker nodes: {{ worker_nodes }}"
      run_once: true

    - name: Get actual node names from Kubernetes cluster
      kubernetes.core.k8s_info:
        kind: Node
      register: k8s_nodes
      run_once: true

    - name: Label control plane nodes with ei-infra-eligible=true
      kubernetes.core.k8s:
        state: patched
        kind: Node
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            labels:
              ei-infra-eligible: "true"
      loop: "{{ k8s_nodes.resources }}"
      when: 
        - item.metadata.name in control_plane_nodes or item.metadata.labels['node-role.kubernetes.io/control-plane'] is defined
      run_once: true

    - name: Label worker/inference nodes with ei-inference-eligible=true
      kubernetes.core.k8s:
        state: patched
        kind: Node
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            labels:
              ei-inference-eligible: "true"
      loop: "{{ k8s_nodes.resources }}"
      when: >
        item.metadata.name in worker_nodes or
        (item.metadata.labels['kubernetes.io/hostname'] | default('')) in worker_nodes or
        (k8s_nodes.resources | length == 1 and worker_nodes | length > 0)
      run_once: true

    - name: Apply silicon labels from rack-profile hostvars
      kubernetes.core.k8s:
        state: patched
        kind: Node
        name: "{{ item }}"
        definition:
          metadata:
            labels: >-
              {{
                ({
                  'cpu-gen': hostvars[item]['node_family'] | regex_replace('^cpu-', '')
                } if hostvars[item]['node_family'] is defined else {})
                | combine(
                  {'cpu-sku': hostvars[item]['node_sku']}
                  if hostvars[item]['node_sku'] is defined else {}
                )
                | combine(
                  {
                    'accelerator':    hostvars[item]['node_gpu_model'],
                    'gpu-vendor':     hostvars[item]['node_gpu_vendor'],
                    'gpu-form':       hostvars[item]['node_gpu_form'] | default(''),
                  }
                  if hostvars[item]['node_accelerator'] is defined else {}
                )
              }}
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item]['node_family'] is defined or hostvars[item]['node_accelerator'] is defined
      run_once: true

    - name: Verify node labels
      kubernetes.core.k8s_info:
        kind: Node
      register: labeled_nodes
      run_once: true

    - name: Display labeled nodes
      debug:
        msg: |
          Node: {{ item.metadata.name }}
          Labels: {{ item.metadata.labels | dict2items | selectattr('key', 'match', '^ei-') | list | items2dict(key_name='key', value_name='value') }}
      loop: "{{ labeled_nodes.resources }}"
      run_once: true

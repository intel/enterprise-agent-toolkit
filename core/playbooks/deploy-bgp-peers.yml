#
# deploy-bgp-peers.yml — Apply per-node Calico BGPPeer CRDs for secondary uplinks.
#
# Generated by rack-profile-parser.sh into core/inventory/metadata/bgp-peers/.
# One CRD per node per secondary fabric NIC. Uses spec.sourceAddress so bird
# dials the secondary leaf from the correct NIC IP, avoiding session collision
# with the primary leaf's connection (which uses the node's ipv4Address).
#
# Safe to re-run: kubectl apply is idempotent.
# Add node: parser generates the new CRD file; run this playbook to apply it.
# Remove node: delete the CRD manually or via deploy-bgp-peers-cleanup.yml.
---
- name: Apply per-node BGPPeer CRDs for secondary fabric uplinks
  hosts: "{{ target | default('kube_control_plane') }}"
  run_once: true
  gather_facts: false
  vars:
    bgp_peers_dir: "{{ playbook_dir | dirname }}/inventory/metadata/bgp-peers"
  tasks:
    - name: Find generated BGPPeer CRD files
      find:
        paths: "{{ bgp_peers_dir }}"
        patterns: "*.yaml"
      register: peer_files
      delegate_to: localhost

    - name: Apply BGPPeer CRDs
      command: kubectl apply -f {{ item.path }}
      loop: "{{ peer_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      delegate_to: localhost
      when: peer_files.files | length > 0

    - name: No BGPPeer CRDs to apply
      debug:
        msg: "No per-node BGPPeer CRD files found in {{ bgp_peers_dir }} — skipping (single-NIC cluster or vxlan mode)"
      when: peer_files.files | length == 0

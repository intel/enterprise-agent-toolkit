#
# deploy-netplan.yml
#
# Pushes the per-node fabric netplan configuration generated by
# rack-profile-parser.sh to each node, then applies it.
#
# Invoked automatically by fresh-install.sh when rack_scale_mode=on.
# Must NOT be run for standard (non-rack-scale) deployments.
#
# Generated files live in:  core/inventory/netplan/<node_hostname>.yaml
# Deployed to each node as: /etc/netplan/99-fabric.yaml
#
# Notes:
#   - master1 uses ansible_connection: local — copy runs locally, no SSH.
#   - netplan apply is additive (adds fabric NIC, does not touch mgmt NIC).
#     SSH over the 172.26.x.x management NIC is unaffected.
#
# This playbook CONFIGURES addresses only — it does NOT verify reachability.
# That is verify-fabric.yml, and it is deliberately a separate playbook because
# of ordering. On a star topology, spoke-to-spoke traffic only flows once the
# hub is forwarding (deploy-ecmp-sysctl.yml: ip_forward plus the FORWARD-chain
# ACCEPT rules). Verifying inside this playbook checked the fabric BEFORE the
# hub was configured, so a correctly-cabled star failed here every time the
# hub's FORWARD chain had been flushed — which is exactly what reset.yml does.
#
# Callers must run, in this order:
#   1. deploy-netplan.yml      — fabric addresses on every node
#   2. deploy-ecmp-sysctl.yml  — star hub forwarding  (star topology only)
#   3. verify-fabric.yml       — reachability, fatal on quorum members

---
- name: Deploy fabric netplan configuration to all nodes
  hosts: all
  become: true
  gather_facts: false
  vars:
    # Can be overridden with -e netplan_src_dir=<path>
    netplan_src_dir: "{{ playbook_dir | dirname }}/inventory/netplan"
    netplan_dest: /etc/netplan/99-fabric.yaml

  tasks:
    - name: Check that netplan source file exists for this node
      delegate_to: localhost
      become: false
      stat:
        path: "{{ netplan_src_dir }}/{{ node_hostname }}.yaml"
      register: _netplan_src

    - name: Fail if netplan file is missing for this node
      fail:
        msg: >
          No netplan file found at {{ netplan_src_dir }}/{{ node_hostname }}.yaml.
          Re-run rack-profile-parser.sh to regenerate inventory files.
      when: not _netplan_src.stat.exists

    - name: Copy fabric netplan config to node
      copy:
        src: "{{ netplan_src_dir }}/{{ node_hostname }}.yaml"
        dest: "{{ netplan_dest }}"
        owner: root
        group: root
        mode: '0600'
      register: _netplan_copy

    - name: Remove old 60-fabric.yaml if present (superseded by 99-fabric.yaml)
      file:
        path: /etc/netplan/60-fabric.yaml
        state: absent

    - name: Apply netplan to activate fabric interfaces
      command: netplan apply
      when: _netplan_copy.changed
      register: _netplan_apply
      changed_when: true

    - name: Pause briefly for interface to come up after netplan apply
      pause:
        seconds: 3
      when: _netplan_copy.changed

    # Local confirmation only: the address is on the NIC on this node. This is
    # what netplan is responsible for, and unlike a cross-fabric probe it does
    # not depend on the hub forwarding yet. End-to-end reachability is checked
    # by verify-fabric.yml, after deploy-ecmp-sysctl.yml has run.
    - name: Confirm fabric address is present on this node
      command: ip -o addr show
      register: _addr_show
      changed_when: false

    - name: Fail if the fabric address never came up on the NIC
      fail:
        msg: >
          Netplan was applied on {{ inventory_hostname }} ({{ node_hostname }}) but
          {{ access_ip }} is not present on any interface. This is a node-local
          failure, not a fabric one — the config was written to {{ netplan_dest }}
          and did not take effect. Check:
            - 'netplan apply' output and 'journalctl -u systemd-networkd'
            - that the NIC named in rack-profile.yaml exists on this node
              (ip -br link show) — a renamed or absent NIC is the usual cause
            - that no other file in /etc/netplan claims the same NIC
      # Matched with the trailing '/' of the prefix so that a shorter address is
      # not satisfied by a longer one that merely starts with it — a bare
      # substring test would accept 10.201.1.13/30 as proof of 10.201.1.1.
      when: (access_ip ~ '/') not in (_addr_show.stdout | default(''))

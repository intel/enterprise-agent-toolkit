    # ── GPU models ──────────────────────────────────────────────────────────────
    # All GPU model blocks are gated on gpu_playbook == 'true' so that a
    # cpu-only run never accidentally touches them.

    - name: Check if GPU B300 Llama-3.1-70B is installed
      ansible.builtin.command:
        cmd: "helm list --filter vllm-llama-70b-gpu --short"
      register: helm_release_installed
      ignore_errors: true
      run_once: true
      tags: uninstall-gpu-nvidia-b300-llama-70b

    - name: Uninstall GPU B300 Llama-3.1-70B
      ansible.builtin.command:
        cmd: "helm uninstall vllm-llama-70b-gpu"
      run_once: true
      tags: uninstall-gpu-nvidia-b300-llama-70b
      when:
        - model_name_list is defined
        - "'gpu-nvidia-b300-llama-70b' in (model_name_list | regex_replace(',', ' ') | split())"
        - uninstall_true == 'true'
        - helm_release_installed.stdout != ""

    - name: Deploy GPU B300 Llama-3.1-70B model
      block:
        - name: Deploy GPU B300 LLM model Llama-3.1-70B Installation
          ansible.builtin.command: >-
            helm upgrade --install vllm-llama-70b-gpu "{{ remote_helm_charts_base }}/vllm"
            --values "{{ gpu_values_file }}"
            --set LLM_MODEL_ID="meta-llama/Llama-3.1-70B-Instruct"
            --set global.monitoring="{{ vllm_metrics_enabled }}"
            --set svcmonitor.enabled="{{ vllm_metrics_enabled }}"
            --set global.HUGGINGFACEHUB_API_TOKEN={{ hugging_face_token }}
            {% if apisix_enabled | default(false) %}
              --set apisix.enabled={{ apisix_enabled }}
              --set platform={{ kubernetes_platform }}
            {% endif %}
            {% if kubernetes_platform == 'openshift' %}
              --set route.enabled=true
              --set route.host={{ secret_name }}
              --set route.tls.termination=edge
              --set route.tls.insecureEdgeTerminationPolicy=Redirect
              --set ingress.enabled=false
            {% elif ingress_enabled | default(false) %}
              --set ingress.enabled={{ ingress_enabled }}
              --set ingress.host={{ secret_name }}
              --set ingress.secretname={{ secret_name }}
              --set route.enabled=false
              {% if kubernetes_platform == "eks" %}
              --set aws_certificate_arn={{ aws_certificate_arn | default('') }}
              {% endif %}
            {% endif %}
            {% if deploy_keycloak | default('no') == 'yes' and apisix_enabled | default(false) %}
              --set oidc.client_id={{ keycloak_client_id | default('') }}
              --set oidc.client_secret={{ client_secret | default('') }}
            {% endif %}
            {{ helm_proxy_args | default('') }}
          register: helm_upgrade_gpu_llama_70b
          failed_when: helm_upgrade_gpu_llama_70b.rc != 0
        - name: Register GPU B300 Llama-3.1-70B model in LiteLLM
          import_tasks: register-model-genai-gateway.yml
          vars:
            reg_model_name: "meta-llama/Llama-3.1-70B-Instruct"
            reg_litellm_model: "openai/meta-llama/Llama-3.1-70B-Instruct"
            reg_custom_llm_provider: "openai"
            reg_api_base: "http://vllm-llama-70b-gpu-service.default/v1"
            reg_input_cost_per_token: 0
            reg_output_cost_per_token: 0
          tags:
            - install-gpu-nvidia-b300-llama-70b
            - install-genai-gateway
          run_once: true
          when:
            - "'install-gpu-nvidia-b300-llama-70b' in ansible_run_tags"
            - "'install-genai-gateway' in ansible_run_tags"
      run_once: true
      tags: install-gpu-nvidia-b300-llama-70b
      when:
        - gpu_playbook == 'true'
        - install_true == 'true'
        - model_name_list is defined
        - "'gpu-nvidia-b300-llama-70b' in (model_name_list | regex_replace(',', ' ') | split())"

    # ── Hugging Face (operator-supplied) model ──────────────────────────────────
    # Driven by menu options 4 and 5 (lib/models/install-model-hf.sh and
    # uninstall-model-hf.sh). Unlike the pre-validated models above, the model ID
    # is typed at the prompt and normally has no entry in xeon-values.yaml
    # modelConfigs, so sizing falls back to defaultModelConfigs and is clamped
    # against this node's freshly-detected NRI capability (optimal_balloon_config).
    - name: Deploy "{{ huggingface_model_id }}" LLM Model
      block:
        - name: Delete Ingress resource "{{ huggingface_model_id }}" from default namespace
          tags: "install-{{ huggingface_model_deployment_name }}"
          ignore_errors: yes
          kubernetes.core.k8s:
            kind: Ingress
            namespace: default
            name: "{{ hf_release_fullname }}-ingress"
            state: absent
        - name: Delete Ingress resource "{{ huggingface_model_id }}" from auth-apisix namespace
          tags: "install-{{ huggingface_model_deployment_name }}"
          ignore_errors: yes
          kubernetes.core.k8s:
            kind: Ingress
            namespace: auth-apisix
            name: "{{ hf_release_fullname }}-ingress"
            state: absent
        - name: Determine sizing for "{{ huggingface_model_id }}"
          ansible.builtin.include_role:
            name: utils
            tasks_from: get_model_sizing
          vars:
            model_id: "{{ huggingface_model_id }}"
            model_friendly_name: "{{ huggingface_model_id }}"
          when: cpu_playbook == 'true' and balloon_policy_cpu == 'enabled'
        - name: Deploy LLM model "{{ huggingface_model_id }}"
          ansible.builtin.command: >-
            helm upgrade --install {{ huggingface_model_deployment_name }} "{{ remote_helm_charts_base }}/vllm"
            {% if cpu_playbook == 'true' %}
            --values "{{ xeon_values_file }}"
            {% elif gpu_playbook == 'true' %}
            --values "{{ gpu_values_file }}"
            {% endif %}
            --set LLM_MODEL_ID="{{ huggingface_model_id }}"
            --set global.monitoring="{{ vllm_metrics_enabled }}"
            --set svcmonitor.enabled="{{ vllm_metrics_enabled }}"
            --set global.HUGGINGFACEHUB_API_TOKEN={{ hugging_face_token }}
            {% if cpu_playbook == 'true' and balloon_policy_cpu == 'enabled' %}
            {% set _mc = xeon_model_configs.get(huggingface_model_id, xeon_default_model_config) %}
            {% set _tp = _model_effective_tp | int %}
            {% if _model_match_expressions | length > 1 %}
            --set-json 'affinity={{ _model_node_affinity | to_json }}'
            {% endif %}
            --set cpu_balloon_annotation="vllm-balloon-tp{{ _tp }}"
            --set podLabels.name="vllm"
            --set cpu="{{ _mc.optimal_cpu_cores | default((optimal_balloon_config.workload_cpus | int) * _tp) | int }}"
            --set memory="{{ optimal_memory_gb }}Gi"
            --set memoryLimit="{{ optimal_memory_limit_gb | default(256) }}Gi"
            --set tensor_parallel_size={{ _tp }}
            --set pipeline_parallel_size={{ _mc.pipeline_parallel_size | default(1) }}
            {# vLLM only needs the host IPC namespace for the shm segment it
               shares between tensor-parallel ranks. At TP=1 there is nothing to
               share, and an unvalidated model should not be handed host IPC. #}
            {% if _tp | int > 1 %}
            --set hostIPC=true
            {% endif %}
            {% elif gpu_playbook == 'true' and huggingface_tensor_parellel_size not in ['false', '', 'None', None] %}
            --set tensor_parallel_size={{ huggingface_tensor_parellel_size }}
            {% endif %}
            {% if kubernetes_platform == 'openshift' %}
              --set route.enabled=true
              --set route.host={{ secret_name }}
              --set route.tls.termination=edge
              --set route.tls.insecureEdgeTerminationPolicy=Redirect
              --set ingress.enabled=false
            {% else %}
              --set ingress.enabled=true
              --set ingress.host={{ secret_name }}
              --set ingress.secretname={{ secret_name }}
              --set route.enabled=false
              {% if kubernetes_platform == "eks" %}
              --set aws_certificate_arn={{ aws_certificate_arn | default('') }}
              {% endif %}
            {% endif %}
            {{ helm_proxy_args | default('') }}
          register: helm_upgrade_install_model_deployment_hf
          failed_when: helm_upgrade_install_model_deployment_hf.rc != 0
        - name: Register "{{ huggingface_model_id }}" model
          import_tasks: register-model-genai-gateway.yml
          vars:
            reg_model_name: "{{ huggingface_model_id }}"
            reg_litellm_model: "openai/{{ huggingface_model_id }}"
            reg_custom_llm_provider: "openai"
            reg_api_base: "http://{{ hf_release_fullname }}-service.default/v1"
            reg_input_cost_per_token: 0.001
            reg_output_cost_per_token: 0.002
          tags:
            - "install-{{ huggingface_model_deployment_name }}"
            - install-genai-gateway
          run_once: true
          when:
            - "('install-' ~ huggingface_model_deployment_name) in ansible_run_tags"
            - "'install-genai-gateway' in ansible_run_tags"
      run_once: true
      tags: "install-{{ huggingface_model_deployment_name }}"
      when:
        - hugging_face_model_deployment == 'true'
        - install_true == 'true'

    # Anchored --filter so a deployment name that is a prefix of another release
    # (e.g. "coder" vs "coder-v2") cannot make us uninstall the wrong one.
    - name: Check if "{{ hugging_face_model_remove_name }}" Model is deployed
      ansible.builtin.command:
        cmd: "helm list --filter ^{{ hugging_face_model_remove_name }}$ --short"
      register: helm_release_installed_hf
      ignore_errors: true
      run_once: true
      tags: "uninstall-{{ hugging_face_model_remove_name }}"
    - name: Uninstall "{{ hugging_face_model_remove_name }}" Model
      ansible.builtin.command:
        cmd: "helm uninstall {{ hugging_face_model_remove_name }}"
      run_once: true
      tags: "uninstall-{{ hugging_face_model_remove_name }}"
      when:
        - uninstall_true == 'true'
        - hugging_face_model_remove_deployment == 'true'
        - helm_release_installed_hf.stdout != ""

    # ── End Hugging Face model ──────────────────────────────────────────────────

    - name: List of Models to be Installed
      tags: always
      run_once: true
      debug:
        var: model_name_list

    # Select on the chart rather than the release name: pre-validated releases are
    # all named vllm-*, but a Hugging Face deployment name is typed at the prompt
    # and need not contain "vllm", so a name-based grep hides it from option 3.
    #
    # Report each release's LLM_MODEL_ID rather than its release name — the model
    # ID is what an operator recognises and what the GenAI Gateway is keyed on,
    # whereas the release name is an arbitrary label for Hugging Face
    # deployments. Falls back to the release name if a release somehow carries no
    # LLM_MODEL_ID, so nothing installed can be silently omitted from the list.
    - name: List the Installed Inference Models
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          helm list --output json \
            | jq -r '.[] | select(.chart | startswith("vllm-")) | .name' \
            | while read -r _release; do
                _model_id="$(helm get values "$_release" --all --output json \
                  | jq -r '.LLM_MODEL_ID // empty')"
                printf '%s\n' "${_model_id:-$_release}"
              done
      args:
        executable: /bin/bash
      register: inference_models
      changed_when: false
      when: list_model_true == 'true'
    - name: Print Installed Models in Comma Separated Format
      ansible.builtin.debug:
        msg: "Installed Models: {{ inference_models.stdout_lines | join(', ') }}"
      when: inference_models.stdout_lines is defined and inference_models.stdout_lines | length > 0

    - name: Clean up remote dependencies directory
      tags: always
      ansible.builtin.file:
        path: "{{ remote_helm_charts_base }}"
        state: absent
# ---------------------------------------------------------------------------
# Derive a CPU model deployment's tensor-parallel cap from the node's actual
# NUMA/socket topology. The "workload" CPU core count itself is passed
# through unchanged from cpu_topology_config.workload_cpus (the balloon-
# policy-derived, single-NUMA, physical-core budget) -- no ansible-side
# buffer or floor on top of it.
#
# Requires get_optimized_cpu_topology to have run first: cpu_topology_config
# and nri_reserved_cpu_list come from that probe.
#
# Called once per model deployment (via include_role, not import_role, so it
# re-executes fresh every time) rather than once per playbook run, so that a
# second model deployed in the same run sees CPU already claimed by the first.
#
# Exports:
#   optimal_balloon_config  workload_cpus / tensor_parallel_size / etc. Clamp
#                           tensor_parallel_size against the model's own table
#                           value at the call site, then pass the result into
#                           get_optimal_memory as memory_tp_size.
#   already_allocated_cpus  intermediate, cluster-wide CPU requests right now.
# ---------------------------------------------------------------------------
---
- name: Calculate already-allocated CPUs from running pods
  ansible.builtin.shell: |
    kubectl get pods -A -o json 2>/dev/null | python3 -c \
      "import json,sys; data=json.load(sys.stdin); total=sum(int(c.get('resources',{}).get('requests',{}).get('cpu','0').rstrip('m'))/1000 if c.get('resources',{}).get('requests',{}).get('cpu','0').endswith('m') else float(c.get('resources',{}).get('requests',{}).get('cpu','0') or 0) for pod in data.get('items',[]) if (pod.get('status') or {}).get('phase','') in ('Running','Pending') for c in pod.get('spec',{}).get('containers',[])); print(int(total))" \
      || echo 0
  register: already_allocated_cpus_result
  ignore_errors: true
  changed_when: false

- name: Set already_allocated_cpus fact
  ansible.builtin.set_fact:
    already_allocated_cpus: "{{ already_allocated_cpus_result.stdout | default('0') | trim | int }}"

- name: Calculate CPU allocation for model deployment
  ansible.builtin.set_fact:
    calculated_topology:
      total_sockets: "{{ cpu_topology_config.total_sockets | int }}"
      numa_nodes_per_socket: "{{ cpu_topology_config.numa_nodes_per_socket | int }}"
      cpus_per_socket: "{{ cpu_topology_config.cpus_per_socket | int }}"
      is_single_node: "{{ cpu_topology_config.total_sockets == 1 and cpu_topology_config.numa_nodes_per_socket == 1 }}"
      reserved_cpus_percentage: "{{ reserved_cpus_percentage | default(18) | int }}"
      reserved_cpus: >-
        {%- set reserved_cpu_count = nri_reserved_cpu_list.split(',') | length -%}
        {{ reserved_cpu_count }}
      balloon_cpus: >-
        {%- set total_cpus = (cpu_topology_config.cpus_per_socket | int) * (cpu_topology_config.total_sockets | int) -%}
        {%- set reserved_cpu_count = nri_reserved_cpu_list.split(',') | length -%}
        {%- if reserved_cpu_count >= total_cpus -%}{%- set reserved_cpu_count = total_cpus -%}{%- endif -%}
        {{ total_cpus - reserved_cpu_count }}
      # Minimum single-NUMA physical-core budget across every node that was
      # actually probed (per_node_cpu_topology, from get_optimized_cpu_topology
      # looping probe_node_cpu_topology.yaml per node) -- not just the one
      # node get_optimized_cpu_topology happened to sample. On a heterogeneous
      # fleet a model can land on any node its affinity allows, so the fallback
      # must be safe for the smallest of them, the same "derive the cluster
      # default from the smallest per-node value" principle already used for
      # nri_reserved_cpu_list (see compute_reserved_cpus.yaml). Falls back to
      # the single sampled node if the per-node table is empty (e.g. only one
      # optimizer pod was ready when probed).
      workload_cpus: >-
        {%- set per_node_values = (per_node_cpu_topology | default({})).values() | map(attribute='workload_cpus') | list -%}
        {{ (per_node_values | min) if (per_node_values | length > 0) else (cpu_topology_config.workload_cpus | int) }}

- name: Calculate parallelism configuration
  ansible.builtin.set_fact:
    parallelism_config:
      tensor_parallel_size: >-
        {%- set total_numa = (cpu_topology_config.total_sockets | int) * (cpu_topology_config.numa_nodes_per_socket | int) -%}
        {%- if total_numa in [1, 2, 4] -%}
        {{ total_numa }}
        {%- elif total_numa in [3] -%}
        1
        {%- elif total_numa in [6] -%}
        4
        {%- else -%}
        1
        {%- endif -%}
      strategy: >-
        tensor_parallel

- name: Combine topology and parallelism configs
  ansible.builtin.set_fact:
    optimal_balloon_config: "{{ calculated_topology | combine(parallelism_config) }}"

- name: Display detected CPU topology for model deployment
  ansible.builtin.debug:
    msg:
      - "==================================================================="
      - "CPU Topology Detection Results for Model Deployment"
      - "==================================================================="
      - "Target Worker Node: {{ optimal_balloon_config.target_worker_node | default('auto-detected') }}"
      - "Total Sockets: {{ optimal_balloon_config.total_sockets }}"
      - "NUMA Nodes per Socket: {{ optimal_balloon_config.numa_nodes_per_socket }}"
      - "CPUs per Socket: {{ optimal_balloon_config.cpus_per_socket }}"
      - "Is Single Node: {{ optimal_balloon_config.is_single_node }}"
      - "Reserved CPUs Count: {{ optimal_balloon_config.reserved_cpus }} ({{ ((optimal_balloon_config.reserved_cpus | int / optimal_balloon_config.cpus_per_socket | int) * 100) | round(1) }}% actual)"
      - "Already-allocated CPUs (cluster-wide, right now): {{ already_allocated_cpus }}"
      - "Per-node workload_cpus (physical, single-NUMA): {{ (per_node_cpu_topology | default({})).items() | map('list') | list }}"
      - "Workload CPUs (min across all nodes, used as fallback): {{ optimal_balloon_config.workload_cpus }}"
      - "Balloon CPUs: {{ optimal_balloon_config.balloon_cpus }}"
      - "Tensor Parallel Size: {{ optimal_balloon_config.tensor_parallel_size | default(1) }}"
      - "Pipeline Parallel Size: {{ optimal_balloon_config.pipeline_parallel_size | default(1) }}"
      - "Strategy: {{ optimal_balloon_config.strategy }}"
      - "==================================================================="

# Which tensor-parallel tiers the cluster can actually back right now, per
# node (not just the single node topology was sampled from). nri_cpu_balloons
# labels every node with its own nri.intel.com/max-tp ("1"/"2"/"4"/"8"), and
# gen-balloon-types.py generates a cumulative ladder per node (a max-tp=4 node
# also has working tp1/tp2 balloons) -- so a model needing tp-N is safe on any
# node whose max-tp label is >= N. Empty list means nri_cpu_balloons was never
# run against this cluster; callers should fall back to the single-sampled-
# node tensor_parallel_size cap above instead of constraining on this label.
- name: Query current NRI capability labels across all nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: _nri_capability_nodes

- name: Determine distinct NRI tensor-parallel tiers available in this cluster
  ansible.builtin.set_fact:
    nri_available_tp_tiers: "{{ _nri_capability_nodes.resources | json_query('[*].metadata.labels.\"nri.intel.com/max-tp\"') | select('string') | map('int') | unique | sort | list }}"

# Real per-node memory headroom, for closing the same chicken-and-egg gap on
# memory that the tiers above close for tensor-parallelism: a model's memory
# limit should never exceed what a node it's actually allowed to land on can
# safely give it. status.allocatable.memory is always Ki-suffixed (kubelet
# convention). Pods without spec.nodeName (unscheduled Pending) are skipped --
# they aren't claiming headroom on any specific node yet.
- name: Calculate already-allocated memory per node from running pods
  ansible.builtin.shell: |
    kubectl get pods -A -o json 2>/dev/null | python3 - <<'PYEOF' || echo '{}'
    import json, sys

    data = json.load(sys.stdin)


    def mem_bytes(s):
        s = s or "0"
        for suf, mul in (("Ki", 1024), ("Mi", 1024**2), ("Gi", 1024**3), ("Ti", 1024**4)):
            if s.endswith(suf):
                return int(s[:-len(suf)]) * mul
        return int(s) if s else 0


    per_node = {}
    for pod in data.get("items", []):
        node = pod.get("spec", {}).get("nodeName")
        if not node or (pod.get("status") or {}).get("phase", "") not in ("Running", "Pending"):
            continue
        for c in pod.get("spec", {}).get("containers", []):
            req = c.get("resources", {}).get("requests", {}).get("memory")
            per_node[node] = per_node.get(node, 0) + mem_bytes(req)

    print(json.dumps(per_node))
    PYEOF
  register: _already_allocated_memory_per_node_result
  ignore_errors: true
  changed_when: false

- name: Set already-allocated memory per node fact (bytes)
  ansible.builtin.set_fact:
    _already_allocated_memory_per_node: "{{ _already_allocated_memory_per_node_result.stdout | default('{}') | trim | from_json }}"

- name: Initialize per-node NRI capability table
  ansible.builtin.set_fact:
    nri_node_capability: []

- name: Populate per-node NRI capability + memory headroom table
  ansible.builtin.set_fact:
    nri_node_capability: "{{ nri_node_capability + [ { 'name': item.metadata.name, 'max_tp': (item.metadata.labels['nri.intel.com/max-tp'] | default('0')) | int, 'available_memory_gb': ( [ ( ( (item.status.allocatable.memory | default('0Ki') | regex_replace('Ki$', '') | int) * 1024 - _already_allocated_memory_per_node.get(item.metadata.name, 0) ) / 1073741824 - 4 ) | round(0, 'floor') | int, 0 ] | max ) } ] }}"
  loop: "{{ _nri_capability_nodes.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: (item.metadata.labels['nri.intel.com/max-tp'] | default('')) != ''

---
# Shared Rook/Ceph K8s-level teardown (CRs, CRDs, namespace).
# Included by uninstall-ceph-storage.yml (interactive) and reset.yml (silent auto-detect).
# Caller must define/host-target kube_control_plane and may override `namespace` (default rook-ceph).

- name: Remove finalizers from CephCluster
  ansible.builtin.command: >
    kubectl patch cephcluster rook-ceph -n {{ namespace | default('rook-ceph') }} --type merge
    -p '{"metadata":{"finalizers":null}}'
  register: patch_cluster
  failed_when: false
  run_once: true

- name: Remove finalizers from CephBlockPool
  ansible.builtin.command: >
    kubectl patch cephblockpool ceph-blockpool -n {{ namespace | default('rook-ceph') }} --type merge
    -p '{"metadata":{"finalizers":null}}'
  register: patch_blockpool
  failed_when: false
  run_once: true

- name: Remove finalizers from CephFilesystem
  ansible.builtin.command: >
    kubectl patch cephfilesystem ceph-filesystem -n {{ namespace | default('rook-ceph') }} --type merge
    -p '{"metadata":{"finalizers":null}}'
  register: patch_filesystem
  failed_when: false
  run_once: true

- name: Remove finalizers from CephObjectStore
  ansible.builtin.command: >
    kubectl patch cephobjectstore ceph-objectstore -n {{ namespace | default('rook-ceph') }} --type merge
    -p '{"metadata":{"finalizers":null}}'
  register: patch_objectstore
  failed_when: false
  run_once: true

- name: Remove finalizers from CephObjectStoreUsers
  ansible.builtin.shell: |
    kubectl get cephobjectstoreusers.ceph.rook.io -n {{ namespace | default('rook-ceph') }} -o name 2>/dev/null | while read resource; do
      echo "Patching $resource"
      kubectl patch $resource -n {{ namespace | default('rook-ceph') }} --type merge -p '{"metadata":{"finalizers":null}}'
    done || echo "No CephObjectStoreUsers found"
  register: patch_objectstore_users
  failed_when: false
  run_once: true

- name: Display finalizer removal results
  debug:
    msg:
      - "CephCluster finalizer removal: {{ 'Success' if patch_cluster.rc == 0 else 'Failed/Not Found' }}"
      - "CephBlockPool finalizer removal: {{ 'Success' if patch_blockpool.rc == 0 else 'Failed/Not Found' }}"
      - "CephFilesystem finalizer removal: {{ 'Success' if patch_filesystem.rc == 0 else 'Failed/Not Found' }}"
      - "CephObjectStore finalizer removal: {{ 'Success' if patch_objectstore.rc == 0 else 'Failed/Not Found' }}"
      - "CephObjectStoreUsers: {{ patch_objectstore_users.stdout_lines }}"
  run_once: true

- name: Set cleanup policy on CephCluster for data destruction
  ansible.builtin.command: >
    kubectl -n {{ namespace | default('rook-ceph') }} patch cephcluster rook-ceph --type merge
    -p '{"spec":{"cleanupPolicy":{"confirmation":"yes-really-destroy-data"}}}'
  register: cleanup_policy
  failed_when: false
  run_once: true

- name: Display cleanup policy result
  debug:
    msg: "Cleanup policy set: {{ 'Success' if cleanup_policy.rc == 0 else 'Failed/Not Found' }}"
  run_once: true

- name: Wait a moment for finalizer removal to take effect
  pause:
    seconds: 10
  run_once: true

- name: Delete CephBlockPool
  ansible.builtin.command: kubectl delete cephblockpool ceph-blockpool -n {{ namespace | default('rook-ceph') }} --timeout=300s
  register: delete_blockpool
  failed_when: false
  run_once: true

- name: Delete CephFilesystem
  ansible.builtin.command: kubectl delete cephfilesystem ceph-filesystem -n {{ namespace | default('rook-ceph') }} --timeout=300s
  register: delete_filesystem
  failed_when: false
  run_once: true

- name: Delete CephFilesystemSubvolumeGroup
  ansible.builtin.command: kubectl delete cephfilesystemsubvolumegroup ceph-filesystem-csi -n {{ namespace | default('rook-ceph') }} --timeout=300s
  register: delete_subvolumegroup
  failed_when: false
  run_once: true

- name: Delete CephObjectStore
  ansible.builtin.command: kubectl delete cephobjectstore ceph-objectstore -n {{ namespace | default('rook-ceph') }} --timeout=300s
  register: delete_objectstore
  failed_when: false
  run_once: true

- name: Delete CephCluster
  ansible.builtin.command: kubectl -n {{ namespace | default('rook-ceph') }} delete cephcluster rook-ceph --timeout=600s
  register: delete_cluster
  failed_when: false
  run_once: true

- name: Display resource deletion results
  debug:
    msg:
      - "CephBlockPool deletion: {{ 'Success' if delete_blockpool.rc == 0 else 'Failed/Not Found' }}"
      - "CephFilesystem deletion: {{ 'Success' if delete_filesystem.rc == 0 else 'Failed/Not Found' }}"
      - "CephFilesystemSubvolumeGroup deletion: {{ 'Success' if delete_subvolumegroup.rc == 0 else 'Failed/Not Found' }}"
      - "CephObjectStore deletion: {{ 'Success' if delete_objectstore.rc == 0 else 'Failed/Not Found' }}"
      - "CephCluster deletion: {{ 'Success' if delete_cluster.rc == 0 else 'Failed/Not Found' }}"
  run_once: true

- name: Delete all PVCs in rook-ceph namespace
  ansible.builtin.command: kubectl -n {{ namespace | default('rook-ceph') }} delete pvc --all --timeout=300s
  register: delete_pvcs
  failed_when: false
  run_once: true

- name: Display PVC deletion result
  debug:
    msg: "PVC deletion: {{ 'Success' if delete_pvcs.rc == 0 else 'Failed/Not Found' }}"
  run_once: true

- name: Wait for resource cleanup to complete
  pause:
    seconds: 30
  run_once: true

- name: Uninstall Helm releases
  ansible.builtin.command: helm uninstall rook-ceph rook-ceph-cluster -n {{ namespace | default('rook-ceph') }}
  register: helm_uninstall
  failed_when: false
  run_once: true

- name: Display Helm uninstall result
  debug:
    msg: "Helm releases uninstall: {{ 'Success' if helm_uninstall.rc == 0 else 'Failed/Not Found' }}"
  run_once: true

# Retries the get/delete/force-delete cycle instead of a single pass so transient finalizer
# races converge within this run rather than needing a second playbook invocation.
- name: Reconcile Rook CRDs until fully removed
  ansible.builtin.shell: |
    for crd in $(kubectl get crd -o name 2>/dev/null | grep '\.rook\.io$'); do
      kubectl delete "$crd" --timeout=30s --wait=false 2>/dev/null || true
      kubectl patch "$crd" --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
      kubectl delete "$crd" --force --grace-period=0 2>/dev/null || true
    done
    kubectl get crd -o name 2>/dev/null | grep '\.rook\.io$' || true
  register: crd_reconcile
  until: crd_reconcile.stdout == ""
  retries: 5
  delay: 10
  changed_when: false
  ignore_errors: true
  run_once: true

- name: Display Rook CRD reconciliation result
  debug:
    msg: "{{ 'All Rook CRDs successfully removed' if crd_reconcile.stdout_lines | length == 0 else 'Remaining CRDs: ' + (crd_reconcile.stdout_lines | join(', ')) }}"
  run_once: true

# ceph_cleanup_strict (default true) fails the play on stuck CRDs/namespace; set to
# false so a full-cluster reset.yml decommission isn't blocked by leftover Rook state.
- name: Fail if Rook CRDs remain after retries
  ansible.builtin.fail:
    msg: "Rook CRDs still present after cleanup retries: {{ crd_reconcile.stdout_lines }}"
  when:
    - crd_reconcile.stdout_lines | length > 0
    - ceph_cleanup_strict | default(true)
  run_once: true

- name: Revert vLLM PVC template to use ReadWriteOnce access mode
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../helm-charts/vllm/templates/pvc.yaml"
    regexp: '(\s+accessModes:\n\s+)- ReadWriteMany'
    replace: '\1- ReadWriteOnce'
  register: pvc_template_revert
  run_once: true
  delegate_to: localhost
  failed_when: false

- name: Display PVC template revert result
  debug:
    msg: "PVC template reverted successfully to use ReadWriteOnce"
  when: pvc_template_revert.changed
  run_once: true

- name: Restore local-path storageclass as default
  ansible.builtin.command: >
    kubectl patch storageclass local-path -p '{"metadata": {"annotations": {"storageclass.kubernetes.io/is-default-class": "true"}}}'
  register: local_path_restore
  failed_when: false # Allow failure if storageclass doesn't exist
  run_once: true

- name: Display local-path storageclass restore result
  debug:
    msg: "Local-path storageclass restored as default: {{ 'Success' if local_path_restore.rc == 0 else 'Failed/Not Found' }}"
  run_once: true

# Retries delete + finalizer-strip (configmaps/secrets/namespace via /finalize subresource,
# since a plain patch is a no-op on a Terminating namespace) instead of a single best-effort pass.
- name: Reconcile rook-ceph namespace deletion until fully removed
  ansible.builtin.shell: |
    kubectl delete namespace {{ namespace | default('rook-ceph') }} --timeout=30s --wait=false 2>/dev/null || true
    for cm in $(kubectl get configmaps -n {{ namespace | default('rook-ceph') }} -o name 2>/dev/null); do
      kubectl patch "$cm" -n {{ namespace | default('rook-ceph') }} --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
    done
    for secret in $(kubectl get secrets -n {{ namespace | default('rook-ceph') }} -o name 2>/dev/null); do
      kubectl patch "$secret" -n {{ namespace | default('rook-ceph') }} --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
    done
    ns_json=$(kubectl get namespace {{ namespace | default('rook-ceph') }} -o json 2>/dev/null) && \
      echo "$ns_json" | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/{{ namespace | default('rook-ceph') }}/finalize" -f - >/dev/null 2>&1 || true
    kubectl get namespace {{ namespace | default('rook-ceph') }} >/dev/null 2>&1 && echo STILL_EXISTS || echo GONE
  register: ns_reconcile
  until: "'GONE' in ns_reconcile.stdout"
  retries: 5
  delay: 15
  changed_when: false
  ignore_errors: true
  run_once: true

- name: Display namespace reconciliation result
  debug:
    msg: "Namespace deletion: {{ 'Success - Namespace fully removed' if 'GONE' in ns_reconcile.stdout else 'Warning - Namespace still exists' }}"
  run_once: true

- name: Fail if rook-ceph namespace still exists after retries
  ansible.builtin.fail:
    msg: "Namespace {{ namespace | default('rook-ceph') }} still exists after cleanup retries."
  when:
    - "'STILL_EXISTS' in ns_reconcile.stdout"
    - ceph_cleanup_strict | default(true)
  run_once: true

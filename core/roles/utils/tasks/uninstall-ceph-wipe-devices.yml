---
# Shared Rook/Ceph raw OSD device wipe: zaps partition tables and clears
# bluestore/LVM signatures on every device listed in the 'devices' hostvar
# (rack-profile.yaml storage.nodes). Runs per-host (no run_once) — included
# on hosts: all / k8s_cluster by both uninstall-ceph-storage.yml and reset.yml.
# No-op when 'devices' is undefined/empty. Each device is only actually wiped
# when a Ceph/bluestore signature is detected on it (see require_ceph_signature
# in uninstall-ceph-wipe-one-device.yml), so this is safe to run unconditionally
# even when Ceph was never installed on this node.

- name: Wipe OSD devices declared in inventory
  when: devices is defined and devices | length > 0
  block:
    - name: Process each declared OSD device
      ansible.builtin.include_tasks: uninstall-ceph-wipe-one-device.yml
      loop: "{{ devices }}"
      loop_control:
        loop_var: wipe_device
        label: "{{ wipe_device }}"

    - name: Display device wipe results
      debug:
        msg: "Processed Ceph OSD devices on {{ inventory_hostname }}: {{ devices }}"

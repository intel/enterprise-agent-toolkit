---
# =============================================================================
# NRI CPU Balloons Role Defaults
# =============================================================================
# Installs the NRI "balloons" resource policy (containers/nri-plugins) so that
# vLLM model pods can be pinned to CPU sets that respect NUMA topology and
# expose only physical cores (hyperthreads filtered).
#
# This role is CPU-only. It is a no-op when kubernetes_accelerator != "cpu".
# =============================================================================

# Helm release coordinates
nri_cpu_balloons:
  namespace: "kube-system"
  installation_timeout: 300
  # Minimal image for the unprivileged node-topology probe DaemonSet. Only a
  # POSIX shell + busybox coreutils are needed to read /sys — no python, no
  # apt-get, no root. Override (e.g. pin by digest, or use a mirror/alpine) for
  # air-gapped or regulated environments.
  probe_image: "busybox:1.36"
  helm:
    repo_url: "https://containers.github.io/nri-plugins"
    repo_name: "nri-plugins"
    chart_name: "nri-resource-policy-balloons"
    release_name: "nri-resource-policy-balloons"

# Reserved-CPU sizing.
#
# Sized from a deployment profile fed to
# `files/compute_reserved_cpus_advanced.sh`:
#   siblings      =  ALL sibling (HT) vCPUs — physical cores
#                    reserved exclusively for vLLM balloons  [default]
#   minimal       =  8 logical CPUs (core services only)
#   standard      = 12 logical CPUs (core + auth)
#   observability = 16 logical CPUs (standard + monitoring)
#   full          = 20 logical CPUs (all components)
#
# The 'siblings' profile reserves all hyperthreaded sibling cores and
# excludes them from the balloon pool. This leaves physical cores
# exclusively for vLLM models, while sibling cores handle infrastructure
# and non-vLLM workloads. Falls back to 'standard' if SMT is disabled.
#
# Operators can override sizing by setting `nri_reserved_cpu_list` to a
# Linux cpuset string (e.g. "0-3" or "0,1,32,33"). That value is applied
# to every node, so only set it on homogeneous clusters.
nri_deployment_profile: "siblings"
nri_reserved_cpu_list: ""

# Maximum tensor-parallel size to generate balloons for. Auto-capped by the
# number of NUMA nodes detected on each node.
nri_max_tp_size: 8

# Working directory for rendered values files on the controller host.
nri_tmp_dir: "/tmp/balloon-config"

# Optional list of model short-names to pre-flight validate in `validate.yaml`
# (uses `files/validate-cpu-requirements.sh`). Empty = skip validator.
nri_target_models: []

# Re-exposed as a single dict for templates / set_stats consumers.
nri_cpu_balloon_annotation_key: "balloon.balloons.resource-policy.nri.io"

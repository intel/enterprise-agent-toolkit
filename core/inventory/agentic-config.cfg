cluster_url=api.example.com
cert_file=~/certs/cert.pem
key_file=~/certs/key.pem
hugging_face_token=
models=cpu-qwen2-5-coder-14b
# GPU example (set compute_platform=g and uncomment to deploy B300 Llama-70B):
# compute_platform=g
# compute_platform=xpu 
# models=gpu-nvidia-b300-llama-70b
deploy_kubernetes_fresh=on
deploy_ingress_controller=on
deploy_genai_gateway=on
deploy_observability=on
deploy_llm_models=on
deploy_agenticai_plugin=off
deploy_redis=on
deploy_pgvector=on
deploy_kuberay=off
deploy_agent_sandbox=on
# Kata microVM runtime for sandboxes — requires deploy_agent_sandbox=on
deploy_kata_containers=off
# Kata runtime to use for sandboxes (options: kata-fc, kata-qemu)
kata_runtime=kata-fc 
deploy_ceph=off
rack_scale_mode=off
deploy_guardrails=on
deploy_vllm_sr=off
deploy_openshell=off
http_proxy=
https_proxy=
no_proxy=

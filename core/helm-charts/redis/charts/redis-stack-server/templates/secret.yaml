{{- if .Values.redis_stack_server.auth.enabled }}
{{- if empty .Values.redis_stack_server.auth.password }}
{{- fail "redis-stack-server: redis_stack_server.auth.password must be set when auth is enabled. Pass it via --set \"redis-stack-server.redis_stack_server.auth.password=<password>\" or a custom values file. To deploy without authentication (NOT recommended, unauthenticated Redis allows arbitrary reads, writes and Lua/JS execution) set redis_stack_server.auth.enabled=false." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.name }}-credentials"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Values.name }}"
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis_stack_server.auth.password | quote }}
  # The `default:` username is required — Redis 6+ rejects an empty username,
  # so the `redis://:<password>@...` short form fails with WRONGPASS.
  REDIS_URL: "redis://default:{{ .Values.redis_stack_server.auth.password }}@{{ .Values.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.redis_stack_server.port }}"
{{- end }}

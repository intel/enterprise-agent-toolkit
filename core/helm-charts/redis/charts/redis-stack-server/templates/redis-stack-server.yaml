apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Values.name }}"
spec:
  ports:
  - port: {{ .Values.redis_stack_server.port }}
    name: db
  type: {{ .Values.redis_stack_server.service.type }}
  selector:
    app: "{{ .Values.name }}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
spec:
  selector:
    matchLabels:
      app: "{{ .Values.name }}"
  serviceName: "{{ .Values.name }}"
  replicas: {{ .Values.redis_stack_server.replicas }}
  template:
    metadata:
      labels:
        app: "{{ .Values.name }}"
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.redis_stack_server.affinity }}
      affinity:
{{ toYaml .Values.redis_stack_server.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.redis_stack_server.tolerations }}
      tolerations:
{{ toYaml .Values.redis_stack_server.tolerations | indent 8 }}
      {{- end }}
      containers:
      - name: "{{ .Values.name }}"
        image: {{ .Values.redis_stack_server.image }}:{{ .Values.redis_stack_server.tag }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: {{ .Values.redis_stack_server.port }}
          name: db
        {{- if .Values.redis_stack_server.auth.enabled }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.name }}-credentials"
              key: REDIS_PASSWORD
        # redis-stack-server appends REDIS_ARGS to the redis-server command line.
        - name: REDIS_ARGS
          value: "--requirepass $(REDIS_PASSWORD)"
        {{- end }}
        volumeMounts:
        - name: db
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: db
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.redis_stack_server.storage_class }}
      resources:
        requests:
          storage: {{ .Values.redis_stack_server.storage }}

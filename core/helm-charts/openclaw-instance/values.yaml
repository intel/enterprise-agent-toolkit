# OpenClaw Instance Configuration
# Routes through the LiteLLM semantic router (genai-gateway) for model inference.

namespace: openclaw

image:
  repository: ghcr.io/openclaw/openclaw
  tag: latest
  pullPolicy: IfNotPresent

# Model configuration
model:
  # OpenClaw provider key — the LiteLLM semantic auto-router
  provider: "auto_router"
  # LiteLLM smart-router model (semantic routing picks the backend model)
  id: "smart_router"
  name: "Smart Router"
  # LiteLLM gateway endpoint (service-name.namespace.svc.cluster.local:port/v1)
  baseUrl: "http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/v1"
  # LiteLLM master key (Bearer token) — sent to the gateway on every request.
  # Set at deploy time: --set model.apiKey=sk-...  (leave empty in source)
  apiKey: ""
  # Required: the LiteLLM gateway is a private (cluster) host, not loopback.
  # OpenClaw refuses to send the apiKey to a private network unless this is set.
  allowPrivateNetwork: true

# Scaling
availability:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilization: 70

nodeSelector:
  ei-inference-eligible: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

# Resources
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Storage
storage:
  enabled: true
  size: 20Gi

# Security
security:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  networkPolicy:
    enabled: false

# Gateway
gateway:
  enabled: true
  tokenSecretName: openclaw-gateway-token
  token: "<write-your-own-token-here>"

# Observability
observability:
  metrics:
    enabled: true
    port: 9090
  logging:
    level: info

# Networking
service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"

# Auto-update
autoUpdate:
  enabled: false

# Health probes
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Overrides for the upstream kata-deploy Helm chart
#   oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy
#
# All shims are disabled here; deploy-kata-containers.yml enables only the
# ones selected by kata_runtime (kata-fc / kata-qemu / both) via --set, so a
# single values file serves every mode.
# ---------------------------------------------------------------------------

deploymentMode: daemonset

# kata-deploy owns the node's container runtime config — losing it to an
# eviction would leave the node without a Kata runtime.
priorityClassName: system-node-critical

# The chart creates one RuntimeClass per enabled shim (kata-fc, kata-qemu),
# each scheduled onto nodes carrying katacontainers.io/kata-runtime=true,
# a label kata-deploy applies itself once install succeeds.
runtimeClasses:
  enabled: true
  createDefault: false

shims:
  disableAll: true

# Left empty on purpose: the playbook injects
# --set nodeSelector.<kata_node_label_key>=<kata_node_label_value> so the
# eligibility label stays defined in one place (inference_kata.yml) and
# kata-deploy only touches nodes the preflight verified have /dev/kvm.
nodeSelector: {}

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-sandbox-server
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-sandbox-server
rules:
  # Manage sandbox claims (create/delete on execution)
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Watch sandboxes (SDK resolves sandbox name/readiness)
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Read pods (SDK resolves pod IP)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-sandbox-server
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-sandbox-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-sandbox-server
subjects:
  - kind: ServiceAccount
    name: mcp-sandbox-server
    namespace: {{ .Values.namespace }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "ovms-model-server.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ovms-model-server.labels" . | nindent 4 }}
    {{- if and .Values.routingDiscovery.enabled (eq .Values.model.task "text_generation") }}
    {{- /* Opt this Service in to vLLM-SR backend discovery. Without it, an OVMS
           deployment can never become a routing backend - see deploy-vllm-sr.yml. */}}
    agentic.intel.com/serving-runtime: ovms
    {{- end }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $advertise := and .Values.routingDiscovery.enabled (eq .Values.model.task "text_generation") .Values.modelSource }}
  {{- if or .Values.service.annotations $advertise }}
  annotations:
    {{- if $advertise }}
    {{- /* An annotation, not a label: model ids contain '/', which is not legal
           in a Kubernetes label value. */}}
    agentic.intel.com/model-id: {{ .Values.modelSource | quote }}
    agentic.intel.com/serving-port: {{ .Values.service.restPort | quote }}
    {{- /* OVMS 2025.4 serves /v3/chat/completions; vLLM-SR would otherwise
           append its default /v1/... and every request would 404. */}}
    agentic.intel.com/chat-path: /v3/chat/completions
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.modelSource }}
  ports:
  # gRPC port
  - name: grpc
    port: {{ .Values.service.grpcPort }}
    targetPort: {{ .Values.server.grpcPort }}
    protocol: TCP
  # REST API port
  - name: rest
    port: {{ .Values.service.restPort }}
    targetPort: {{ .Values.server.restPort }}
    protocol: TCP
  {{- end }}
  selector:
    {{- include "ovms-model-server.selectorLabels" . | nindent 4 }}

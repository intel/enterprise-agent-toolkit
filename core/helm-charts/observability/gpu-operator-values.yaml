#
# Helm values for the NVIDIA GPU Operator release, applied by
# playbooks/deploy-nvidia-gpu-operator.yml with `helm upgrade --install -f`.
#
# WHY THIS FILE EXISTS
# --------------------
# These settings used to be passed as bare `--set` flags on the helm command
# line. Helm does NOT merge an upgrade's values with the previous revision's
# values: any `helm upgrade` of this release that omits a flag silently drops
# that field from the ClusterPolicy. That is exactly what happened on the B300
# Star cluster on 2026-08-27 — an upgrade run from a checkout predating the
# custom counter set rewrote the ClusterPolicy without
# spec.dcgmExporter.config.name. The DCGM exporter fell back to the in-image
# default counter CSV (/etc/dcgm-exporter/dcp-metrics-included.csv), in which
# NVIDIA ships the ECC, clock-throttle and SM-activity fields commented out.
# The ECC and throttling Grafana rows went blank, the GPUECCDoubleBit and
# GPUThrottling alerts in gpu-alerts.yaml became permanently unevaluable, and
# nothing failed or paged for ~3 weeks.
#
# Keeping the configuration in a committed values file makes it declarative:
# every deploy path re-asserts the full set, so the config survives upgrades
# instead of depending on one specific playbook line being executed.
#
# Do NOT move any of these back to `--set`.

driver:
  enabled: true

toolkit:
  enabled: true

devicePlugin:
  enabled: true

migManager:
  enabled: false

nodeStatusExporter:
  enabled: true

dcgmExporter:
  enabled: true

  # Points the exporter at the dcgm-metrics-config ConfigMap (created from
  # helm-charts/observability/dcgm-metrics.csv by the same playbook), which
  # uncomments the ECC, clock-throttle, remapped-row, NVLink and DCGM_FI_PROF_*
  # counter fields that the in-image default CSV leaves disabled.
  #
  # If this field is absent from the ClusterPolicy the exporter still runs and
  # still reports utilisation, memory, temperature, power and XID — the
  # regression is invisible unless the ECC/throttling panels are queried
  # directly. The playbook asserts this field is present after every deploy.
  config:
    name: dcgm-metrics-config

  # Intentionally false. The DCGM ServiceMonitor is created by
  # playbooks/deploy-observability.yml in the observability namespace so it
  # carries the release=observability label this Prometheus's
  # serviceMonitorSelector requires; the operator's own monitor uses a
  # different label and would be silently ignored. Enabling it here would also
  # create a competing ServiceMonitor named nvidia-dcgm-exporter in the
  # gpu-operator namespace.
  serviceMonitor:
    enabled: false

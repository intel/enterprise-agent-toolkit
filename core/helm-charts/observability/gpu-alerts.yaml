#
# GPU health alerting rules, sourced from the NVIDIA DCGM exporter.
# Applied by playbooks/deploy-observability.yml only when the rack profile has
# NVIDIA GPU nodes (rack_scale_gpu_vendor == "nvidia").
#
# The `release: observability` label is REQUIRED — the kube-prometheus-stack
# Prometheus is configured with ruleSelector matchLabels {release: observability},
# so a rule without it is silently ignored.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-alerts
  namespace: observability
  labels:
    release: observability
    app.kubernetes.io/name: gpu-alerts
    app.kubernetes.io/part-of: observability
spec:
  groups:
    - name: gpu.rules
      rules:
        # GPU framebuffer memory sustained above 90% risks CUDA OOM and
        # allocator thrash, which throttles inference throughput.
        - alert: GPUMemoryHigh
          expr: >-
            DCGM_FI_DEV_FB_USED
              / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)
              > 0.90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} memory > 90%"
            description: >-
              GPU {{ $labels.gpu }} ({{ $labels.modelName }}) on host
              {{ $labels.Hostname }} has used
              {{ $value | humanizePercentage }} of framebuffer memory for over
              5 minutes. Serving pod: {{ $labels.namespace }}/{{ $labels.pod }}.

        # Sustained high die temperature indicates thermal throttling, which
        # silently reduces clocks and inference throughput on the B300.
        - alert: GPUTemperatureHigh
          expr: DCGM_FI_DEV_GPU_TEMP > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} temp > 80C"
            description: >-
              GPU {{ $labels.gpu }} ({{ $labels.modelName }}) on host
              {{ $labels.Hostname }} has run at {{ $value }}C (> 80C) for over
              5 minutes and is likely thermally throttling.

        # Any double-bit ECC error is uncorrectable and indicates hardware
        # degradation — fire immediately (for: 0m) rather than waiting 5m.
        - alert: GPUEccDoubleBitError
          expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} ECC double-bit error"
            description: >-
              GPU {{ $labels.gpu }} ({{ $labels.modelName }}) on host
              {{ $labels.Hostname }} recorded new double-bit ECC errors in the last
              5 minutes. DBE errors are uncorrectable and indicate hardware degradation
              requiring investigation.

        # Sustained non-zero throttle bitmask means clocks are being held below
        # boost frequency, silently reducing inference throughput.
        - alert: GPUThrottling
          expr: DCGM_FI_DEV_CLOCK_THROTTLE_REASONS > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} is clock-throttling"
            description: >-
              GPU {{ $labels.gpu }} ({{ $labels.modelName }}) on host
              {{ $labels.Hostname }} has been clock-throttling (reasons bitmask:
              {{ $value }}) for over 5 minutes, reducing inference throughput.

        # For a counter, "flat at zero" and "absent" look identical on a
        # dashboard panel but mean very different things — this alert exists
        # to catch the second case. DCGM_FI_DEV_ECC_SBE_VOL_TOTAL disappearing
        # from Prometheus entirely means the series was never collected, i.e.
        # spec.dcgmExporter.config.name on the ClusterPolicy has been dropped
        # (fell back to the in-image default counter CSV, which ships ECC
        # fields commented out — see gpu-operator-values.yaml). That silently
        # broke the ECC/throttling dashboard rows and this alert's siblings
        # above for ~3 weeks on the B300 Star cluster before anyone noticed.
        - alert: GPUEccMetricsAbsent
          expr: absent(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "DCGM ECC metrics missing from Prometheus"
            description: >-
              DCGM_FI_DEV_ECC_SBE_VOL_TOTAL has not been scraped for over
              15 minutes. This means the DCGM exporter's custom counter set is
              not wired up (ClusterPolicy spec.dcgmExporter.config.name is
              missing or wrong) — ECC, clock-throttle and SM-activity metrics
              are not being collected at all, not merely reporting zero.
              Re-run playbooks/deploy-nvidia-gpu-operator.yml to restore it.

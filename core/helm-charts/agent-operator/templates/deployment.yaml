apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-operator
    spec:
      serviceAccountName: agent-operator
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: install-deps
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir -r /code/requirements.txt -t /deps
          env:
            {{- if .Values.proxy.httpProxy }}
            - name: http_proxy
              value: "{{ .Values.proxy.httpProxy }}"
            - name: https_proxy
              value: "{{ .Values.proxy.httpsProxy }}"
            - name: no_proxy
              value: "{{ .Values.proxy.noProxy }}"
            {{- end }}
          volumeMounts:
            - name: code
              mountPath: /code
            - name: deps
              mountPath: /deps
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "kopf", "run", "/code/controller.py", "--all-namespaces", "--liveness=http://0.0.0.0:8080/healthz"]
          env:
            - name: PYTHONPATH
              value: "/deps"
            - name: ADAPTER_CLAW_ENABLED
              value: "{{ .Values.adapters.claw.enabled }}"
            - name: OPENCLAW_IMAGE
              value: "{{ .Values.adapters.claw.openclawImage }}"
            - name: OPENCLAW_TAG
              value: "{{ .Values.adapters.claw.openclawTag }}"
            - name: VLLM_SERVICE_NAME
              value: "{{ .Values.adapters.claw.vllmServiceName }}"
            - name: VLLM_NAMESPACE
              value: "{{ .Values.adapters.claw.vllmNamespace }}"
            - name: MODEL_ID
              value: "{{ .Values.adapters.claw.model.id }}"
            - name: MODEL_PROVIDER
              value: "{{ .Values.adapters.claw.model.provider }}"
            - name: MODEL_NAME
              value: "{{ .Values.adapters.claw.model.name }}"
            - name: MODEL_BASE_URL
              value: "{{ .Values.adapters.claw.model.baseUrl }}"
            - name: MODEL_API_KEY
              value: {{ .Values.adapters.claw.model.apiKey | quote }}
            - name: MODEL_ALLOW_PRIVATE_NETWORK
              value: "{{ .Values.adapters.claw.model.allowPrivateNetwork }}"
            - name: SANDBOX_ENDPOINT
              value: "{{ .Values.adapters.claw.sandboxEndpoint }}"
            - name: AUTO_SUSPEND_IDLE_MINUTES
              value: "{{ .Values.autoSuspend.idleMinutes }}"
            - name: REDIS_URL
              value: "{{ .Values.redisUrl }}"
            - name: CONTEXT_TTL_SECONDS
              value: "{{ .Values.contextTtlSeconds }}"
            - name: PGVECTOR_DSN
              value: {{ .Values.pgvector.dsn | quote }}
            - name: EMBEDDING_DIM
              value: "{{ .Values.pgvector.embeddingDim }}"
            - name: MEMORY_MCP_URL
              value: {{ .Values.memory.mcpUrl | quote }}
            - name: DISPATCH_MCP_URL
              value: {{ .Values.dispatch.mcpUrl | quote }}
            # Multi-tenancy primitives (Item 10)
            - name: NETWORK_POLICY_ENABLED
              value: "{{ .Values.multiTenancy.networkPolicy.enabled }}"
            - name: NETWORK_POLICY_EGRESS_ALLOW
              value: {{ .Values.multiTenancy.networkPolicy.egressAllow | toJson | quote }}
            - name: RESOURCE_QUOTA_ENABLED
              value: "{{ .Values.multiTenancy.resourceQuota.enabled }}"
            - name: RESOURCE_QUOTA_HARD
              value: {{ .Values.multiTenancy.resourceQuota.hard | toJson | quote }}
            - name: LIMIT_RANGE_ENABLED
              value: "{{ .Values.multiTenancy.limitRange.enabled }}"
            - name: LIMIT_RANGE_DEFAULT
              value: {{ .Values.multiTenancy.limitRange.default | toJson | quote }}
            - name: LIMIT_RANGE_DEFAULT_REQUEST
              value: {{ .Values.multiTenancy.limitRange.defaultRequest | toJson | quote }}
            - name: POD_SECURITY_ENABLED
              value: "{{ .Values.multiTenancy.podSecurity.enabled }}"
            - name: POD_SECURITY_LEVEL
              value: "{{ .Values.multiTenancy.podSecurity.level }}"
            - name: MAX_AGENTS_PER_OWNER
              value: "{{ .Values.multiTenancy.maxAgentsPerOwner }}"
            - name: KEYCLOAK_ENABLED
              value: "{{ .Values.keycloak.enabled }}"
            {{- if .Values.keycloak.enabled }}
            - name: KEYCLOAK_URL
              value: "{{ .Values.keycloak.url }}"
            - name: KEYCLOAK_REALM
              value: "{{ .Values.keycloak.realm }}"
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecretName }}
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecretName }}
                  key: password
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /code
            - name: deps
              mountPath: /deps
      volumes:
        - name: code
          configMap:
            name: agent-operator-code
        - name: deps
          emptyDir: {}

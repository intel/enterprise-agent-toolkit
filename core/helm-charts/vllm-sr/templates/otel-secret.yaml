{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-otel-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vllm-sr
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  otlp-headers: {{ printf "Authorization=Basic %s" (printf "%s:%s" .Values.observability.langfuse.publicKey .Values.observability.langfuse.secretKey | b64enc) | b64enc }}
{{- end }}

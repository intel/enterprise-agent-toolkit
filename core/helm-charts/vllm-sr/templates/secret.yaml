{{- if and (eq .Values.cache.backend "redis") .Values.cache.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vllm-sr
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  redis-password: {{ .Values.cache.redis.password | b64enc | quote }}
{{- end }}

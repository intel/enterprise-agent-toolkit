{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel-collector-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vllm-sr
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
        send_batch_size: 100

    exporters:
      otlphttp:
        endpoint: "{{ .Values.observability.langfuse.endpoint }}/api/public/otel"
        headers:
          Authorization: "Basic {{ printf "%s:%s" .Values.observability.langfuse.publicKey .Values.observability.langfuse.secretKey | b64enc }}"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp]
{{- end }}

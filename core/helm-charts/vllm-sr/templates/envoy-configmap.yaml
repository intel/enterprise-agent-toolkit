apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-envoy-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vllm-sr
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8801
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            {{- range .Values.backends }}
                            - match:
                                prefix: "/"
                                headers:
                                  - name: x-selected-model
                                    string_match:
                                      exact: {{ .name | quote }}
                              {{- if .apiKey }}
                              request_headers_to_add:
                                - header:
                                    key: "Authorization"
                                    value: "Bearer {{ .apiKey }}"
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                              {{- end }}
                              route:
                                cluster: {{ .name | replace "/" "_" | replace "-" "_" | replace "." "_" }}_cluster
                                timeout: 300s
                                idle_timeout: 1200s
                                {{- if .hostRewrite }}
                                host_rewrite_literal: {{ .hostRewrite | quote }}
                                {{- end }}
                            {{- end }}
                            - match:
                                prefix: "/"
                              {{- /* backend_cluster exists only when backends do. */}}
                              {{- if .Values.backends }}
                              route:
                                cluster: backend_cluster
                                timeout: 300s
                              {{- else }}
                              direct_response:
                                status: 503
                                body:
                                  inline_string: "vllm-sr: no model backends discovered"
                              {{- end }}
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc_cluster
                            timeout: 300s                          
                          message_timeout: 60s
                          processing_mode:
                            request_header_mode: SEND
                            request_body_mode: BUFFERED
                            response_header_mode: SEND
                            response_body_mode: BUFFERED
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: ext_proc_cluster
          connect_timeout: 10s
          type: STATIC
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: ext_proc_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 50051
        {{- range .Values.backends }}
        {{- $hostport := .baseUrl | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/v1" | trimSuffix "/" }}
        {{- $host := $hostport | splitList ":" | first }}
        {{- $port := ternary (index ($hostport | splitList ":") 1) "80" (contains ":" $hostport) }}
        - name: {{ .name | replace "/" "_" | replace "-" "_" | replace "." "_" }}_cluster
          connect_timeout: 30s
          type: {{ if regexMatch "^[0-9.]+$" $host }}STATIC{{ else }}STRICT_DNS{{ end }}
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: {{ .name | replace "/" "_" | replace "-" "_" | replace "." "_" }}_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ $host }}
                          port_value: {{ $port }}
        {{- end }}
        {{- if .Values.backends }}
        {{- $first := index .Values.backends 0 }}
        {{- $fhp := $first.baseUrl | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/v1" | trimSuffix "/" }}
        {{- $fhost := $fhp | splitList ":" | first }}
        {{- $fport := ternary (index ($fhp | splitList ":") 1) "80" (contains ":" $fhp) }}
        - name: backend_cluster
          connect_timeout: 30s
          type: {{ if regexMatch "^[0-9.]+$" $fhost }}STATIC{{ else }}STRICT_DNS{{ end }}
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: backend_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ $fhost }}
                          port_value: {{ $fport }}
        {{- end }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

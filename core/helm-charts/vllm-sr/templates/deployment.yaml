apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vllm-sr
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-sr
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-sr
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/envoy: {{ include (print $.Template.BasePath "/envoy-configmap.yaml") . | sha256sum }}
    spec:
      # Neither the router nor the dashboard image sets a USER, so both would
      # run as root; 65532 is the dashboard image's own `nonroot` user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: envoy
              containerPort: {{ .Values.service.envoyPort }}
              protocol: TCP
            - name: envoy-admin
              containerPort: 9901
              protocol: TCP
          command: ["sh", "-c"]
          args:            
            - "envoy -c /etc/envoy/envoy.yaml --log-level info"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true

        - name: vllm-sr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "/etc/vllm-sr/router-config.yaml"
          ports:
            - name: extproc
              containerPort: {{ .Values.service.extProcPort }}
              protocol: TCP
            - name: apiserver
              containerPort: {{ .Values.service.apiServerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            # The image's HOME is /root; the HF downloader caches under $HOME.
            - name: HOME
              value: /tmp
            {{- if .Values.proxy.http_proxy }}
            - name: http_proxy
              value: {{ .Values.proxy.http_proxy }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.http_proxy }}
            {{- end }}
            {{- if .Values.proxy.https_proxy }}
            - name: https_proxy
              value: {{ .Values.proxy.https_proxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.https_proxy }}
            {{- end }}
            {{- if .Values.proxy.no_proxy }}
            - name: no_proxy
              value: {{ .Values.proxy.no_proxy }}
            - name: NO_PROXY
              value: {{ .Values.proxy.no_proxy }}
            {{- end }}
            - name: VLLM_SR_METRICS_PORT
              value: "{{ .Values.service.metricsPort }}"
            {{- if .Values.observability.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "127.0.0.1:4317"
            - name: OTEL_SERVICE_NAME
              value: "vllm-semantic-router"
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: apiserver
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: apiserver
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: apiserver
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/vllm-sr
              readOnly: true
            # Classifier models are downloaded here at startup (~4.6 GiB).
            - name: router-models
              mountPath: /app/models
            - name: router-tmp
              mountPath: /tmp

        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          command: ["/usr/local/bin/dashboard-backend"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - "-port=8700"
            - "-static=/app/frontend"
            - "-config=/app/config/config.yaml"
            - "-router_api=http://localhost:8080"
            - "-router_metrics=http://localhost:9190/metrics"
            - "-envoy=http://localhost:{{ .Values.service.envoyPort }}"
            - "-allow-open-bootstrap"
            - "-bootstrap-admin-email={{ .Values.dashboard.adminEmail }}"
            - "-bootstrap-admin-name={{ .Values.dashboard.adminName }}"
            - "-bootstrap-admin-password={{ .Values.dashboard.adminPassword }}"
          ports:
            - name: dashboard
              containerPort: 8700
              protocol: TCP
          env:
            - name: VLLM_SR_API_URL
              value: "http://localhost:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: dashboard-data
              mountPath: /app/config
            # SQLite auth and workflow stores (-auth-db, -workflow-db, ...).
            - name: dashboard-state
              mountPath: /app/data
            - name: dashboard-tmp
              mountPath: /tmp
            - name: config-init
              mountPath: /app/config-init
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "cp /app/config-init/router-config.yaml /app/config/config.yaml 2>/dev/null || true"]

        {{- if .Values.observability.enabled }}
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          args: ["--config=/etc/otel/otel-collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel
              readOnly: true
        {{- end }}

      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: envoy-config
          configMap:
            name: {{ .Release.Name }}-envoy-config
        - name: config-init
          configMap:
            name: {{ .Release.Name }}-config
        - name: dashboard-data
          emptyDir: {}
        - name: dashboard-state
          emptyDir: {}
        - name: dashboard-tmp
          emptyDir: {}
        - name: router-models
          emptyDir: {}
        - name: router-tmp
          emptyDir: {}
        {{- if .Values.observability.enabled }}
        - name: otel-collector-config
          configMap:
            name: {{ .Release.Name }}-otel-collector-config
        {{- end }}

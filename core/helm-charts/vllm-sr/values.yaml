replicaCount: 1

image:
  repository: ghcr.io/vllm-project/semantic-router/vllm-sr
  tag: "v0.3.0"
  pullPolicy: IfNotPresent

dashboard:
  image:
    repository: ghcr.io/vllm-project/semantic-router/dashboard
    tag: "latest"
    pullPolicy: IfNotPresent
  adminEmail: ""
  adminName: ""
  adminPassword: ""

service:
  type: ClusterIP
  envoyPort: 8801
  extProcPort: 50051
  apiServerPort: 8080
  metricsPort: 9190

resources:
  requests:
    memory: "1Gi"
    cpu: "1000m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: ei-infra-eligible
          operator: In
          values: ["true"]
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

probes:
  startup:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60
    timeoutSeconds: 10
  liveness:
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 10
    timeoutSeconds: 10
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 10

ingress:
  enabled: true
  host: ""
  # Separate host for the dashboard (keeps its paths off the LiteLLM host).
  # Empty = serve the dashboard on `host` (legacy).
  dashboardHost: ""
  secretname: ""
  path: /v1/route
  eks: false

route:
  enabled: false
  host: ""
  tls:
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"

# Semantic cache backend (memory or redis)
cache:
  backend: "memory"
  redis:
    host: ""
    port: 6379
    password: ""

# Routing configuration
routing:
  # Model served when the router has no better choice. Empty => the first
  # discovered backend.
  defaultModel: ""
  enableSemanticCache: true
  # Similarity above which a cached response is reused.
  cacheThreshold: 0.92

  # NOT YET WIRED - setting these currently changes nothing.
  #
  # v0.3.0 configures both detectors under `global.model_catalog`
  # (`modules.prompt_guard.enabled` and `modules.classifier.pii`), and this chart
  # renders no `global.model_catalog` block at all, so there is nowhere to put
  # them. Adding that block also means shipping the classifier model refs, and
  # for the detectors to affect routing rather than only run, a decision has to
  # consume the resulting signal - and this chart renders no such decision either.
  # Left declared, and documented as inert, because wiring them is the intent.
  enableJailbreakDetection: true
  enablePiiDetection: false

backends: []

# Router replay
# storeBackend: memory, redis, postgres, milvus, qdrant
replay:
  enabled: true
  storeBackend: memory

observability:
  enabled: false
  langfuse:
    endpoint: ""
    publicKey: ""
    secretKey: ""

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true

# Proxy settings
proxy:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

namespace: vllm-sr

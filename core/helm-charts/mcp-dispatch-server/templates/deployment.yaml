apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-dispatch-server
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-dispatch-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-dispatch-server
  template:
    metadata:
      labels:
        app: mcp-dispatch-server
    spec:
      serviceAccountName: mcp-dispatch-server
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/code/server.py"]
          env:
            - name: PYTHONPATH
              value: "/deps"
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: MODEL_ID
              value: {{ .Values.modelId | quote }}
            - name: WORKER_TURN_TIMEOUT
              value: "{{ .Values.workerTurnTimeout }}"
          ports:
            - containerPort: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /code
            - name: deps
              mountPath: /deps
      volumes:
        - name: code
          configMap:
            name: mcp-dispatch-server-code
        - name: deps
          hostPath:
            path: {{ .Values.depsHostPath }}
            type: Directory

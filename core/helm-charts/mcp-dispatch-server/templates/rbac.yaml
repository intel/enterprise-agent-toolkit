apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-dispatch-server
  labels:
    app: mcp-dispatch-server
rules:
  # Manage Agent CRs (spawn/list/terminate workers)
  - apiGroups: ["intel-stack.io"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  # Read per-agent Keycloak credentials to mint attenuated tokens
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # NOTE: exec into worker pods is intentionally NOT granted cluster-wide here.
  # The operator creates a namespace-scoped Role+RoleBinding in each worker
  # namespace (agent-<name>) granting this ServiceAccount `pods` + `pods/exec`
  # ONLY there. This bounds the blast radius: the dispatch server can exec into
  # worker pods it manages, not arbitrary pods across the cluster.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-dispatch-server
  labels:
    app: mcp-dispatch-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-dispatch-server
subjects:
  - kind: ServiceAccount
    name: mcp-dispatch-server
    namespace: {{ .Values.namespace }}

replicaCount: 1
image:
  repository: docker.litellm.ai/berriai/litellm
  tag: v1.83.14-stable.patch.2
  pullPolicy: Always
  imagePullSecrets: []
service:
  type: LoadBalancer
  port: 4000

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: ei-infra-eligible
          operator: In
          values: ["true"]
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

probes:
  startup:
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 30
    timeoutSeconds: 10
  liveness:
    initialDelaySeconds: 180
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 5
    timeoutSeconds: 15
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
    timeoutSeconds: 10

customRouter:
  # Set to true to mount the custom hybrid router strategy into the LiteLLM container.
  # When enabled, adds custom_hybrid_router.proxy_handler_instance to litellm callbacks
  # and mounts all router_strategy Python files from the genai-gateway-router-code ConfigMap.
  enabled: true

ingress:
  host: ""
  secretname: ""
  eks: false
route:
  enabled: false
  host: ""
  tls:
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"
env:
  LITELLM_MASTER_KEY: "<REPLACE_WITH_MASTER_KEY>"
  LITELLM_SALT_KEY: "<REPLACE_WITH_SALT_KEY>"
  REDIS_HOST: genai-gateway-redis-master
  REDIS_PORT: "6379"
  STORE_MODEL_IN_DB: "True"
  PROXY_LOGOUT_URL: /sso/key/generate
  LANGFUSE_SECRET_KEY: "<REPLACE_WITH_LANGFUSE_SECRET_KEY>"
  LANGFUSE_PUBLIC_KEY: "<REPLACE_WITH_LANGFUSE_PUBLIC_KEY>"
  LANGFUSE_OTEL_HOST: "http://genai-gateway-trace-web.genai-gateway.svc.cluster.local:3000"
config:
  proxy_config_yaml: |
    router_settings:
      routing_strategy: usage-based-routing-v2
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
      optional_pre_call_checks: ["prompt_caching"]
    litellm_settings:
      drop_params: true
      return_response_headers: false
      callbacks: ["langfuse_otel", "custom_hybrid_router.proxy_handler_instance"]
      turn_off_message_logging: false
      redact_user_api_key_info: false
    general_settings:
      disable_spend_logs: false
      disable_error_logs: true
# policyPlane: opt-in governance-layer gate. Default is `false`, which keeps
# rendered output byte-identical to before this flag existed -- most users
# of this chart have no relationship to the (optional) downstream "Policy
# Plane" governance layer and should see zero behavior change.
#
# When enabled: true, templates/configmap.yaml overrides two settings inside
# the rendered config.proxy_config_yaml block:
#   * general_settings.disable_error_logs -> false (error-level request logs
#     are retained instead of suppressed, so the governance audit ledger has
#     a complete record of every call).
#   * litellm_settings.callbacks gains callbackRef appended (if non-empty),
#     registering the policy-check callback so it actually fires on gateway
#     traffic instead of being "registered nowhere".
policyPlane:
  enabled: false
  # LiteLLM resolves custom callbacks of the form "<module>.<instance>" by
  # loading <module>.py (relative to the mounted proxy config) and reading
  # the <instance> attribute off it (see LiteLLM's proxy `get_instance_fn`,
  # which falls back to `importlib.util.spec_from_file_location` + `getattr`
  # when the module isn't plain-importable). This default names the AAIS
  # pre-gateway callback shim and its module-level singleton, as documented
  # in that shim's own docstring:
  #   core/helm-charts/pre-gateway/src/enterprise_superclaw_callback_shim.py
  #   (intel-sandbox/applications.ai.enterprise.agentic-ai-stack, module-
  #   scope name `enterprise_superclaw_handler_instance`).
  # NOTE: this only registers the *name* in the callbacks list. Actually
  # delivering enterprise_superclaw_callback_shim.py into the
  # genai-gateway/LiteLLM pod (ConfigMap/volume mount, or a custom image
  # layer) is a separate, not-yet-built wiring step tracked on the AAIS
  # side -- see that repo's core/lib/components/pre-gateway-controller.sh,
  # which explicitly defers it ("Wiring genai-gateway's
  # litellm_settings.callbacks to actually call this service is a
  # separate, later ticket").
  callbackRef: "enterprise_superclaw_callback_shim.enterprise_superclaw_handler_instance"
postgresql:
  enabled: true
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: "<DB_USER>"
    password: "<DB_PASS>"
    database: litellm
    postgresPassword: "<DB_PASS>"
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: ei-infra-eligible
              operator: In
              values: ["true"]
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
redis:
  enabled: true
  architecture: standalone
  image:
    repository: "bitnamilegacy/redis"
  auth:
    enabled: true
    password: "<REPLACE_WITH_REDIS_PASSWORD>"
  master:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: ei-infra-eligible
              operator: In
              values: ["true"]
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
proxy:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
backup:
  enabled: false
  postgresBackupSchedule: "0 2 * * *" # Every day at 2am
  s3:
    enabled: false # Set to true to enable S3 backup
    bucket: s3-for-lite-llm-logs
    region: us-west-2
    accessKeyId: "<REPLACE_WITH_AWS_ACCESS_KEY>"
    secretAccessKey: "<REPLACE_WITH_AWS_SECRET_KEY>"
  pvc:
    enabled: true # Set to true to enable PVC backup
    claimName: postgres-backup-pvc # Update this with your PVC name if using PVC
restoreJob:
  enabled: false # Set to true to enable the restore job
  restoreFile: backup-file.sql #update the restore file name as per your backup naming convention
  source: s3 # options: pvc or s3
namespace: genai-gateway

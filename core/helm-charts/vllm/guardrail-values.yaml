# Values for the guard model behind the content-safety guardrail, served by this
# (the vllm) chart, the same way embedding-values.yaml/reranker-values.yaml make
# this chart serve an embedding/reranker instead of a chat model. The screening
# logic is not here: it is a LiteLLM `custom_code` guardrail rendered from
# core/lib/guardrails/ and registered with the GenAI Gateway by
# playbooks/deploy-guardrails.yml, which calls this release's service directly.
# Guard latency tracks `cpu` below and is paid on every request (the guardrail
# runs pre_call, so it blocks): ~0.8s measured on Xeon when this file requested
# 16 CPUs. The request has since been cut to leave the served LLM more cores, so
# budget more than that -- guard_timeout in the playbook is the fail-closed
# backstop, not a latency target.
# Apply: helm upgrade --install vllm-guard core/helm-charts/vllm \
#          -n guardrails -f core/helm-charts/vllm/guardrail-values.yaml
#
# Model-agnostic on purpose: every tunable below applies to whatever guard model
# is selected. The playbook always overrides LLM_MODEL_ID from guardrail_models
# in agentic-config.cfg, so the value here is only the standalone-`helm install`
# fallback for the command above -- change guardrail_models, not this file.
fullnameOverride: vllm-guard

LLM_MODEL_ID: "Qwen/Qwen3Guard-Gen-0.6B"
cpu: 2
memory: 16Gi

image:
  repository: vllm/vllm-openai-cpu
  tag: "v0.28.0"
  pullPolicy: IfNotPresent

# Use Recreate strategy to avoid rolling update deadlocks on resource-constrained nodes.
# RollingUpdate tries to start new pod before killing old one, but if there's not enough
# CPU for both (twice the `cpu` request above), the new pod stays Pending forever.
deploymentStrategy:
  type: Recreate

# Keep concurrency low for latency, drop --enforce-eager so vLLM compiles.
# The low-latency tuning lives in defaultModelConfigs so it applies to whatever
# guard model LLM_MODEL_ID is set to (driven by guardrail_models in agentic-config.cfg),
# instead of only matching the hardcoded Qwen3Guard key.
defaultModelConfigs:
  configMapValues:
    VLLM_CPU_KVCACHE_SPACE: "4"
    # No VLLM_CPU_OMP_THREADS_BIND on purpose: core ids must not be hardcoded.
    # The NRI balloons policy reserves a cpuset (0,1,64,65,128,129,192,193) that
    # this pod is NOT allowed to run on, and the balloon assigns the pod's cores
    # dynamically at admission. A static "0-15" bind therefore names cores the
    # cgroup forbids -- OMP logs "Warning #124: Ignoring invalid OS proc ID 0/1"
    # and silently falls back, collapsing guard latency to ~120s -- well past the
    # guardrail's 60s fail-closed timeout, so every request gets blocked.
    # Leaving it unset lets vLLM auto-detect the cpuset it was actually given.
    VLLM_CPU_SGL_KERNEL: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    HF_HUB_DISABLE_XET: "1"
    USER: "vllm"
    # Container root fs is read-only; redirect every cache vLLM/HF may write to
    # a writable path so it doesn't fall back to ~/.cache (=/.cache -> EROFS).
    HOME: "/tmp"
    XDG_CACHE_HOME: "/tmp/.cache"
    VLLM_CACHE_ROOT: "/tmp/vllm"
  # No --max-model-len on purpose. This guardrail runs pre_call, so it is handed
  # the same prompt the served LLM is about to receive: if the guard's context
  # window is the smaller of the two, every prompt in the gap is rejected by the
  # guard and blocked (fail-closed) rather than screened -- the guardrail becomes
  # the request-size ceiling for the whole stack. Hardcoding a length here made
  # that ceiling independent of the LLM it guards, so the two drifted silently.
  # Omitting it lets vLLM inherit the guard model's own max_position_embeddings,
  # which is how the served models are configured too (see vllm/xeon-values.yaml
  # -- their extraCmdArgs do not set it either), so both sides track their model.
  # A guard whose native window is genuinely smaller than the served LLM's still
  # needs a deliberate fix (a longer-context guard model, or chunked screening);
  # the guardrail code reports that case distinctly instead of as an unreachable
  # guard, so it is visible in the block message.
  extraCmdArgs: ["--block-size", "128", "--dtype", "bfloat16", "--max-num-seqs", "8"]
  tensor_parallel_size: "1"
  pipeline_parallel_size: "1"
modelConfigs:
  "Qwen/Qwen3Guard-Gen-0.6B":
    # cpu = min(optimal_cpu_cores, workload_cpus); TP=1 keeps it single-NUMA.
    optimal_cpu_cores: 8
    tensor_parallel_size: "1"
    pipeline_parallel_size: "1"

# Mount host Level Zero GPU driver libs — missing from vllm/vllm-openai-xpu image
extraVolumes:
  - name: host-gpu-libs
    hostPath:
      path: /usr/lib/x86_64-linux-gnu
      type: Directory
  - name: host-opencl-vendors
    hostPath:
      path: /etc/OpenCL/vendors
      type: Directory
  - name: host-intel-opencl
    hostPath:
      path: /usr/lib/x86_64-linux-gnu/intel-opencl
      type: Directory

extraVolumeMounts:
  # Whole host lib dir, prepended to LD_LIBRARY_PATH by image.command above.
  - name: host-gpu-libs
    mountPath: /host-gpu-libs
    readOnly: true
  - name: host-gpu-libs
    mountPath: /usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1
    subPath: libze_intel_gpu.so.1
    readOnly: true
  - name: host-gpu-libs
    mountPath: /usr/lib/x86_64-linux-gnu/libze_loader.so.1
    subPath: libze_loader.so.1
    readOnly: true
  - name: host-opencl-vendors
    mountPath: /etc/OpenCL/vendors
    readOnly: true
  - name: host-intel-opencl
    mountPath: /usr/lib/x86_64-linux-gnu/intel-opencl
    readOnly: true

defaultModelConfigs:
  configMapValues:
    SYCL_CACHE_PERSISTENT: "1"
    ZES_ENABLE_SYSMAN: "1"
    HF_HUB_DISABLE_XET: "1"
  extraCmdArgs:
    - "--dtype"
    - "bfloat16"
    - "--max-model-len"
    - "32768"
    - "--gpu-memory-utilization"
    - "0.85"
    - "--disable-log-requests"
  pipeline_parallel_size: "1"
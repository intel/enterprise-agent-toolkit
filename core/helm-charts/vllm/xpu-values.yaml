# Intel XPU-optimized override values for vLLM deployments.
# This file contains XPU-specific overrides for Intel discrete GPU (Arc/Flex/Max) deployments.
# Requires the Intel GPU Plugin (intel-device-plugins-gpu) to be installed on the cluster.

# Intel XPU accelerator device (Arc GPU)
accelDevice: "xpu"

# Kubernetes resource name exposed by the Intel GPU device plugin.
# Use "gpu.intel.com/xe" with the Xe kernel driver (Ubuntu 25.10 / Arc B-series),
# or "gpu.intel.com/i915" on hosts still using the i915 driver.
xpuDeviceResource: "gpu.intel.com/xe"

block_size: 64        # XPU-optimised KV cache block size
max_num_seqs: 128     # Max concurrent sequences
d_type: "float16"
max_model_len: 32768
tensor_parallel_size: "4"

image:
  repository: vllm/vllm-openai-xpu
  tag: "v0.28.0"
  pullPolicy: IfNotPresent
  command: ["bash", "-c", "source /opt/intel/oneapi/setvars.sh --force && export LD_LIBRARY_PATH=/host-gpu-libs:${LD_LIBRARY_PATH} && python3 -m vllm.entrypoints.openai.api_server \"$@\"", "--"]

podSecurityContext:
  supplementalGroups: [990, 44]

securityContext:
  runAsNonRoot: false
  runAsUser: 0

# Node affinity for XPU inference nodes
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: ei-inference-eligible
              operator: In
              values: ["true"]

# Intel XPU runtime settings
VLLM_NO_USAGE_STATS: 1
DO_NOT_TRACK: 1
VLLM_WORKER_MULTIPROC_METHOD: "spawn"

LLM_MODEL_ID: "google/gemma-4-31B-it"
port: 8000


modelConfigs:
  "google/gemma-4-31B-it":
    configMapValues:
      TORCH_LLM_ALLREDUCE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      VLLM_USE_V1: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ATTENTION_BACKEND: "TORCH_SDPA"
      VLLM_TARGET_DEVICE: "xpu"
      ZE_FLAT_DEVICE_HIERARCHY: "FLAT"
      ONEAPI_DEVICE_SELECTOR: "level_zero:*"
      USER: "vllm"
      LOGNAME: "vllm"
      HOME: "/tmp"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      HF_ENDPOINT: "https://huggingface.co"
      SYCL_CACHE_PERSISTENT: "1"
      ZES_ENABLE_SYSMAN: "1"
      CCL_PROCESS_LAUNCHER: "none"
      CCL_WORKER_OFFLOAD: "0"
      CCL_WORKER_AFFINITY: ""
      CCL_ZE_IPC_EXCHANGE: "pidfd"
      CCL_ALLREDUCE: "ring"
      ZE_ENABLE_PCI_ID_DEVICE_ORDER: "1"
      TRITON_CACHE_DIR: "/tmp/.triton"
      TRITON_HOME: "/tmp/.triton"
      XDG_CACHE_HOME: "/tmp/.cache"
    extraCmdArgs:
      - "--host"
      - "0.0.0.0"
      - "--dtype"
      - "float16"
      - "--block-size"
      - "64"
      - "--max-num-batched-tokens"
      - "2048"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--enforce-eager"
      - "--tool-call-parser"
      - "gemma4"
      - "--chat-template"
      - "examples/tool_chat_template_gemma4.jinja"
      - "--trust-remote-code"
      - "--no-enable-prefix-caching"

# Xeon CPU-optimized override values for vLLM deployments
# This file contains lean, CPU-specific overrides for Intel Xeon processors.
# Base values are inherited from values.yaml.
#
# Per-model sizing (optimal_cpu_cores, tensor_parallel_size, pipeline_parallel_size)
# is the canonical source of truth for both the Helm chart and the Ansible
# pre-flight validator (validate-cpu-requirements.sh reads model_benchmark_config.yml
# which mirrors these values).

# CPU deployment - no accelerator device
accelDevice: ""

# CPU Balloon annotation for NRI resource policy (set at deploy time via --set)
cpu_balloon_annotation: ""

resources:
  requests:
    cpu: "{{ .Values.cpu }}"
    memory: "{{ .Values.memory }}"

# CPU-specific vLLM defaults
block_size: 128
max_num_seqs: 256
max_seq_len_to_capture: 2048
d_type: "bfloat16"
max_model_len: 8192

# vLLM CPU image
image:
  repository: vllm/vllm-openai-cpu
  tag: "v0.28.0"
  pullPolicy: IfNotPresent

# Node affinity for Xeon inference nodes
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: ei-inference-eligible
          operator: In
          values: ["true"]

# vLLM CPU environment variables
VLLM_CPU_SGL_KERNEL: "1"
VLLM_NO_USAGE_STATS: 1
DO_NOT_TRACK: 1

LLM_MODEL_ID: ""

modelConfigs:
  "meta-llama/Llama-3.1-8B-Instruct":
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    configMapValues:
      VLLM_CPU_KVCACHE_SPACE: "40"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CPU_SGL_KERNEL: "1"
      TRITON_CACHE_DIR: "/tmp/.triton"
      USER: "vllm"
    extraCmdArgs:
      [
        "--block-size", "128",
        "--dtype", "bfloat16",
        "--distributed_executor_backend", "mp",
        "--enable_chunked_prefill",
        "--enforce-eager",
        "--max-num-batched-tokens", "2048",
        "--max-num-seqs", "256",
        "--enable-prefix-caching",
        "--enable-auto-tool-choice",
        "--tool-call-parser", "llama3_json",
      ]
    # Draft model for speculative decoding (shares the Llama-3 tokenizer). Used only
    # when deployed with --set speculative.enabled=true; ignored otherwise.
    speculativeConfig: '{"method":"draft_model","model":"meta-llama/Llama-3.2-1B-Instruct","num_speculative_tokens":5}'


  "Qwen/Qwen3.6-35B-A3B":
    # Hybrid linear-attention MoE (Qwen3_5MoeForConditionalGeneration, 256 experts /
    # 8 active, 40 layers, full attention every 4th layer) with a vision tower.
    # Deliberately does NOT set --enable-prefix-caching / --enable_chunked_prefill:
    # vLLM's CPU platform check disables both for linear attention on AMX, but only
    # after prefix caching has already selected Mamba cache mode "align" (which sets
    # mamba_block_size), leaving a config that fails validation with
    # "--mamba-block-size can only be set with --enable-prefix-caching".
    # Also no --chat-template override: the model ships its own template, which is
    # multimodal- and thinking-aware and already emits the qwen3_xml
    # <tool_call><function=..><parameter=..> format the parser expects.
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    configMapValues:
      VLLM_CPU_KVCACHE_SPACE: "50"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CPU_SGL_KERNEL: "1"
      TRITON_CACHE_DIR: "/tmp/.triton"
      TORCHINDUCTOR_CACHE_DIR: "/tmp/.torch_compile"
      XDG_CACHE_HOME: "/tmp/.cache"
      # ~70GB of weights — keep on the PVC rather than the ephemeral /tmp
      # emptyDir, which forces a full re-download on every pod replacement.
      HF_HOME: "/data"
      USER: "vllm"
    extraCmdArgs:

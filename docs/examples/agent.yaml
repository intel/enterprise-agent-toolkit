# One agent for user "alice". The Agent must live in user-<username>; the label lets the
# operator delete that namespace once its last agent is gone.
---
apiVersion: v1
kind: Namespace
metadata:
  name: user-alice
  labels:
    intel-stack.io/owner-namespace: "true"
---
apiVersion: intel-stack.io/v1alpha1
kind: Agent
metadata:
  name: demo
  namespace: user-alice
spec:
  owner:
    principal: alice@example.com
    username: alice
  skills: [shell, read_file, list_files]
  workspace:
    AGENTS.md: |
      You are a concise assistant. Answer in one or two sentences.

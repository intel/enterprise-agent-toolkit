---
# =============================================================================
# KubeRay — Teardown
# =============================================================================

- name: "kuberay | teardown | Remove RayCluster release"
  kubernetes.core.helm:
    name: "{{ kuberay_release_name }}"
    release_namespace: "{{ kuberay_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "kuberay | teardown | Remove operator release"
  kubernetes.core.helm:
    name: "{{ kuberay_operator_release_name }}"
    release_namespace: "{{ kuberay_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "kuberay | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ kuberay_namespace }}"
  failed_when: false

- name: "kuberay | teardown | Complete"
  ansible.builtin.debug:
    msg: "KubeRay removed from namespace '{{ kuberay_namespace }}'"

---
# =============================================================================
# Agent Sandbox — Teardown
# =============================================================================
# Removes what install applied: sandbox-router, controller + CRDs (via the
# upstream release manifest), and the namespace.
# =============================================================================

- name: "agent_sandbox | teardown | Remove sandbox-router deployment"
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: sandbox-router
    namespace: "{{ agent_sandbox_namespace }}"
  failed_when: false

- name: "agent_sandbox | teardown | Remove sandbox-router cluster RBAC"
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
  loop:
    - {kind: ClusterRoleBinding, name: sandbox-router}
    - {kind: ClusterRoleBinding, name: sandbox-router-auth-delegator}
    - {kind: ClusterRole, name: sandbox-router}
  failed_when: false

- name: "agent_sandbox | teardown | Remove manifest (CRDs + controller)"
  kubernetes.core.k8s:
    state: absent
    src: "{{ agent_sandbox_manifest_url }}"
  failed_when: false

- name: "agent_sandbox | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ agent_sandbox_namespace }}"
  failed_when: false

- name: "agent_sandbox | teardown | Complete"
  ansible.builtin.debug:
    msg: "Agent Sandbox removed from namespace '{{ agent_sandbox_namespace }}'"

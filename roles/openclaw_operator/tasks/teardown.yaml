# Delete instances while the controller can still clear their finalizers; the chart
# keeps its CRDs on uninstall, so remove them too. Succeeds when nothing is installed.

- name: "openclaw_operator | teardown | List OpenClawInstances"
  kubernetes.core.k8s_info:
    api_version: openclaw.rocks/v1alpha1
    kind: OpenClawInstance
  register: _td_oco_instances

- name: "openclaw_operator | teardown | Delete OpenClawInstances"
  kubernetes.core.k8s:
    state: absent
    api_version: openclaw.rocks/v1alpha1
    kind: OpenClawInstance
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 300
  loop: "{{ _td_oco_instances.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"

- name: "openclaw_operator | teardown | Uninstall the chart"
  kubernetes.core.helm:
    name: "{{ openclaw_operator_release_name }}"
    release_namespace: "{{ openclaw_operator_namespace }}"
    state: absent
    wait: true

- name: "openclaw_operator | teardown | Remove the CRDs"
  kubernetes.core.k8s:
    state: absent
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    wait: true
  loop:
    - openclawinstances.openclaw.rocks
    - openclawclusterdefaults.openclaw.rocks
    - openclawselfconfigs.openclaw.rocks

- name: "openclaw_operator | teardown | Remove the namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ openclaw_operator_namespace }}"
    wait: true
    wait_timeout: 300

- name: "openclaw_operator | teardown | Complete"
  ansible.builtin.debug:
    msg: "OpenClaw operator, its CRDs and namespace '{{ openclaw_operator_namespace }}' removed"

# The servers whose prerequisites are installed (e.g. the sandbox server needs agent-sandbox).

- name: "mcp_servers | Look up the prerequisite CRDs"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  register: _mcp_crds
  loop: "{{ mcp_servers | selectattr('requires_crd', 'defined') | map(attribute='requires_crd') | unique }}"

- name: "mcp_servers | Select the servers to install"
  ansible.builtin.set_fact:
    _mcp_selected: >-
      {{ mcp_servers | rejectattr('requires_crd', 'defined') | list
         + mcp_servers | selectattr('requires_crd', 'defined')
           | selectattr('requires_crd', 'in', _present) | list }}
  vars:
    _present: "{{ _mcp_crds.results | selectattr('resources') | map(attribute='item') | list }}"

- name: "mcp_servers | Servers skipped for a missing prerequisite"
  ansible.builtin.debug:
    msg: "Skipping {{ item.name }}: {{ item.requires_crd }} is not installed"
  loop: "{{ mcp_servers | rejectattr('name', 'in', _mcp_selected | map(attribute='name') | list) }}"
  loop_control:
    label: "{{ item.name }}"

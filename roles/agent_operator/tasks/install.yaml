- name: "agent_operator | Check prerequisites"
  ansible.builtin.assert:
    that:
      - (auth_provider | default('keycloak')) == 'keycloak'
      - claw_model_id | length > 0
    fail_msg: >-
      claw needs auth_provider=keycloak (per-agent identity) and a default model:
      set llm_services_autodeploy_models or claw_model_id.
    quiet: true

- name: "agent_operator | Check the OpenClaw operator is installed"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: openclawinstances.openclaw.rocks
  register: _ao_oc_crd
  failed_when: _ao_oc_crd.resources | default([]) | length == 0

- name: "agent_operator | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ agent_operator_namespace }}"
        labels: >-
          {{ {}
             | combine({'pod-security.kubernetes.io/enforce': 'restricted',
                        'pod-security.kubernetes.io/audit': 'restricted',
                        'pod-security.kubernetes.io/warn': 'restricted'}
                       if (enforce_pss | default(false) | bool) else {})
             | combine({'istio.io/dataplane-mode': 'ambient'}
                       if (istio_enabled | default(false) | bool) else {}) }}

- name: "agent_operator | Keycloak service account"
  ansible.builtin.include_tasks: keycloak.yaml

- name: "agent_operator | Inference gateway request size"
  ansible.builtin.include_tasks: ai_gateway.yaml

- name: "agent_operator | Build the operator image"
  ansible.builtin.include_role:
    name: claw_image
  vars:
    claw_image_name: agent-operator
    claw_image_context: "{{ role_path }}/../../src/claw/agent-operator"

- name: "agent_operator | Install or upgrade the CRDs"
  kubernetes.core.helm:
    name: "{{ agent_operator_crds_release_name }}"
    chart_ref: "{{ role_path }}/../../charts/claw/agent-operator-crds"
    release_namespace: "{{ agent_operator_namespace }}"
    wait: true
    timeout: "{{ agent_operator_wait_timeout }}"

- name: "agent_operator | Install or upgrade the operator"
  kubernetes.core.helm:
    name: "{{ agent_operator_release_name }}"
    chart_ref: "{{ role_path }}/../../charts/claw/agent-operator"
    release_namespace: "{{ agent_operator_namespace }}"
    wait: true
    timeout: "{{ agent_operator_wait_timeout }}"
    values:
      image:
        repository: "{{ claw_image_repository }}"
        tag: "{{ claw_image_tag }}"
      affinity: "{{ _platform_affinity | default({}) }}"
      autoSuspendIdleMinutes: "{{ claw_auto_suspend_idle_minutes }}"
      keycloak:
        url: "{{ claw_keycloak_url }}"
        realm: "{{ claw_keycloak_realm }}"
        credentialsSecret: "{{ claw_keycloak_credentials_secret }}"
      agents:
        model:
          id: "{{ claw_model_id }}"
          baseUrl: "{{ claw_model_base_url }}"
          contextWindow: "{{ claw_model_context_window }}"
      isolation:
        meshAmbient: "{{ istio_enabled | default(false) | bool }}"
        podSecurity:
          enabled: "{{ enforce_pss | default(true) | bool }}"
        maxAgentsPerOwner: "{{ claw_max_agents_per_owner }}"

- name: "agent_operator | Install complete"
  ansible.builtin.debug:
    msg:
      - "Agent operator in namespace '{{ agent_operator_namespace }}'"
      - "Image: {{ claw_image_repository }}:{{ claw_image_tag }}"
      - "Default model: {{ claw_model_id }} via {{ claw_model_base_url }}"
      - "Next: docs/claw.md — create an Agent"

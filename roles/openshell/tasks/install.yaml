---
# =============================================================================
# OpenShell — Install
# =============================================================================
# Requires agent_sandbox (CRDs + controller). The GenAI Gateway provider is
# configured only when the inference LiteLLM is deployed (it runs when auth_type
# is litellm_vkey or litellm_enabled is true); otherwise OpenShell is deployed
# without a provider.
# =============================================================================

# ========================================================================
# Task Group 1: Prerequisites
# ========================================================================
- name: "openshell | Check Kubernetes cluster connectivity"
  ansible.builtin.command: kubectl get nodes
  changed_when: false

- name: "openshell | Check Agent Sandbox API is served (agent_sandbox)"
  ansible.builtin.command: kubectl get crd sandboxes.agents.x-k8s.io -o jsonpath='{.spec.versions[*].name}'
  register: sandbox_crd
  changed_when: false
  failed_when: sandbox_crd.rc != 0 or 'v1beta1' not in sandbox_crd.stdout

# ========================================================================
# Task Group 2: Install OpenShell gateway (Helm)
# ========================================================================
- name: "openshell | Create OpenShell namespaces"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item.name }}"
        labels: "{{ item.labels }}"
  loop:
    - {name: "{{ openshell_namespace }}", labels: {}}
    # The admin workspace: the label makes it one.
    - name: "{{ openshell_sandbox_namespace }}"
      labels: "{{ {openshell_operator_namespace_label.split('=')[0]: openshell_operator_namespace_label.split('=')[1]} }}"
  loop_control:
    label: "{{ item.name }}"

# Seeding a workspace on NFS takes ~16 min (thousands of small files); a node-local class keeps sandbox start fast
- name: "openshell | Find the node-local StorageClass for sandbox workspaces"
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: local-path
  register: _openshell_local_sc
  when: openshell_workspace_storage_class | length == 0

# The chart overlay and the role settings go in as one values dict: an unchanged
# release then compares equal to it and is not upgraded again.
- name: "openshell | Install OpenShell Helm chart"
  kubernetes.core.helm:
    name: "{{ openshell_release_name }}"
    chart_ref: "{{ openshell_chart_ref }}"
    chart_version: "{{ openshell_chart_version }}"
    release_namespace: "{{ openshell_namespace }}"
    values: >-
      {{ lookup('ansible.builtin.file', helm_charts_base_openshell ~ '/values.yaml') | from_yaml
         | combine(helm_overrides | from_yaml, recursive=True) }}
    wait: true
    timeout: "10m0s"
  vars:
    helm_overrides: |
      global:
        image:
          tag: {{ openshell_image_tag | to_json }}
      {% if openshell_image_tag == 'dev' %}
          pullPolicy: Always
      {% endif %}
      server:
        drivers:
          kubernetes:
            operatorNamespaceLabel: {{ openshell_operator_namespace_label | to_json }}
      {% set _ws_sc = openshell_workspace_storage_class if openshell_workspace_storage_class | length > 0
           else ('local-path' if (_openshell_local_sc.resources | default([]) | length > 0) else '') %}
      {% if _ws_sc | length > 0 %}
        workspaceStorageClass: {{ _ws_sc | to_json }}
      {% endif %}
      {% if openshell_oidc_issuer | length > 0 %}
        oidc:
          issuer: {{ openshell_oidc_issuer | to_json }}
          audience: {{ openshell_oidc_audience | to_json }}
      {% else %}
      gatewayConfig:
        openshell.gateway.mtls_auth:
          enabled: true
      {% endif %}
      {% if openshell_upstream_proxy | length > 0 %}
      upstreamProxy:
        url: {{ openshell_upstream_proxy | to_json }}
        noProxy: {{ openshell_upstream_no_proxy | to_json }}
      {% endif %}
  register: openshell_helm

# The sandbox ServiceAccount, the gateway's Role there and the SSH NetworkPolicy. The gateway
# copies only the CA into the workspace; the client key stays in openshell_namespace.
- name: "openshell | Install the admin workspace chart"
  kubernetes.core.helm:
    name: "{{ openshell_release_name }}-workspace"
    chart_ref: "{{ openshell_workspace_chart_ref }}"
    chart_version: "{{ openshell_chart_version }}"
    release_namespace: "{{ openshell_sandbox_namespace }}"
    values:
      gateway:
        serviceAccount:
          name: "{{ openshell_release_name }}"
          namespace: "{{ openshell_namespace }}"
        networkPolicy:
          podSelector:
            app.kubernetes.io/name: openshell
            app.kubernetes.io/instance: "{{ openshell_release_name }}"
    wait: true

# Sandbox routes are served on the gateway port without authentication (0.1.x: client
# certificates are optional, and only the RPCs check identity), so whoever reaches the
# port reaches every exposed sandbox service. Allow only the supervisors and the
# namespaces that call the gateway. kubectl port-forward enters through the kubelet,
# which NetworkPolicy does not filter. Sandbox pods get their policies from OpenShell.
- name: "openshell | Restrict who can reach the gateway"
  kubernetes.core.k8s:
    state: present
    definition: "{{ gateway_np | from_yaml }}"
  vars:
    gateway_np: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: openshell-gateway-ingress
        namespace: {{ openshell_namespace }}
        labels:
          app.kubernetes.io/managed-by: agentic-ai-stack
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: openshell
            app.kubernetes.io/instance: {{ openshell_release_name }}
        policyTypes: [Ingress]
        ingress:
        - from:
          - namespaceSelector: {}
            podSelector:
              matchLabels: {openshell.ai/boundary-role: supervisor}
      {% for ns in openshell_gateway_client_namespaces %}
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: {{ ns }}}
      {% endfor %}
          ports: [{port: 8080, protocol: TCP}]
  when: openshell_gateway_network_policy | bool

- name: "openshell | Verify OpenShell gateway is ready"
  ansible.builtin.command: >
    kubectl rollout status statefulset/{{ openshell_release_name }}
    -n {{ openshell_namespace }} --timeout=300s
  changed_when: false

# ========================================================================
# Task Group 3: GenAI Gateway provider (per-deployment LiteLLM virtual key)
# ========================================================================
- name: "openshell | Check GenAI Gateway is deployed"
  ansible.builtin.command: kubectl get deploy {{ openshell_genai_deployment }} -n {{ openshell_genai_namespace }}
  register: genai_present
  changed_when: false
  failed_when: false
  when: openshell_genai_provider_enabled | bool

- name: "openshell | Configure GenAI Gateway provider"
  when: openshell_genai_provider_enabled | bool and genai_present.rc == 0
  block:
    # The mesh-wide PeerAuthentication is STRICT and the LiteLLM namespace is ambient,
    # so plaintext from the (non-mesh) sandbox supervisor is rejected. Accept it on the
    # LiteLLM pods only, as envoy_gateway does for the edge (eg-gateway-edge); LiteLLM
    # still requires the virtual key. LiteLLM's ingress AuthorizationPolicy admits the
    # sandboxes from the pod network (litellm_allow_pod_network, set in config.yaml).
    - name: "openshell | Let sandboxes reach LiteLLM under STRICT mTLS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: openshell-sandbox-ingress
            namespace: "{{ openshell_genai_namespace }}"
            labels:
              app.kubernetes.io/managed-by: agentic-ai-stack
          spec:
            selector:
              matchLabels: {app.kubernetes.io/name: "{{ openshell_genai_deployment }}"}
            mtls:
              mode: PERMISSIVE
      when: istio_enabled | default(false) | bool

    - name: "openshell | Check for existing LiteLLM virtual key secret"
      ansible.builtin.command: kubectl get secret openshell-genai-key -n {{ openshell_namespace }}
      register: vk_secret
      changed_when: false
      failed_when: false

    # Minted inside the LiteLLM pod so the master key never leaves it.
    - name: "openshell | Mint LiteLLM virtual key for OpenShell sandboxes"
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ openshell_genai_namespace }}"
          - "deploy/{{ openshell_genai_deployment }}"
          - -c
          - litellm
          - --
          - python
          - -c
          - |
            import json, os, urllib.error, urllib.request
            def post(path, body):
                req = urllib.request.Request("http://127.0.0.1:4000" + path, json.dumps(body).encode(),
                    {"Authorization": "Bearer " + os.environ["PROXY_MASTER_KEY"], "Content-Type": "application/json"})
                return json.load(urllib.request.urlopen(req))
            # A key with this alias can outlive the Secret (teardown agent-toolkit); aliases are unique
            try:
                post("/key/delete", {"key_aliases": ["{{ openshell_genai_key_alias }}"]})
            except urllib.error.HTTPError as e:
                if e.code not in (400, 404):
                    raise
            body = {"key_alias": "{{ openshell_genai_key_alias }}",
                    "models": {{ openshell_genai_key_models | to_json }},
                    "max_budget": {{ openshell_genai_key_max_budget }}}
            print(post("/key/generate", body)["key"])
      register: vk_mint
      changed_when: true
      no_log: true
      when: vk_secret.rc != 0

    - name: "openshell | Store LiteLLM virtual key"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openshell-genai-key
            namespace: "{{ openshell_namespace }}"
          type: Opaque
          stringData:
            api_key: "{{ vk_mint.stdout | trim }}"
      no_log: true
      when: vk_secret.rc != 0

    # Resolved on the host: XDG_CONFIG_HOME below cannot take a literal "~".
    - name: "openshell | Resolve home directory of the deploying user"
      ansible.builtin.command: printenv HOME
      register: cli_home
      changed_when: false
      when: openshell_cli_dir | length == 0

    - name: "openshell | Set CLI directory"
      ansible.builtin.set_fact:
        openshell_cli_path: >-
          {{ openshell_cli_dir if openshell_cli_dir | length > 0
             else cli_home.stdout ~ '/.cache/eat/openshell-cli-' ~ openshell_release_tag }}

    # Private before anything is extracted or run from it; fails if another user owns it.
    - name: "openshell | Prepare CLI directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ openshell_cli_path }}"
        - "{{ openshell_cli_path }}/config/openshell/gateways/eat/mtls"

    - name: "openshell | Fetch OpenShell CLI"
      ansible.builtin.unarchive:
        src: "{{ openshell_cli_url }}"
        dest: "{{ openshell_cli_path }}"
        remote_src: true
        creates: "{{ openshell_cli_path }}/openshell"

    - name: "openshell | Write CLI mTLS bundle from the chart secret"
      ansible.builtin.shell: |
        set -o pipefail
        for k in ca.crt tls.crt tls.key; do
          kubectl get secret {{ openshell_client_tls_secret }} -n {{ openshell_namespace }} \
            -o jsonpath="{.data.${k//./\\.}}" | base64 -d > "$k"
        done
        chmod 600 ca.crt tls.crt tls.key
      args:
        executable: /bin/bash
        chdir: "{{ openshell_cli_path }}/config/openshell/gateways/eat/mtls"
      changed_when: false
      no_log: true

    - name: "openshell | Render provider profile"
      ansible.builtin.copy:
        src: "{{ helm_charts_base_openshell }}/genai-gateway-provider.yaml"
        dest: "{{ openshell_cli_path }}/genai-gateway-provider.yaml"
        mode: "0644"

    - name: "openshell | Set GenAI Gateway endpoint in provider profile"
      ansible.builtin.replace:
        path: "{{ openshell_cli_path }}/genai-gateway-provider.yaml"
        regexp: "{{ item.key }}"
        replace: "{{ item.value }}"
      loop:
        - {key: "GENAI_HOST", value: "{{ openshell_genai_service_host }}"}
        - {key: "GENAI_PORT", value: "{{ openshell_genai_service_port }}"}

    - name: "openshell | Register profile and provider through a temporary port-forward"
      ansible.builtin.shell: |
        set -eo pipefail
        kubectl port-forward -n {{ openshell_namespace }} svc/{{ openshell_release_name }} 0:8080 > pf.log 2>&1 &
        PF=$!
        trap 'kill $PF 2>/dev/null' EXIT
        for _ in $(seq 30); do grep -q 'Forwarding from 127.0.0.1' pf.log && break; sleep 1; done
        PORT=$(sed -nE 's/^Forwarding from 127\.0\.0\.1:([0-9]+).*/\1/p' pf.log | head -1)
        [ -n "$PORT" ] || { echo "kubectl port-forward to svc/{{ openshell_release_name }} did not start:" >&2; cat pf.log >&2; exit 1; }
        ./openshell gateway add "https://127.0.0.1:${PORT}" --local --name eat > /dev/null
        # Profiles are workspace-scoped; a global one serves every workspace (--global-profile).
        # Match the gRPC NotFound text: the CLI line-wraps the "provider profile not found" message.
        for _ in 1 2 3; do
          OUT=$(./openshell provider profile export --global eat-genai-gateway 2>&1) && break
          grep -q 'entity was not found' <<< "$OUT" && break
          sleep 2
        done
        RV=$(sed -nE 's/^resource_version: *([0-9]+).*/\1/p' <<< "$OUT")
        if [ -n "$RV" ]; then
          # update is optimistic-concurrency: requires the stored resource_version
          sed -i "/^id: /a resource_version: ${RV}" genai-gateway-provider.yaml
          ./openshell provider profile update --global --file genai-gateway-provider.yaml eat-genai-gateway
        elif grep -q 'entity was not found' <<< "$OUT"; then
          ./openshell provider profile import --global -f genai-gateway-provider.yaml
        else
          echo "$OUT" >&2
          exit 1
        fi
        # The admin workspace record; the namespace and its objects already exist.
        if ! OUT=$(./openshell workspace create --name {{ openshell_sandbox_namespace }} 2>&1); then
          grep -q 'already exists' <<< "$OUT" || { echo "$OUT" >&2; exit 1; }
        fi
        WS="--workspace {{ openshell_sandbox_namespace }}"
        if ./openshell provider get $WS {{ openshell_genai_provider_name }} > /dev/null 2>&1; then
          echo "provider exists"
        elif ! OUT=$(OPENAI_API_KEY="$(kubectl get secret openshell-genai-key -n {{ openshell_namespace }} -o jsonpath='{.data.api_key}' | base64 -d)" \
            ./openshell provider create $WS --name {{ openshell_genai_provider_name }} \
              --type eat-genai-gateway --global-profile --credential OPENAI_API_KEY 2>&1); then
          # a transient get failure must not fail a re-run
          grep -q 'already exists' <<< "$OUT" || { echo "$OUT" >&2; exit 1; }
          echo "provider exists"
        fi
      args:
        executable: /bin/bash
        chdir: "{{ openshell_cli_path }}"
      environment: "{{ openshell_cli_env }}"
      register: provider_reg
      changed_when: "'provider exists' not in provider_reg.stdout"

  always:
    - name: "openshell | Remove CLI credentials"
      ansible.builtin.file:
        path: "{{ openshell_cli_path }}/config"
        state: absent
      when: openshell_cli_path is defined

# ========================================================================
# Task Group 4: Summary
# ========================================================================
- name: "openshell | Deployment summary"
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "  OpenShell deployed successfully!"
      - "  Chart      : {{ openshell_chart_ref }}:{{ openshell_chart_version }} (images {{ openshell_image_tag }})"
      - "  Gateway    : {{ openshell_release_name }}.{{ openshell_namespace }}.svc.cluster.local:8080 (mTLS)"
      - "  Workspaces : namespaces labeled {{ openshell_operator_namespace_label }}; admin workspace {{ openshell_sandbox_namespace }}"
      - "  Auth       : {{ 'OIDC ' + openshell_oidc_issuer if openshell_oidc_issuer | length > 0 else 'mTLS client certificate, ClusterIP-only (port-forward)' }}"
      - "  Provider   : {{ openshell_genai_provider_name if (genai_present.rc | default(1)) == 0 else 'none (GenAI Gateway not deployed)' }}"
      - "============================================================"
      - "  Quick-start (admin):"
      - "    kubectl port-forward -n {{ openshell_namespace }} svc/{{ openshell_release_name }} 8080:8080 &"
      - "    # client mTLS bundle: secret {{ openshell_client_tls_secret }} in {{ openshell_namespace }}"
      - "    openshell gateway add https://127.0.0.1:8080 --local --name eat"
      - "    openshell sandbox create --workspace {{ openshell_sandbox_namespace }} --name demo --provider {{ openshell_genai_provider_name }} \\"
      - "      --env OPENAI_BASE_URL=http://{{ openshell_genai_service_host }}:{{ openshell_genai_service_port }}/v1"

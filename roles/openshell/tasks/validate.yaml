---
# =============================================================================
# OpenShell — Validate
# =============================================================================

- name: "openshell | validate | Verify OpenShell gateway is ready"
  ansible.builtin.command: >
    kubectl rollout status statefulset/{{ openshell_release_name }}
    -n {{ openshell_namespace }} --timeout=60s
  register: _val_gateway
  changed_when: false

- name: "openshell | validate | Summary"
  ansible.builtin.debug:
    msg:
      - "Gateway: {{ 'OK' if _val_gateway.rc == 0 else 'FAIL' }} (statefulset/{{ openshell_release_name }} in {{ openshell_namespace }})"

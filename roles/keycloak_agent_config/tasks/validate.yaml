---
# =============================================================================
# Keycloak Agent Config — Validate
# =============================================================================

- name: "keycloak_agent_config | validate | Check KeycloakRealmImport"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    name: "{{ keycloak_agent_realm }}"
    namespace: "{{ keycloak_namespace }}"
  register: _val_realm
  failed_when: >-
    _val_realm.resources | default([]) | length == 0 or
    (_val_realm.resources[0].status.conditions | default([])
     | selectattr('type', 'eq', 'Done') | selectattr('status', 'eq', 'True') | list | length == 0)

- name: "keycloak_agent_config | validate | Summary"
  ansible.builtin.debug:
    msg: "Realm '{{ keycloak_agent_realm }}': OK"

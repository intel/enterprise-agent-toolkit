---
# =============================================================================
# Keycloak Agent Config — Validate
# =============================================================================

- name: "keycloak_agent_config | validate | Check KeycloakRealmImport"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    name: "{{ keycloak_agent_realm }}"
    namespace: "{{ keycloak_namespace }}"
  register: _val_realm
  failed_when: _val_realm.resources | default([]) | length == 0

- name: "keycloak_agent_config | validate | Summary"
  ansible.builtin.debug:
    msg:
      - "Realm '{{ keycloak_agent_realm }}': {{ 'OK' if _val_realm.resources | length > 0 else 'FAIL' }}"
      - "Client: {{ keycloak_agent_client_id }}"

# Agents and grants stay; the API, its route, client and realm roles go. Succeeds when nothing is installed.

- name: "agent_backend | teardown | Uninstall the API"
  kubernetes.core.helm:
    name: "{{ agent_backend_release_name }}"
    release_namespace: "{{ agent_operator_namespace }}"
    state: absent
    wait: true

- name: "agent_backend | teardown | Remove the API client credentials"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ agent_backend_api_secret }}"
    namespace: "{{ agent_operator_namespace }}"

- name: "agent_backend | teardown | Remove the realm configuration"
  ansible.builtin.include_tasks: keycloak.yaml
  vars:
    _kc_script: keycloak-realm-remove.sh
    _kc_args: ["{{ agent_backend_api_client }}"]

---
# =============================================================================
# Agent Toolkit Configuration — enterprise.agent-toolkit
# =============================================================================
# Role defaults live in roles/<name>/defaults/main.yaml.
# Override any of them here.  `es_auto_installer.sh init agent-toolkit` seeds
# this file into env/<env>/config.agent-toolkit.yaml and the installer loads
# that seeded copy: edit the copy to change an existing environment.
# =============================================================================

# --- API access (inference layer) ---
# The toolkit serves agents through the LiteLLM gateway: virtual keys per agent or
# sandbox, the content-safety guardrail, Langfuse tracing and the OpenShell provider.
# Set "jwt" for Keycloak JWT access to the AI gateway instead (no LiteLLM).
# This release reads auth_provider in global_config.yaml instead ("keycloak" for JWT).
auth_type: "litellm_vkey"
# Content-safety guardrail: on with LiteLLM; set false here to turn it off.
guardrails_enabled: "{{ (auth_provider == 'litellm') if auth_provider is defined else ((auth_type | default('jwt')) == 'litellm_vkey') }}"
# LiteLLM model "hybrid-router"
hybrid_router_enabled: true
# Model API paths published on LiteLLM's route
litellm_public_paths:
  - /v1/chat/completions
  - /v1/completions
  - /v1/embeddings
  - /v1/models
  - /health/liveliness
  - /v1/responses
  - /v1/rerank
  - /v1/audio/transcriptions
  - /v1/audio/speech

# --- Default model (inference layer, applied only where this layer is provisioned) ---
# Deployed on install.
# Set [] to install without a chat model; deploy others with ./model-manager deploy <name>.
# claw adds bge-base-en, which embeds agent memory.
llm_services_autodeploy_models: "{{ ['qwen2-5-coder-14b'] + (['bge-base-en'] if claw_enabled | default(false) | bool else []) }}"

# --- vLLM Semantic Router dashboard (inference layer; applies only with vllm_sr_enabled) ---
# Served at https://vllm-sr.<base_domain_name>/
vllm_sr_dashboard_enabled: true
# Client-facing name of the vLLM Semantic Router model in LiteLLM (litellm mode).
vllm_sr_litellm_model_name: "vllm-sr/auto"

# --- In-cluster image registry (platform; kubespray addon) ---
kubernetes_registry_enabled: true

# --- Redis Stack ---
redis_stack_namespace: "redis"
redis_stack_storage_class: ""          # empty = cluster default StorageClass
redis_stack_persistence_size: "10Gi"

# --- pgvector ---
pgvector_namespace: "pgvector"
pgvector_database: "agentdb"
pgvector_username: "agentuser"
pgvector_storage_size: "20Gi"

# --- Agent Sandbox ---
agent_sandbox_namespace: "agent-sandbox-system"
agent_sandbox_version: "v0.5.0"

# --- OpenShell  ---
openshell_enabled: false
openshell_oidc_issuer: ""   # OIDC login (e.g. a Keycloak realm URL); empty = single-admin via kubectl port-forward
# Sandboxes run outside the Istio mesh, so with OpenShell on the inference layer's
# LiteLLM admits them from the pod network on its API port; they still use the minted
# virtual key. On a bring-your-own cluster, also set kubernetes_cluster_cidr to its pod CIDR.
litellm_allow_pod_network: "{{ openshell_enabled | bool }}"

# --- KubeRay (optional — disabled by default) ---
kuberay_enabled: false
kuberay_namespace: "ray-system"
kuberay_operator_version: "1.3.0"

# --- Istio mesh ---
# Namespaces LiteLLM admits; add your own ambient-labelled agent namespace here.
litellm_allowed_namespaces:
  - "{{ gateway_namespace | default('envoy-gateway-system') }}"
  - "{{ litellm_namespace | default('litellm') }}"
  - "{{ agent_sandbox_namespace }}"
  - "{{ kuberay_namespace }}"

# --- Keycloak ---
# Optional in LiteLLM mode: set keycloak_enabled: true for the realm.
keycloak_agent_realm: "agent-toolkit"

# --- claw: persistent OpenClaw agents (optional — disabled by default) ---
# Turns on the OpenClaw operator. See docs/claw.md.
claw_enabled: false
# Pinned release; bump the version and both digests together (see the role defaults).
openclaw_operator_version: "0.38.3"
openclaw_operator_digest: "sha256:a5c71a40098baac5e8fe5ffacf97bb9593c0b67712628b21af67b580929fa51a"
openclaw_operator_image_digest: "sha256:ca7ad419da6cfa6de5d088be2ee4af3be0120f735741b30652676dadce2f690d"
